  - id: the-coverage-gate-is-declared-and-unenforced           # "D8"
    owner: claude
    opened: 2026-08-20
    what: >-
      `vitest.config.ts` declares coverage thresholds (lines 80 / functions 80 / branches 70 /
      statements 80) and no pipeline evaluates them. CI runs `npm test`; `npm run test:coverage`
      is never invoked by `gate` or by any workflow. Measured 2026-08-20 the project was well
      over every threshold, which is exactly why this went unnoticed.
    why_it_matters: >-
      A declared-but-unevaluated threshold is worse than an absent one: it is counted as
      protection in the very review that should have caught its absence. This is the same shape as
      every entry in lib/ops/ — a guard that lives somewhere nothing calls is a guard on nothing —
      and the same shape as the finding that produced verify-scripts-documented.test.ts.
      Because the numbers currently pass with margin, turning enforcement on costs nothing today
      and is only ever more expensive later.
    ends_when: >-
      A pipeline evaluates the declared thresholds on every push, and the evaluation has been
      proven to fail by planting a violation (a threshold raised above the real figure, or an
      uncovered file) rather than only by passing once.
    closed:
      date: 2026-08-20
      what_shipped: >-
        .github/workflows/ci.yml — the Test step now runs `npm run test:coverage` instead of
        `npm test`. Same suite, once, with instrumentation, and the job fails when a declared
        threshold is breached. A second step was rejected: it would run ~3000 tests twice to
        learn one more fact.
      measured_before_switching_on: >-
        91.47% statements, 85.2% branches, 90.99% functions, 92.69% lines, against declared
        thresholds of 80/80/70/80 — over every one with margin. ⚠️ That margin is why this was
        free today and would only ever have been more expensive later, and it is also why the
        gap survived so long: nothing was failing, so nothing drew attention to the fact that
        nothing was checking.
      proven_to_fail: >-
        Branches was raised from 70 to 99 against a real figure of 85.2, and the command exited 1
        with "ERROR: Coverage for branches (85.2%) does not meet global threshold (99%)". The
        config was then restored and verified byte-identical by checksum, so no threshold was
        altered by this change — only whether anything reads them.
      the_thresholds_were_not_touched: >-
        Deliberately. The declared numbers are unchanged at 80/80/70/80; the only change is that
        something now evaluates them. Adjusting a threshold in the same commit that first
        enforces it would make the new figure unfalsifiable, and lowering one to fit reality is
        the prohibited move this entry exists to guard against.

  - id: the-csp-report-sink-expires-before-anyone-reads-it     # "D9"
    owner: steve
    opened: 2026-08-20
    what: >-
      `next.config.mjs` enforces four CSP directives and additionally ships a
      `Content-Security-Policy-Report-Only` header carrying `script-src` and others, with
      `report-uri /api/csp-report`. That route writes to stderr and nowhere else. Vercel runtime
      log retention was measured on 2026-08-20 at approximately 24 hours (a 7-day query and a
      24-hour query returned identical counts), and `/api/csp-report` did not appear among the 29
      distinct request paths in the retained window.
    why_it_matters: >-
      The point of a report-only period is to gather evidence for enforcing. This one cannot: its
      only sink expires before anybody reviews it, so the follow-on that ratified.
      csp-enforce-the-safe-four points at — enforcing `script-src` — has no data behind it and no
      way to accumulate any. Leaving it as-is is not a cautious middle state; it is a permanent
      report-only header that costs bytes on every response and informs nothing.
      ⚠️ Do not read "no reports observed" as "no violations". One day of mostly-synthetic traffic
      is not evidence, and that is the finding, not the reassurance.
    ends_when: >-
      Either the reports land somewhere that outlives a day and a decision is taken on real data,
      or `script-src` is enforced on a written argument and the report-only header is removed.
      Silently extending the report-only period is the third option and is the current state.
    closed:
      date: 2026-08-20
      decided_by: steve
      option: >-
        C — both. Enforce the policy that is safe today, AND point report-only at the next rung,
        AND give it a sink that outlives a day. Neither half alone was sufficient: enforcing
        without a stricter report-only leaves the nonce question unmeasured forever, and
        persisting reports without enforcing delays all protection while evidence accumulates
        about only one directive.
      what_shipped: >-
        next.config.mjs — the full policy moved to `Content-Security-Policy`, and
        `Content-Security-Policy-Report-Only` now carries the same policy with `unsafe-inline`
        and `unsafe-eval` removed from script-src. Both are built from one shared definition, so
        they cannot drift apart. Migration 038 (`csp_reports`) applied to BOTH regions;
        lib/ops/csp-report-store.ts writes to it, fail-open, with the 42P01 latch
        signin-attempts.ts established.
      why_enforcing_was_worth_more_than_the_old_note_said: >-
        The config claimed enforcing while `unsafe-inline` remains "would buy very little". For a
        product that decrypts plaintext in the browser, the threat is EXFILTRATION, not execution.
        `unsafe-inline` concedes that an injected script may run; connect-src, img-src,
        form-action and default-src stop it sending what it found anywhere. Only navigation
        remains, and navigation is visible to the person sitting there. Silent theft becomes
        visible theft — most of the practical protection, with no middleware.
      # 🔴 THE FINDING THAT ONLY A BROWSER COULD PRODUCE.
      grep_was_wrong: >-
        The pre-decision measurement said "zero third-party scripts", from searching the source.
        @vercel/analytics INJECTS a script from va.vercel-scripts.com at RUNTIME, so it appears in
        no grep for `<script>` or `fetch(`. Loading four pages in a real browser found it in
        seconds. ⚠️ Any future change to these directives needs a browser, not a search — and the
        obvious fix was also wrong: that origin is DEV-ONLY (production loads
        /_vercel/insights/script.js, same-origin, verified in the package bundle AND in
        relaystandby.com's served HTML), so adding it to script-src would have permanently widened
        production for a script production never loads. Recorded in next.config.mjs beside the
        directive so nobody silences the dev console at production's expense.
      what_the_report_only_header_will_actually_say: >-
        Production HTML carries 2 inline `<script>` blocks with NO nonce (`self.__next_f` — RSC
        payload streaming), so the stricter policy WILL report on essentially every page load.
        That is the measurement, not a fault: the question is whether anything OTHER than Next's
        own bootstrap appears. ⚠️ Dev showed NO report-only violations at all — a Turbopack-dev
        artifact. Do not read dev silence as evidence that the nonce work is unnecessary.
      proven_end_to_end: >-
        POST to /api/csp-report returned 204 and a row landed in the production cluster carrying
        the disposition, with the query string STRIPPED and script-sample absent — both privacy
        protections observed rather than assumed. The synthetic row was then deleted; the table
        starts empty so the first real window is uncontaminated.
      # ✅ RESOLVED 2026-08-20, LATER THE SAME DAY — delivery works.
      browser_delivery_confirmed: >-
        A real browser DID deliver. `csp_reports` holds a row written 2026-08-20T22:30:34Z:
        disposition=report, directive=script-src-elem, blocked=inline,
        document=https://relaystandby.com/security — the inline RSC script the stricter policy
        targets, from a genuine page load, landing about a second after it. The whole chain is
        proven: stricter policy fires -> browser posts -> endpoint stores -> durable row.
        ⚠️ The earlier "zero rows after 90s" reading was not wrong, it was EARLY: those checks ran
        before the /security navigation that produced this row. A negative result whose window
        closed before the event is not evidence of absence — which is the same mistake the
        caveat below was written to prevent, made while writing it.
      # ⚠️ BUT DO NOT READ THIS TABLE AS A VIOLATION CENSUS.
      delivery_is_lossy_by_design: >-
        Three production pages were loaded, each carrying two un-nonced inline scripts, so six
        violations occurred and ONE row exists. The Reporting API batches, delays, dedupes and
        drops at the browser's discretion, and headless browsers are stingier still. So the table
        proves violations HAPPEN and the pipeline WORKS; it does not count them. When the nonce
        decision is finally taken, read this table for WHICH directives and WHICH sources appear —
        never for how many, and never conclude "rare" from a low row count.
      # 🔴 KEPT: the reasoning that produced the check, and it still binds for the next reader.
      browser_delivery_was_unproven_until_then: >-
        The policy FIRES and the endpoint WORKS; what has not been observed is a browser
        DELIVERING a report between the two. Verified on production 2026-08-20: each page logs
        exactly two violations, matching its two inline RSC scripts — but they log at INFO level
        ("The policy is report-only, so the violation has been logged but no further action has
        been taken"), and after ~90 seconds and a page close, csp_reports held ZERO rows.
        Headless Chromium is known to be unreliable about out-of-band Reporting API delivery, so
        this is probably a harness artifact rather than a product defect — but PROBABLY IS NOT
        PROVEN.
      how_to_tell_the_difference: >-
        ⚠️ An empty csp_reports table has TWO possible meanings and they are opposite: "nothing
        violates the stricter policy" (a green light for the nonce work) or "reports are not being
        delivered at all" (no information whatsoever). Do not read the first from an empty table.
        Check with a REAL browser — open relaystandby.com in ordinary Chrome or Firefox, then
        query the table. If rows appear, delivery works and the window is real. If they do not,
        the delivery path needs fixing before any nonce decision rests on this data, and the
        reliable fallback is a `securitypolicyviolation` event listener POSTing to the same
        endpoint rather than relying on the Reporting API.
      an_input_to_the_nonce_decision_found_on_the_way: >-
        Chrome's violation message offers a per-script SHA-256 hash as an alternative to a nonce.
        That is a real third option in principle — but these are RSC streaming payloads whose
        content differs per page and per render, so their hashes are not stable and a hash
        allowlist cannot work here. Nonces (and therefore Node-runtime middleware) remain the only
        viable route, which is worth knowing before someone proposes hashes as the cheap way out.
      the_guard_was_inverted_not_relaxed: >-
        lib/ops/security-headers.test.ts refused every page-blanking directive on the enforcing
        header. That premise is now the ratified decision, so the guard would have been refusing
        the change it existed to protect. It now asserts the opposite and sharper danger — that
        `'unsafe-inline'` is never removed from the ENFORCING script-src without nonces landing in
        the same change, a one-word deletion that white-screens the product FOR EVERYONE and reads
        as tightening security — plus that report-only stays strictly stricter than enforcing,
        which is the defect this entry found.
      still_open_downstream: >-
        The nonce/middleware decision itself. It is now measurable for the first time; it was not
        before. Revisit once `csp_reports` holds a real window of production traffic and the
        question "does anything other than Next's bootstrap violate script-src 'self'" has an
        answer with a date on it.

  - id: the-journey-sweep-is-stale                             # "D10"
    owner: claude
    opened: 2026-08-20
    what: >-
      `docs/user-journeys.md`'s NEWEST walk record is the full production re-sweep of
      **2026-08-13**, not the 2026-08-08 sweep above it — this entry said 2026-08-08 until
      2026-08-21 and was contradicted by the same file it was describing, and by
      `journeys.J1..J10.walked` in this one. The real staleness is 2026-08-13 -> HEAD.
      ⚠️ The commit counts this entry used to quote (444, then 264) were hand-copied volatile
      numbers, which is the drift this file's own rule exists to stop. Derive it instead:
      `git rev-list --count --since=2026-08-13 HEAD`.
      `verify:live` covers five walks; J3, J6 and J9 are not among them, so those three have no
      automated cover either.
    why_it_matters: >-
      The sweep table is named in CLAUDE.md as an authority for build state, alongside this file.
      An authority that is 444 commits behind is worse than no authority, because it is still
      being cited. The three journeys with neither a recent walk nor `verify:live` cover are the
      ones where a regression would currently be found by a user.
    ends_when: >-
      The sweep is re-walked and its table re-dated, AND a decision is recorded for J3/J6/J9:
      either they join `verify:live`, or they are explicitly walk-only with that stated in the
      table so the gap is visible rather than accidental.
    closed:
      date: 2026-08-21
      what_shipped: >-
        CLOSED BY BUILDING THE WALKS, not by re-dating a table. The scope decision `ends_when`
        asked for was taken, and it is the expensive half: J3, J6 and J9 each gained an automated
        walk (`scripts/e2e-delegate.ts` 27 checks, `scripts/e2e-request.ts` 31,
        `scripts/e2e-standdown.ts` 23), chained as `npm run verify:journeys`. J4's `/circle`
        add-a-person form - the fourth gap, named in `docs/user-journeys.md`'s own header and NOT
        in this entry - gained real-browser cover inside `scripts/e2e-ui.ts`, which went from 26
        checks to 34. All four ran green against the deployed build on 2026-08-21. A hand sweep
        would have gone stale again within weeks, and that is the failure this entry records, so
        re-walking alone was rejected as the fix.
      not_in_verify_live_and_why: >-
        WARNING - `verify:journeys` is a SEPARATE chain and deliberately not appended to
        `verify:live`. `/api/auth/signup` allows 10 per hour per IP, and the existing five-walk chain
        performs EXACTLY 10 signups: it already sits at its own ceiling with zero headroom. The three
        new walks add 5 more, so a combined chain would fail part-way through on the 11th signup as a
        bare 429, which reads exactly like a flaky test. Tracked as
        `the-live-chain-sits-at-its-own-signup-limit`.
      what_it_found: >-
        Two product findings, both entered here as their own rows rather than quietly fixed inside a
        verification change: `approve-is-unreachable-before-the-first-rule` and
        `the-live-chain-sits-at-its-own-signup-limit`. Three of the walks' OWN first-draft assertions
        were also wrong in the flattering direction, and are corrected in place with the reason
        written down: `ownerChallenged` reports mail success rather than that a challenge exists; a
        `kind: policy` post was refused by the kind check and read as a scope refusal (a false green,
        now asserted through the accessor instead); and `/circle`'s Add button is enabled by default
