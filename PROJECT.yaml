    opened: 2026-08-21
    what: >-
      A restore has run exactly once - 2026-08-08, timed - and no recurring drill exists.
      `docs/backup-restore-runbook.md` asks in its own words for a `d3-restore-drill` gate in this
      file with the two candidate dates as target and ratify_by, and says plainly that until that
      entry exists "everything above is a note, and a note is what the last one was". ROADMAP
      section 2-D (D3) and section 5 both say to schedule one. This file had no entry at all, which
      is the gap the runbook names.
    why_the_2026_08_08_run_no_longer_counts: >-
      The success criteria CHANGED on 2026-08-19, when `verify:kms` was folded in. A restored
      cluster is ciphertext without the key, so a drill that never unwraps an item has not proven a
      recovery - it has proven a database restore. The 2026-08-08 run predates that criterion and
