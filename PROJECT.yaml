      (4) record the RTO actually observed, delete the scratch cluster, and confirm both production
      clusters are still ACTIVE with deletion protection on.
    why_it_is_steve_and_not_claude: >-
      It commits AWS admin time and it spends money on a scratch cluster. The runbook is explicit
      that PROJECT.yaml is not edited from that lane. Claude has done the half that needed no
      approval: `verify:kms` is proven runnable and green, so step 2 is ready. Steps 1, 3 and 4
      need credentials Claude should not use unattended and a cost only Steve can authorise.
    ends_when: >-
      Steve ratifies a `d3-restore-drill` gate under `gates` with an owner, the two dates above as
