# PROJECT.yaml — machine-readable project contract. Single source of truth for volatile
# facts and gates; prose docs reference this file, they never restate its values.
# Standard: global CLAUDE.md "Documentation & Claim Discipline" (2026-07-01). Checked by /roadmap-lint.

name: relay

# No standalone ROADMAP exists — the forward/commercial roadmap lives in the Build Spec §16–27
# (the richest strategy doc in the portfolio, per the 2026-07-01 audit; its gap is operational
# sequencing, which the gates below supply).
authoritative_plan: specs/Relay_H0_Build_Spec_v2.md

# Ratified architecture direction as of 2026-08-11. Subsidiary to the Build Spec above, which stays
# authoritative for strategy; this is authoritative for HOW release access is delivered. It removes
# the credential from the delivery path: every named person claims a standby account in calm, and at
# release nothing secret is transmitted. Supersedes relay-standby-pivot.md, which is retained for
# its reasoning. Recorded here because a direction that is not discoverable from this file is a
# direction the next session will not find.
architecture_plan: docs/standby-architecture.md   # version: hybrid+6

# dogfooded = deployed live + full E2E dogfood on real Aurora DSQL + KMS (2026-06-27), H0-submitted.
# Promote to customer-used only at the first arms-length user — which is gated on G1/G2 below.
#
# 2026-08-07: Sprints 1-4 of docs/implementation-plan-4-sprints.md shipped and deployed. The H0
# spine remains dogfooded; the NEW surfaces (policies, delegation, verifier decisions, access
# requests) are live-proven at the lib/API layer against the real cluster but have NOT been
# dogfooded through the UI end to end. They are "live-proven", not "dogfooded" — do not conflate.
#
# SUPERSEDED 2026-08-08: all ten journeys were walked against production as a brand-new self-serve
# account (sweep table at the top of docs/user-journeys.md), closing the distinction the note above
# draws for those newer surfaces.
#
# STAYS `dogfooded` as of 2026-08-09, deliberately. A real card was charged on 2026-08-08 — but it
# was the owner's own card. Paying yourself is not a customer, so it advances nothing here:
# `customer-used` needs an arms-length user and `revenue-proven` needs arms-length money. Promotion
# stays gated on G1/G2, and market.wtp_evidence is still `none`.
ladder: dogfooded

derived:
  test_count: "npx vitest run 2>&1 | grep -E 'Tests .* passed' | tail -1   # static proxy: grep -rE '\\b(it|test)\\(' --include='*.test.*' lib src | wc -l"
  head: "git rev-parse --short HEAD"
  branch: "git branch --show-current"

# Sequencing rule (from the 2026-07-01 audit): NO further building until G1 produces evidence.
# Full chain: G1 WTP -> G2 counsel -> G3 B2B2C pilot LOI -> G4 billing MVP -> G5 audited crypto.
# G3–G5 enter this file as gates only after G1/G2 pass — deliberately not scheduled before evidence.
gates:
  - id: h0-verdict-disposition
    metric: post_judging_decision (H0 judging ends 2026-07-24; winners ~2026-07-31; DSQL/KMS teardown auto-fires 7-25)
    target: "explicit commercialize / park / archive decision recorded within a week of results"
    kill: "n/a — the decision itself is the gate"
    owner: steve
    due: 2026-08-07
    met:
      date: 2026-08-07
      result: "WIN — H0 'Most Impactful' ($2k cash + $2k AWS credits, announced 2026-08-05)"
      decision: commercialize
      rationale: "Per pre-committed disposition plan (docs/h0-disposition-plan.md, 2026-07-03): a win is distribution ammunition, and every branch runs G1 before any park/archive call. The judges' verdict is evidence about the hackathon, not about the market."
      next: "G1 paid lanes (docs/g1-launch-checklist.md) — the instrument is now live-proven end to end on production (2026-08-07): all six funnel events observed on the wire carrying src attribution. Start G2 counsel outreach the same week (docs/g2-counsel-brief.md)."
      caveat: "G1 has still measured ZERO traffic. N=0 qualified. This gate records the disposition, not demand evidence."
  - id: g1-caregiver-wtp
    metric: willingness_to_pay_signal (landing + price test on the caregiver wedge, N>=100 qualified visitors)
    target: ">= 2% click-to-intent at a real price point  # ratified by Steve 2026-07-01"
    kill: "< 0.5% after 100+ qualified -> park D2C; B2B2C-only or archive  # ratified 2026-07-01"
    owner: steve
    due: 2026-10-31
    moved:
      from: 2026-09-15
      date: 2026-08-11
      by: steve
      why: "Consequence of ratified.build-standby-before-g1. The old date required the first ad
        SERVING by 08-18 to fit a 4-week window, and sprint C alone (passkeys, with no first-class
        next-auth v4 support) does not fit in seven days. Running the flight on the funnel we are
        replacing would spend the ratified $250 on a reading of the old product -- the exact
        known-bad reading the build ruling was made to avoid."
      derivation: "sprints C-E ~4 weeks -> ~09-08; Phase 0 claim conversion measured on the REAL
        claim flow ~09-15; ad serving by ~09-22; 4-week window -> verdict ~10-20; slack -> 10-31."
      unchanged: "thresholds, the $250 ceiling (ratified.g1-flight-power), and the directional-read
        constraint. Only the date moved."
    # ⚠️ This gate has now moved once, deliberately and with a recorded reason. A SECOND move
    # requires the same treatment -- an explicit decision, a derivation, and a record. A gate that
    # slides quietly is how this portfolio accumulates past-due-undecided gates.
    revisit: "at every /daily-priority from 2026-10-01"
  - id: g2-counsel-opinion
    metric: legal_opinion_on_fiduciary_custodian_status (RUFADAA/estate access — REQUIRED before any paying estate customer)
    target: "written counsel opinion obtained"
    kill: "adverse opinion -> B2B2C-through-regulated-partners only, or park  # ratified 2026-07-01"
    owner: steve
    due: 2026-09-30
    declined:
      date: 2026-08-14
      by: steve
      decision: "no counsel will be engaged. Estate is narrowed OUT of the product
        PERMANENTLY rather than held pending an opinion. This gate is closed by
        removing the capability it guarded, not by satisfying it."
      rationale: "Sequencing, on this project's own rule: demand before spend.
        wtp_evidence is none, G1 has measured zero traffic, and no arms-length
        revenue exists anywhere in the portfolio — a $5-15k written opinion before
        one customer is the exact pattern the 2026-07-05 retrospective flagged. The
        2026-08-10 estate-gated-until-counsel rationale also still holds and now
        points further: with no estate customer to win, the cheapest correct move
        is not to offer estate at all. An opinion spanning 12 questions, 50 states
        and the CA divergence would also come back heavily qualified rather than
        as the crisp go/no-go the gate assumed."
      # 🔴 THE FINDING THAT MADE THIS A REAL DECISION RATHER THAN A FORMALITY.
      # The pre-release audit (2026-08-14) established that the estate gate was
      # holding a LABEL, not a mechanism:
      #
      #   - runHeartbeatSweep selects overdue owners and arms EVERY armed
      #     release_state for them (lib/release/heartbeat.ts) — there is no
      #     trigger_type filter.
      #   - Nothing auto-closes a `released` state. It closes only on owner
      #     check-in or stand-down.
      #
      # So an owner who dies stops checking in, goes overdue, their `emergency` or
      # `caregiver` trigger arms, verifiers confirm, access RELEASES — and stays
      # released, because the person who would reverse it is dead. That is an
      # estate handoff. It is "reversible" only in the sense that a dead man could
      # reverse it. Meanwhile src/app/terms/page.tsx states estate functionality
      # "is not offered".
      #
      # The exposure the opinion was meant to price is therefore ALREADY in the
      # shipping product, and refusing the `estate` trigger type never contained
      # it. Declining counsel is defensible; believing the gate was protecting
      # anything was not.
      supersedes: "ratified.estate-gated-until-counsel (2026-08-10), whose 'until'
        is now 'never'. That entry stays as the reasoning that got here."
      instead_of_an_opinion: "the question is made not to arise, which is cheaper
        and entirely in our control:
        (1) estate stays out of USER_SELECTABLE_TRIGGER_TYPES permanently, now
            enforced as a closed door rather than a pending one (lib/ops/gates.test.ts);
        (2) the Terms describe the mechanism actually operated, including that a
            release does not end on its own;
        (3) a recipient-side statement that Relay conveys the access an owner
            chose to share and confers no legal authority — the single highest-value
            mitigation available, and it costs an afternoon."
      residual_risk: "REAL, NAMED, AND ACCEPTED. Questions 4, 5, 7 and 11 of
        docs/g2-counsel-brief.md apply to the product as shipped, not to the gated
        feature, and go unanswered: Relay's exposure for facilitating a recipient's
        login to a third party whose ToS forbids credential sharing (CFAA and state
        analogs behind it); whether that analysis differs once the owner is dead —
        which the heartbeat finding above makes a live question rather than a
        hypothetical; whether N-of-M verifiers take on liability by attesting; and
        the B2B2C regulatory surface. There is also no analysed standard for a
        wrongful release or a wrongful failure to release, in either direction.
        Consequence accepted knowingly: the gate's own kill condition routed an
        adverse opinion to 'B2B2C through regulated partners', and that fallback
        closes too — a bank's diligence asks these same questions, and 'we did not
        look' is a worse answer than an adverse opinion."
      revisit: "ANY of: (a) the first B2B2C conversation with a bank, wealth
        manager or benefits provider — their diligence asks Q1/Q3/Q11 and counsel
        gets funded out of that opportunity; (b) the first arms-length inbound
        asking for estate/inheritance specifically; (c) G1 passing, at which point
        there is revenue to fund the opinion and a reason to want it. Until one of
        those, this stays closed and does not reappear at /daily-priority."

market:
  competitors_doc: docs/COMPETITORS.md   # authored 2026-07-01 (Everplans $99/yr = the price anchor; GoodTrust/Trustworthy; free platform features = the awareness rival) — stale at 60 days
  g1_instrument_verified: "2026-08-07 — all six funnel events observed on the wire against
    production, each carrying src attribution: caregiver_qualified, seed_started, seed_completed,
    reveal_viewed, price_viewed, intent_clicked. Two bugs were found and fixed by this check
    (props were being dropped by a wrong payload shape; the channel key was `channel` where the
    landing page uses `src`). Re-probe if the instrument is touched — a 200 response proves
    nothing about attribution."
  wtp_evidence: none                     # UNCHANGED and load-bearing. One purchase by the owner is
    # not arms-length demand, and caregiver_leads held ZERO rows as of 2026-08-09. G1 is still the
    # test; COMPETITORS.md implication: test at/above Everplans' $99/yr, lead with reversibility.

monetization_path: stripe_live_annual   # $119/yr, live-mode Stripe, charged end to end 2026-08-08.
# CORRECTED 2026-08-09. This field read `none` with the comment "there is NO payment processor and
# no money can be taken" for a day AFTER a real card was charged on relaystandby.com. That is the
# exact drift the claim-discipline rule exists to prevent, in the one file the rule names as the
# source of truth — so it is recorded here rather than quietly overwritten.
#
# What is actually true: checkout is live (src/app/api/stripe/checkout), the webhook reconciles
# subscription state, entitlements read the tier, and as of 2026-08-09 a subscriber can cancel
# self-serve through the Stripe billing portal (src/app/api/stripe/portal) — before that, nothing
# in the product could cancel a subscription and closing an account left the card being charged.
# Money can be taken AND stopped. That pair is what makes this a monetization path rather than a
# checkout button.

post_event_plan: "h0-verdict-disposition gate + auto-scheduled teardown (CCR triggers 7-25 + 7-31 tickler); commercial fork = the G1->G5 chain"

# Decisions ratified by Steve, recorded here so they stop reading as open items
# in the pre-ads blocker list. Each one had been authored but never confirmed.
ratified:
  - id: refund-stance
    date: 2026-08-09
    decision: "30-day money-back guarantee on every charge (renewals included), then no refund of the unused part of a year"
    supersedes: "no refund by default, with an email-us escape — authored, never confirmed"
    implemented: "lib/offer.ts is the single definition; consumed by the Terms, the /caregivers price card and the in-product PriceCard, pinned by lib/offer.test.ts"
    note: "Refunds are issued BY HAND in the Stripe dashboard — nothing in the codebase refunds, and Stripe's portal cancels without refunding. The copy routes to a human by design, and a test enforces that it keeps doing so."
  - id: g1-flight-power
    date: 2026-08-10
    decision: "hold the $250 ceiling and accept a DIRECTIONAL G1 read"
    detail: "The 2026-08-08 amendment to docs/g1-wtp-test-design.md puts the honest minimum at
      N ~= 250 for the ratio to distinguish 2% from 0.5%. The ratified $250 ceiling buys roughly
      125-200 clicks at $1-2 CPC per g1-channel-send-kit.md, less ad-blocker suppression of the
      analytics events -- so this flight is expected to land near N = 100-180, structurally short."
    rationale: "Steve chose the cheaper path to real caregiver words over a decisive ratio. The
      amendment already forbids a bare ship OR kill call on the ratio below N=250, and promotes the
      lead count and lead notes to a co-equal read, so the flight still produces a decision -- just
      one carried by lines 3 and 4 of the verdict rather than line 1."
    implemented: "Recorded at the top of the verdict section in docs/g1-flight-log.md, so the
      constraint is in front of whoever writes the verdict rather than in a decision log they may
      not open."
    revisit: "if the observed CPC comes in materially under $1, topping up toward N=250 becomes
      cheap enough to reconsider mid-flight"
  - id: build-standby-before-g1
    date: 2026-08-11
    decision: "build the standby architecture now rather than waiting for G1 evidence"
    supersedes: "the sequencing rule above -- 'NO further building until G1 produces evidence'"
    rationale: "Steve's ruling: the only way we get to G1 is to finish building the modified
      product for beta testing. The sequencing rule was written to stop horizontal build ahead of
      demand, and it is a good rule -- but it assumed the product could be tested as it stands.
      The 2026-08-11 analysis found it cannot: the escalation transition was missing, so the
      incapacity fast path did not work at all, and credential delivery rides a channel measured
      broken (Outlook SCL 5, Resend suppression returning 200). Buying traffic for a funnel whose
      product cannot serve its headline case spends the G1 budget on a known-bad reading."
    scope: "docs/standby-sprint-plan.md sprints A-F. Sprint A shipped 2026-08-11 (b5dc339) as a
      defect fix in its own right and did not need this override."
    unchanged: "G1 itself, its thresholds and its 2026-09-15 hard stop are untouched, as is
      g2-counsel-opinion. This changes WHEN building happens, not what the gates measure."
    risk_accepted: "If claim conversion is poor (sprint plan Phase 0), this build is partly wasted.
      Phase 0 exists to find that out and can run in parallel at no engineering cost."
  - id: estate-gated-until-counsel
    date: 2026-08-10
    decision: "estate stays OUT of the product until g2-counsel-opinion produces a written opinion"
    detail: "Found 2026-08-10: src/app/terms/page.tsx states 'Estate and inheritance functionality
      is not offered', and src/app/how-it-works deliberately excludes it -- while /rules rendered
      its trigger dropdown straight from VALID_TRIGGER_TYPES, so any signed-in owner could create a
      PERMANENT, irreversible estate handoff. The API accepted it too. Live Stripe means such a user
      is a paying estate customer, which is exactly what the g2 gate says requires counsel first."
    rationale: "Steve's call after pushback. The deciding argument was asymmetry, not law: with
      caregiver_leads at 0 and wtp_evidence none there is no estate customer to win today, so
      offering it early buys zero revenue against an uninsurable and irreversible risk -- while
      offering it after counsel costs only waiting. Secondary: every ad creative and the G1
      thresholds are calibrated on the emergency/incapacity positioning, so widening to estate 8
      days before the serving-by date would change what the gate measures."
    implemented: "USER_SELECTABLE_TRIGGER_TYPES in lib/domain/enums.ts, kept deliberately SEPARATE
      from VALID_TRIGGER_TYPES -- the domain still supports estate because Property 7, heartbeat
      blocking and grace windows depend on it, and existing rows must keep working. Enforced at the
      trust boundary, not in the dropdown: /api/rules, /api/policies, /api/triggers/[id]/initiate
      and /api/triggers/[id]/config all refuse it. Pinned by lib/domain/enums.test.ts, which fails
      if the list widens by accident. The estate acknowledgement path in /api/policies is left
      dormant rather than deleted."
    revisit: "when g2-counsel-opinion is met -- re-enabling is moving one string into one list"
  - id: beta-free-release
    date: 2026-08-13
    decision: "the free tier CAN release during beta; enforcement stays off until beta ends"
    detail: "TIER_LIMITS.free.canRelease is true. Founding families are onboarded by
      hand and will not have paid, so enforcing the paywall now would mean the beta
      cannot exercise the one capability the product exists for. The machinery is
      live rather than dead: checkout is wired and assertCanRelease is called on the
      release path (lib/release/triggers.ts:125), so turning enforcement on is one
      line rather than a discovery."
    recorded_because: "The pre-release audit found this deliberate and undated, paired
      with a skipped test (lib/billing/entitlements.test.ts) carrying no owner either.
      An undated temporary flag is a permanent flag nobody has admitted to. The flip
      also falsifies §2.7 of the user guide, which lib/billing/beta-flag.test.ts
      already enforces — so this is one decision with three artifacts that must move
      together."
    owner: steve
    revisit: "at every /daily-priority from 2026-10-01"

  - id: policy-edit-routes
    date: 2026-08-13
    decision: "retire PUT and DELETE /api/policies/[id] rather than wire them"
    detail: "Both sat in lib/ops/api-reachability.ts KNOWN_UNREACHABLE marked
      undecided — 'retire or wire' and 'a real product question'. The product
      question has an answer: a policy is a PROPOSAL that materialises into
      access_rules, and access_rules is the authoritative grant table. An owner who
      wants different access edits the rules on /rules, where the effect is visible.
      Editing the proposal after it has been accepted changes nothing a person can
      see, and un-accepting one would have to reconcile the rules it already wrote —
      a materialising layer that silently WIDENS or NARROWS access is exactly the
      hazard J4-R14/R15 were written about."
    rationale: "Carrying two undecided handlers through a release is how debt becomes
      permanent. Retiring is reversible; a half-built un-accept path in front of beta
      users is not."
    implemented: "Moved to docs/retired-surface.md with the reason and the
      replacement, and the handlers deleted. Policies are still removed as a cascade
      of deleting the person, which is the path that has always been used."

  - id: stripe-merchant-name
    date: 2026-08-09
    decision: "leave as-is for the G1 flight"
    detail: "The live billing portal header reads 'Relay/ReportBridge/LearningAI365' — an account-level name on the Stripe account shared with report-bridge, learningai365 and skillcrossroads. Per-portal-configuration branding does not override it."
    rationale: "G1 measures click-to-intent, which happens before checkout, so this cannot bias the gate reading. It is only seen by someone who reaches payment during the beta."
    revisit: "if G1 passes — at which point the options are a neutral shared name or a Relay-only Stripe account"

# Per-journey build state — THE one authoritative record, added 2026-08-13.
#
# WHY IT MOVED HERE. docs/user-journeys.md carried per-journey state in three
# separate places: a live sweep table at the top, a summary table in Part II, and
# a coverage table in Part VIII. By 2026-08-13 they contradicted each other and
# the file said so — J1/J3/J6/J7 were tagged `[GAP]` in Part II while the sweep
# eight hundred lines above recorded all four PASSING on production. The doc had
# deliberately declined to retag, on the reasonable ground that hand-asserting 74
# build states invites a wrong one.
#
# That reasoning is sound and the fix follows it: state each journey ONCE, here,
# where the volatile-facts rule already puts test counts and gates — and let the
# prose reference it instead of restating it. lib/ops/journey-state.test.ts fails
# if the document contradicts this block, so the two cannot drift apart again.
#
# `walked` is the date the journey was last exercised end to end against
# PRODUCTION, not the date something was merged.
journeys:
  evidence: "docs/user-journeys.md — re-sweep table, 2026-08-13"
  J1:  { name: "Worry to proof to commitment",  status: live, walked: 2026-08-13 }
  J2:  { name: "Cold-start defeat",             status: live, walked: 2026-08-13 }
  J3:  { name: "Assisted setup for a parent",   status: live, walked: 2026-08-12 }
  J4:  { name: "Building the circle of trust",  status: live, walked: 2026-08-13 }
  J5:  { name: "The living habit",              status: live, walked: 2026-08-13 }
  J6:  { name: "Someone requests access",       status: live, walked: 2026-08-13 }
  J7:  { name: "The verifier's moment",         status: live, walked: 2026-08-13 }
  J8:  { name: "Hands on the account",          status: live, walked: 2026-08-13,
         caveat: "the decrypt round-trip was NOT re-proven on this walk — that
           fixture's ciphertext is placeholder bytes. That half stands on the
           2026-08-08 walk and the 2026-08-13 item-update walk." }
  J9:  { name: "Standing down",                 status: live, walked: 2026-08-13 }
  J10: { name: "The permanent handoff",         status: gated, walked: 2026-08-13,
         gate: g2-counsel-opinion,
         note: "Refused at the trust boundary, not hidden in a dropdown —
           POST /api/rules with trigger_type: estate answers 400. Enabling it is
           moving one string into USER_SELECTABLE_TRIGGER_TYPES." }

