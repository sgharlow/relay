    why_now: "Deferred in sprint 4 and again in sprint 5, which wrote 'do not carry it a third
      time'. It was carried a third time. A backlog item that survives three deferrals without
      anyone choosing it is being avoided, not prioritised — deciding it is what stops a fourth."
    reopen_if: "a real user completing a stand-down reports that the close feels abrupt. That is a
      signal from a person, not a backlog item. Nothing in the architecture makes these harder to
      add later than they are today."

  - id: retire-paid-advertising
    date: 2026-08-16
    owner: steve
    decision: "ABANDON paid advertising as a channel for this product, permanently for now. Focus
      on B2B2C, reached through op-eds on caregiver and elder-care platforms — caregiver.com, AARP
      and comparable outlets. Every roadmap item carrying the advertising angle is retired; the
      op-ed programme is ramped up in its place."
    plan: docs/g1-editorial-lane.md
    supersedes: "ratified.g1-lane-1-is-google-search-intent, ratified.g1-google-lane-cancelled
      (which cancelled one lane; this retires the whole channel), and the paid halves of
      docs/g1-ad-creatives.md, g1-sitting-sheet.md, g1-channel-send-kit.md and step 8 of
      g1-launch-checklist.md — all four banner-retired in the same commit rather than deleted."
    evidence: "Three instruments measured on 2026-08-16, total cost $0.
      (1) Reddit community targeting — the caregiver communities are not in the targetable index at
          all. dementia and Alzheimers refused on ToS as health-condition targeting; AgingParents,
          CaregiverSupport and the partial 'caregiv' return No Search Results while personalfinance
          returns r/personalfinance 21.8M in the same field.
      (2) Reddit keyword targeting — does not narrow. 251.2m-314.1m estimated audience under
          US-only scoping with nine caregiving keywords, HIGHER than the 248.3m baseline that had
          included Personal Finance and 25 broad terms.
      (3) Google search intent — the demand is not there. ~330 on-wedge searches/month, and ten of
          the sixteen keyword ideas Google generated were Netflix password sharing, three of them
          declining 90% year on year."
    the_inference: "Not three bad channels — one fact. There is no self-identifying, addressable
      population searching for this, and no platform will sell access to it by inference either.
      Paid search HARVESTS existing demand and the measurement says almost none exists; paid social
      requires an attribute the platforms will not sell. Both roads are closed for this wedge.
      ⚠️ This does NOT prove low willingness to pay. It proves the channel does not exist. Those are
      different findings and conflating them would archive a product on the wrong evidence."
    why_op_eds: "The people plainly exist — they are reading AARP, caregiver.com and Next Avenue
      right now, about this exact problem, in words that are not our words. The gap is not reach,
      it is that nobody has a name for what they need until somebody describes it. An article does
      that and an ad cannot. Editorial also compounds: a placement keeps working, builds the
      standing a B2B2C conversation requires, and costs attention rather than money — which suits a
      project whose ratified KPI is audience rather than revenue
      (project-founder-direction-2026-07-26)."
    b2b2c_linkage: "Steve's framing pairs op-eds WITH B2B2C, and the pairing is the point: published
      thought leadership is the credential that gets a benefits broker or a credit-union product
      lead to take the meeting. Recorded precisely so the gates stay honest — op-eds are an EARNED
      AWARENESS channel, and B2B2C (gate G3) is a DISTRIBUTION model. The first supplies standing
      for the second. They are not the same measurement and must not be reported as one."
    chain_change: "G3 (B2B2C pilot LOI) moves from 'after G1' to RUNNING IN PARALLEL with G1's
      re-instrumented form. G1's own kill branch already routed to 'B2B2C-only or archive', so this
      is the disposition the gate itself specified — arrived at because the test proved unrunnable
      rather than because it ran and failed. That distinction is recorded on the gate."
    money: "$0 spent, on either platform, at any point. Reddit draft unlaunched; Google account
      668-681-8891 dormant with no payment method. Both spend-$500-get-$500 credits were confirmable
      only at a payment step that was never reached, so neither was accepted."
    revisit: "if an op-ed placement produces measurable click-through and the wedge turns out to
      have a searchable vocabulary after all — the retired lane docs and lib/g1/google-lane.ts are
      retained, tested and ready, and reviving is adding one src to GATE_LANES."

  - id: g1-google-lane-cancelled
    date: 2026-08-16
    owner: steve
    decision: "Cancel the Google Ads work. No payment added, no campaign launched, nothing spent."
    account: "668-681-8891 ('Relay'), created 2026-08-16 under sgharlow@gmail.com. Left DORMANT
      with no payment method, which is what makes it structurally unable to serve — not a setting
      anyone has to remember. Deliberately NOT closed; closing is irreversible and nothing is
      gained by it. ⚠️ Do NOT reuse report-bridge's account 990-960-7101 if this is ever revived."
    why: "The measurement, not the effort. Keyword Planner returned ~330 on-wedge searches/month
      with ten of sixteen keyword ideas resolving to Netflix password sharing, so N>=100 was
      arithmetically out of reach inside a window that hard-stops 2026-10-02. Continuing to
      configure would have produced a well-built instrument pointed at a market that is not there."
    also_observed_while_stopping: "Google's onboarding silently routed the campaign into
      PERFORMANCE MAX ('/campaigns/new/performancemax' — 'optimized by Google AI across Search,
      YouTube, Display and more'), which with zero conversion history drains into Display
      placements. A third instance of the same pattern seen on Reddit today: the platform's
      default configuration is built to spend, not to measure."
    loose_ends: "⚠️ A FRANCE phone number (05 46 74 56 38) and country code FR were attached during
      onboarding and survived both an Unlink click and Skip — visible in the campaign URL
      parameters. Harmless while the account is dormant; fix it before any future use.
      ⚠️ The products/services field reverted to 'Network Security' on reload; free-text
      replacements did not persist. Same caveat — only matters if revived."
    pending_offer_declined_by_inaction: "A spend-$500-get-$500 credit was offered and is confirmed
      only at the payment step, which was never reached. Nothing was accepted."
    what_survives: "docs/g1-google-lane.md, lib/g1/google-lane.ts and lib/ops/google-lane.test.ts
      are RETAINED and still pass. The copy fits Google's real field limits, the negatives are
      sound, and the keywords now carry measured volumes. If a reason to revive this ever appears,
      the work is done and the reason it was shelved is recorded above it."

  - id: g1-editorial-over-paid
    date: 2026-08-16
    owner: steve
    decision: "Write opinion pieces for AARP and comparable elder-care communities that publish
      this kind of article, and treat editorial as a HIGHER PRIORITY than paid advertising.
      Paid lanes are not cancelled — they are demoted, unlaunched and unfunded, behind this."
    plan: docs/g1-editorial-lane.md
    supersedes: "the ordering in ratified.g1-lane-1-is-google-search-intent, taken hours earlier
      the same day. That decision was correct on the information available; Keyword Planner then
      supplied information that was not available, and this is the response to it."
    rationale: "Three paid instruments were tested on 2026-08-16 and all three failed, at a total
      cost of $0: Reddit community targeting (the caregiver communities are not in the targetable
      index), Reddit keyword targeting (does not narrow — 251.2m-314.1m under US-only), and Google
      search intent (~330 searches/month on-wedge, with 10 of 16 keyword ideas returning Netflix
      password sharing). The common thread is not three bad channels but one fact about the market:
      there is no self-identifying, addressable population searching for this, and no platform will
      sell access to it by inference either.
      That fact kills HARVESTING and points at CREATING. Search advertising captures demand that
      already exists and the measurement says almost none does — but the people exist and are
      reading AARP and Next Avenue right now, about this exact problem, in words that are not our
      words. The gap is not reach; it is that nobody has a name for what they need until somebody
      describes it. An article does that and an ad cannot.
      Also consistent with project-founder-direction-2026-07-26, whose KPI is audience, not revenue."
    constraints_carried: "§1a third person; estate stays out (gates.g2-counsel-opinion.declined
      withdrew it permanently, so the death-and-inheritance piece must not be written however well
      it would place); no medical claims; commercial interest disclosed on every placement."
    known_risk: "⚠️ Most of these outlets do not run vendor-written promotional pieces, and
      pitching one as though they do gets a founder permanently blocked. The realistic shape is
      contributed expertise where the product is at most a byline. Reading each outlet's own
      contributor guidelines is step 1 of the plan and gates everything after it — the 2026-07-05
      portfolio rule about auditing a GTM channel's rules BEFORE ratifying it."
    measurement: "Each placement carries ?src=ed-<outlet>, and because GATE_LANES is an allow-list
      the src must be declared there IN THE SAME COMMIT the placement goes live, or the article runs
      and N stays at zero. Editorial is recorded as its own segment rather than blended into the
      paid headline ratio — g1-flight-log.md already computes per-lane ratios."
    unknown_and_stated: "Volume. One placement may deliver more qualified readers than the whole
      $250 paid flight would have, or forty. This is not known. What IS known is that the paid
      alternative was measured and cannot reach N>=100 inside the window at all, so the comparison
      is against something that does not work."

  - id: g1-lane-1-is-google-search-intent
    date: 2026-08-16
    owner: steve
    decision: "Reddit is retired as lane 1. Lane 1 becomes Google Ads SEARCH INTENT.
      `reddit-ads` removed from GATE_LANES the same day; `google-ads` added."
    supersedes: "docs/g1-ad-creatives.md's Reddit lane and screens 7-13 of
      docs/g1-sitting-sheet.md, both of which are marked NOT EXECUTABLE in place rather
      than deleted, because the evidence is the point."
    finding: "Established live in Ads Manager during the sitting, against a real ad
      account, with nothing submitted and nothing spent. Reddit sells no caregiver
      targeting. `dementia` and `Alzheimers` are refused outright on ToS — correct, since
      a subreddit defined by a diagnosis identifies people by inferred medical status,
      a restricted category and the same principle as the §1a copy rule. The other three
      are simply ABSENT from the targetable index: `AgingParents`, `CaregiverSupport` and
      `caregiv` all return No Search Results, while `personalfinance` returns
      r/personalfinance 21.8M in the same field, so it is the index and not the tooling.
      `eldercare` offers only r/CircleOfCaregivers at 245 users."
    fallback_tested_and_failed: "Keyword targeting, against a threshold Steve set BEFORE
      the number was visible: 'if it stays in the hundreds of millions, keyword targeting
      is not targeting and we stop there rather than spend.' With Personal Finance removed,
      keywords cut to nine caregiving terms, no communities and location United States, the
      audience estimate read 251.2m-314.1m — slightly HIGHER than the 248.3m-310.4m
      baseline that had included Personal Finance and 25 broad keywords, and far exceeding
      Reddit's US user base while scoped to the US. Either the estimator ignores targeting
      or the targeting does not narrow delivery; neither permits predicting or verifying
      who receives the ad."
    rationale: "Search intent matches a QUERY rather than inferring an attribute about a
      person, so the policy wall that closed Reddit does not exist there — and the wedge's
      defining moment is a situation, not a demographic. Somebody typing 'how do I access
      my mother's bank account while she is in hospital' has declared the exact need.
      Intent traffic also converts better than interest traffic, which matters on a gate
      already ratified as a directional read."
    unchanged: "the thresholds, the $250 ceiling, the 4-week window, the N>=100 stop, the
      directional-read constraint, both lane definitions, the landing page and the whole
      instrument. verify:funnel, flight:snapshot and the funnel events are channel-agnostic
      and needed no change."
    still_to_build: "a Google lane plan to replace docs/g1-sitting-sheet.md — keyword set,
      match types, negative keywords, budget shape, and the ad copy re-fitted to Google's
      character limits (R1 is written for Reddit's free-form body, which has no equivalent
      there). Google's own healthcare/health-adjacent copy policies must be read from the
      primary source before drafting, not from memory."
    watch: "⚠️ Meta is unlikely to be a quicker substitute — it removed most health and
      caregiving detailed-targeting options in 2022, so lane 2 may hit the same wall. Test
      that BEFORE investing in the image assets (D6), not after."
    note: "⚠️ Do NOT reuse report-bridge's Google Ads account (990-960-7101). Separate
      product, separate measurement, and the portfolio rule against sharing per-product
      billing surfaces applies."

# Per-journey build state — THE one authoritative record, added 2026-08-13.
#
# WHY IT MOVED HERE. docs/user-journeys.md carried per-journey state in three
# separate places: a live sweep table at the top, a summary table in Part II, and
# a coverage table in Part VIII. By 2026-08-13 they contradicted each other and
# the file said so — J1/J3/J6/J7 were tagged `[GAP]` in Part II while the sweep
# eight hundred lines above recorded all four PASSING on production. The doc had
# deliberately declined to retag, on the reasonable ground that hand-asserting 74
# build states invites a wrong one.
#
# That reasoning is sound and the fix follows it: state each journey ONCE, here,
# where the volatile-facts rule already puts test counts and gates — and let the
# prose reference it instead of restating it. lib/ops/journey-state.test.ts fails
# if the document contradicts this block, so the two cannot drift apart again.
#
# `walked` is the date the journey was last exercised end to end against
# PRODUCTION, not the date something was merged.
journeys:
  evidence: "docs/user-journeys.md — re-sweep table, 2026-08-13 (the WALK record).
    Step-level build state is a separate question and has its own section in the same file,
    'Step-level build state — 2026-08-17, evidence-backed', checked against master @ e50a68a.
    ⚠️ THE TWO ANSWER DIFFERENT QUESTIONS and neither substitutes for the other: the register
    says what EXISTS, the sweep says what was WALKED. Sixty-eight steps read [GAP] while the
    sweep read PASS for the journey containing them, which is how a product can be both fully
    walked and undocumentable at the same time.
    ⚠️ The walk below is 2026-08-13 and ~120 commits old. Six user-facing surfaces have shipped
    since (structured reveal, TOTP entry, the irreplaceable control, consent readback, verifier
    error recovery, import duplicate explanation). The verdicts stand for the journeys; the
    screens under them have moved."
  J1:  { name: "Worry to proof to commitment",  status: live, walked: 2026-08-13 }
  J2:  { name: "Cold-start defeat",             status: live, walked: 2026-08-13 }
  J3:  { name: "Assisted setup for a parent",   status: live, walked: 2026-08-12 }
  J4:  { name: "Building the circle of trust",  status: live, walked: 2026-08-13 }
  J5:  { name: "The living habit",              status: live, walked: 2026-08-13 }
  J6:  { name: "Someone requests access",       status: live, walked: 2026-08-13 }
  J7:  { name: "The verifier's moment",         status: live, walked: 2026-08-13 }
  J8:  { name: "Hands on the account",          status: live, walked: 2026-08-13,
         caveat: "the decrypt round-trip was NOT re-proven on this walk — that
           fixture's ciphertext is placeholder bytes. That half stands on the
           2026-08-08 walk and the 2026-08-13 item-update walk.
           🔴 SHARPENED 2026-08-17: THE SCREEN THAT WALK PROVED NO LONGER
           EXISTS. Secret-types Phase 0 replaced `<pre>{value}</pre>` with
           labelled fields, a masked password and a generated TOTP code (223
           lines of AccessClient.tsx). Unit tests cover encode/decode and the
           RFC 6238 vectors; verify:live's browser walk covers the step-up
           dialog and the owner picker ONLY, by its own header. So the product's
           most valuable moment - a grieving person pressing Reveal - has no
           end-to-end evidence against the build now deployed.
           scripts/e2e-reveal.ts is the named fix.
           ✅ CLOSED 2026-08-17 — scripts/e2e-reveal.ts, 20/20 against production.
           The whole chain: an owner stores username + password + TOTP seed +
           recovery codes, a recipient claims, a verifier claims AND IS
           CONFIRMED, the release opens, Reveal returns the password byte for
           byte as four labelled fields, and the seed yields a six-digit code
           equal to one computed independently (772750 == 772750). A LEGACY
           {\"username\",\"password\"} item decodes to labelled fields with no
           JSON brace left in any value - the shape every item imported before
           Phase 0 is stored in, permanently, because the server cannot rewrite
           what it cannot read.
           It found two things no unit test could: the release sits in GRACE
           until quorum advances, and a verifier the owner has not CONFIRMED
           answers 200 with `not_counted` while the tally stands still (§4.3).
           The first draft asserted only the status code and reported quorum met
           over a 0/1 tally - the same green-signal-measuring-the-wrong-thing
           this repo keeps catching, caught this time by the walk itself." }
  J9:  { name: "Standing down",                 status: live, walked: 2026-08-13 }
  # WAS `gated` ON g2-counsel-opinion. Changed to `withdrawn` 2026-08-14: that
  # gate was declined, so this is not a journey waiting on a condition — it is a
  # journey the product no longer offers. `gated` would keep it reading as
  # temporary on every future status pass, which is how a withdrawn capability
  # gets quietly rebuilt.
  J10: { name: "The permanent handoff",         status: withdrawn, walked: 2026-08-13,
         note: "Refused at the trust boundary, not hidden in a dropdown —
           POST /api/rules with trigger_type: estate answers 400. Re-offering it
           would mean reversing gates.g2-counsel-opinion.declined FIRST, in its
           own change; only then does moving one string into
           USER_SELECTABLE_TRIGGER_TYPES mean anything. lib/ops/gates.test.ts
           enforces that order." }

