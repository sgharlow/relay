    what_only_steve_can_do: >-
      Google Search Console is the authoritative diagnosis AND the only route to a review.
      (1) https://search.google.com/search-console - if `relaystandby.com` is not already a
      property, add it (DNS TXT via Cloudflare; Claude can prepare the record).
      (2) Security & Manual Actions -> Security Issues. This names the exact classification and
      gives SAMPLE URLS, which is the thing every other investigation here is guessing at.
      (3) Request Review, once the cause is understood or fixed. Reviews of a false positive are
      typically resolved in days rather than weeks, but the clock does not start until it is asked.
      Cross-check, no login needed:
      https://transparencyreport.google.com/safe-browsing/search?url=relaystandby.com
    what_it_actually_blocks_corrected: >-
      A0, and A0 alone - and only until Steve clicks through the interstitial or switches to
      Standard protection. ⚠️ The first version of this field claimed "the demand lane cannot
      fire: an op-ed driving readers to a site Chrome calls dangerous is worse than not
      publishing", and that is FALSE: `/caregivers`, the landing page and signup all load
