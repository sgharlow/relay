  - id: rows-outlived-the-accounts-that-owned-them
    owner: steve
    opened: 2026-08-21
    renamed:
      date: 2026-08-21
      from: thirty-eight-rows-outlived-the-accounts-that-owned-them
      why: "The id encoded a COUNT, and an id is permanent. It said thirty-eight; the census read
        36 within the hour, because `auth_challenges` rows expire on their own - so the name was
        wrong the same day and could never be corrected the way a sentence can. This file's own
        volatile-numbers rule says a figure lives in exactly one place and carries the command that
        derives it; an identifier is the one place it can never be updated, which makes it the
        worst place of all to put one. Renamed rather than left as a curiosity, because the next
        reader would otherwise take 38 as the current number."
    what: "`npm run verify:orphans` exits 1 on production with DANGLING rows — rows whose owner no
      longer exists, across `verifier_codes`, `break_glass_codes`, `auth_challenges` and
      `recipient_codes`. Unreachable through the application and invisible to the account census,
      which is why nothing reported them until the census was built.
      ⚠️ DO NOT QUOTE A COUNT HERE. This entry said 38 and read 36 within the hour, because
      `auth_challenges` rows expire on their own — so the number moves without anyone touching it,
      and a figure in this prose is a second copy that goes stale. Re-derive with
      `npm run verify:orphans` (which now runs as the read-only `relay_ro` identity)."
    every_one_is_historical_and_that_was_measured: "Re-derive with a per-table min/max of
      `created_at` over rows whose owner is absent. On 2026-08-21 the NEWEST dangling row in any of
      the four tables was 2026-08-20 13:59; the oldest was 2026-08-08. **Nothing from 2026-08-21.**
      That day the cluster saw eleven disposable accounts created and closed — ten by the
      verify:live chain and one by the a11y audit — and they added ZERO dangling rows. Both
      cascades are working; this is residue, not an active leak.
      ⚠️ I first recorded this as 20 rows in two tables. That was WRONG, and wrong in the
      flattering direction: I had read a truncated `tail` of the probe output rather than the
      probe's own total. Corrected the same day. The lesson is the dull one this repo keeps
      relearning — read the tool's verdict line, not the last dozen lines of its stdout."
    where_it_came_from: "`deleteAccount()` IS the integrity layer, because DSQL has no foreign
      keys. `auth_challenges` only entered the cascade on 2026-08-21 (commit e609231), so its ten
      orphans — all from the 2026-08-20 verify:live run — are straightforwardly pre-fix. The other
      three tables have been in the cascade for longer than their orphans are old, so those rows
      were left by something that never ran it: a hand-written `DELETE FROM users`, during the
      manual fixture cleanup of 08-08 to 08-14. That is this repo's recorded trap, having actually
      happened."
    reconfirmed_2026_08_29: "Re-derived after BOTH chains were run against production on Steve's
      say-so — `verify:live` (10 disposable accounts) and `verify:journeys` (5 more), 15 created
      and closed in one evening. The dangling total was 28 before and 28 after: **ZERO new
      dangling rows**, and the account census read `0 reserved-domain accounts` both times, so
      nothing was left behind at either level. Per-table min/max of `created_at` over rows whose
      owner is absent: `verifier_codes` 2026-08-08 → 2026-08-13 (17), `break_glass_codes`
      2026-08-12 → 2026-08-13 (10), `recipient_codes` 2026-08-14 (1). The NEWEST is 2026-08-14,
      a fortnight old. That is the second independent confirmation that both cascades work and
      this is residue rather than an active leak.
      ✅ AND THE ENTRY'S OWN PREDICTION CAME TRUE. It said `auth_challenges` rows 'are single-use
      nonces that also expire', and named the table as one of four. It is now ABSENT from the
      sweep's output entirely — those ten orphans expired on their own, exactly as predicted, and
      the number that cannot be quoted here went from four tables to three without anyone acting.
      A prediction that was recorded and then came true is worth more than the count."
    why_it_is_steve_s: "Purging is a destructive write against production with no undo, on rows
