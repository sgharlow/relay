  - id: a-property-test-that-failed-on-a-correct-product     # found 2026-08-29, not on any list
    owner: claude
    opened: 2026-08-29
    closed:
      date: 2026-08-29
      what_shipped: >-
        `lib/auth/recipient-token.test.ts` — the two-secret property now filters on the ENCODED
        BYTES rather than on string inequality. A test defect; nothing about the product changed.
    how_it_surfaced: >-
      One failure in a full-suite run on a DOCS-ONLY branch, in
      `property: tokens from one secret are always rejected by a different secret`. Two subsequent
      full runs were clean, and the file passed in isolation — the shape that gets called flaky,
      re-run, and forgotten.
    the_cause_is_exact: >-
      `signingKey()` does `Buffer.from(secret, 'utf8')`, so what decides the outcome is the KEY
      BYTES. The property generated two secrets with `fc.string()` and filtered them with
      `a !== b`, which is STRING inequality. `fc.string()` can emit lone surrogates, and every
      unpaired surrogate encodes to U+FFFD — the same three bytes, `EF BF BD`. So '\uD800' and
      '\uDC00' are different strings that produce byte-identical keys: the filter lets the pair
      through, the token verifies correctly under "the other" secret, `threw` stays false, and the
      property reports a failure.
      Proven outside fast-check before touching the test:
      `Buffer.from('a\uD800','utf8').equals(Buffer.from('a\uDC00','utf8'))` is **true**.
    what_it_was_NOT: >-
      Not a product defect, and that was checked rather than assumed. The first hypothesis was a
      CACHED secret — if `recipient-token.ts` read `RECIPIENT_JWT_SECRET` once at module load,
      rotating it would not take effect until redeploy, which would falsify
      `docs/secret-rotation-runbook.md` §2. It does not: the secret is read per call, inside
      `signingKey()`. The second hypothesis was a cross-file `process.env` race — five test files
      write that variable — but vitest isolates per file, so that was not it either. Both were
      eliminated by reading, not by re-running until green.
    why_it_is_worth_an_entry_at_all: >-
      Because it failed a REQUIRED check on a branch that changed only markdown, and because the
      honest reading of "flaky" is usually "a test whose notion of DIFFERENT sits at a different
      level from the code's". Re-running until green would have left an intermittent red in the
      gate that guards every merge, and the next person to meet it would have started from zero.
      Hammered 8 consecutive runs after the fix.
    ends_when: >-
      Closed. If another property in this repo generates key material with `fc.string()`, it needs
      the same byte-level filter — this was the only one (`grep -rn "a !== b" lib/ --include=*.test.ts`).

  - id: google-safe-browsing-flags-the-site-as-phishing       # INCIDENT, 2026-08-29
    owner: steve                          # only he can reach Search Console and request a review
    opened: 2026-08-29
    severity: >-
      🟠 SERIOUS BUT NARROW - and the first version of this line said the opposite, which is the
      part worth keeping. Corrected 2026-08-29 by driving a real browser at every public page.
      **ONLY `/vault/new` IS BLOCKED.** Everything else loads normally.
    ⚠️_the_first_severity_assessment_was_WRONG_and_this_is_the_third_of_its_kind_today: >-
      It read: "Every Chrome, Firefox, Safari and Edge user meets a full-page red interstitial
      instead of the product. Nobody can sign up, sign in, reach the demo, or read /terms." That
      was extrapolated from ONE observation - Steve's screenshot of `/vault/new` - to the whole
      site, without testing the whole site.
      Measured in a real Chrome via the browser plugin, 2026-08-29: `/` loads · `/auth/signin`
      loads · `/auth/signup` loads · `/demo` loads · `/caregivers` loads · `/terms` loads ·
      **`/vault/new` BLOCKED, reproducibly.**
      🔴 This is the THIRD overstatement in one session, all the same shape: a correct observation
      generalised to a category that was never checked. The sweep would "arm their triggers" (it
      iterates an empty set); the ladder "fires on 09-01" (the owner is not a candidate); the site
      is "unreachable" (one page is). ROADMAP §0.0's lesson was written today and broken three
      times by its author on the same day. The corrective is mechanical, not attitudinal: when a
      claim has the shape "X is true of ALL of Y", enumerate Y before writing it down.
    what_the_corrected_picture_actually_is: >-
      Signup, sign-in, the demo, the caregivers landing and the terms page ALL WORK. So the demand
      lane is NOT blocked - an op-ed could drive readers to `/caregivers` today and they would
      convert normally. What IS blocked is the owner adding a vault item, which is A0, which is
      the single highest-leverage action in ROADMAP §2.5. So this stops the one thing that matters
      most and almost nothing else.
    the_diagnosis_the_three_reads_together_support: >-
      Search Console -> Security Issues: **No issues detected.**
      Safe Browsing Transparency Report, domain `relaystandby.com`: **No available data.**
      Safe Browsing Transparency Report, URL `relaystandby.com/vault/new`: **No available data.**
      Chrome: **blocks `/vault/new` and nothing else.**
      A published blocklist entry would appear in at least one of the first three. None does. That
      signature - a per-URL verdict, present in the browser and absent from every published record
      - is Chrome's REAL-TIME / client-side phishing classification rather than a Safe Browsing
      list entry. Which fits what the page is: the one screen in this product whose entire purpose
      is a form collecting a username and password FOR A DIFFERENT SERVICE, on a domain 22 days
      old with no traffic reputation. That is the canonical false positive for a credential vault.
    ⚠️_therefore_Search_Console_is_NOT_the_remedy: >-
      There is nothing there to request a review of - it reports no issue. The route for a URL
      wrongly classified is the Safe Browsing false-positive report:
      https://safebrowsing.google.com/safebrowsing/report_error/ - submit the exact URL. That is an
      outward-facing submission on Steve's behalf and is his to send, not Claude's to send for him.
      Worth checking first: chrome://settings/security. If Enhanced protection is ON, this may be a
      per-user real-time verdict rather than something every visitor sees, which changes the blast
      radius materially and is a five-second read.
    A0_IS_NOT_ACTUALLY_BLOCKED_TODAY: >-
      The interstitial offers "Details -> visit this unsafe site", and switching to Standard
      protection also clears it. Either lets A0 proceed now. That judgement is sound rather than
      reckless BECAUSE compromise was ruled out first, in writing, before the bypass was suggested
      - deploy provenance, no foreign hosts, 0 secret-scanning alerts, no user-content hosting, no
      open redirect, audit chain intact.
    what: >-
      Reported by Steve from his own browser on 2026-08-29 (~16:00 local) at
      `relaystandby.com/vault/new`. Chrome's interstitial cites Google Safe Browsing and the phrase
      "recently found phishing on the site you tried visiting".
    the_origin_is_HEALTHY_and_that_is_the_first_thing_to_understand: >-
      Safe Browsing is a CLIENT-SIDE blocklist. The server is unaffected and nothing is wrong with
      the deployment. Measured 2026-08-29: `/`, `/caregivers`, `/auth/signin`, `/auth/signup`,
      `/demo`, `/terms`, `/privacy` all return 200 and `/vault/new` returns its usual 307. So this
      is a REPUTATION verdict to be appealed, not an outage to be repaired - and no redeploy,
      rollback or code change lifts it.
    compromise_was_checked_first_and_no_indicator_was_found: >-
      In this order, because "normally safe sites are sometimes compromised" is the alternative
      hypothesis and it changes everything if true.
      (1) DEPLOY PROVENANCE - every production deploy in the window is one of this session's own
      merge commits (252ecd7, 38ec94f, f960c3e, d45a1eb, b236003, fece3a5), all authored by Steve
      via GitHub, none manual.
      (2) FOREIGN HOSTS - the live landing HTML references exactly one host, relaystandby.com. No
      injected script, no third-party origin.
      (3) The landing page carries NO form and NO password input.
      (4) SECRET SCANNING - enabled the same day, 0 alerts on a repo public since June.
      (5) USER-CONTENT HOSTING - none. `/api/import` is authenticated and serves nothing back; the
      only two `dangerouslySetInnerHTML` sites render a server-generated TOTP QR SVG behind auth.
      (6) OPEN REDIRECT - none found echoing a URL parameter into a Location header.
      (7) The hash-chained audit log verifies intact (`npm run incident:evidence`, same day).
    the_likely_cause_stated_as_a_hypothesis_not_a_finding: >-
      ⚠️ NOT CONFIRMED - Search Console is the only authoritative source and it has not been read.
      The profile is the classic false-positive one for this product category: a domain **22 days
      old** (registered 2026-08-08), no traffic reputation, presenting credential-entry UI, whose
      entire purpose is to hold other services' passwords. Password managers and vaults are
      routinely misclassified for exactly this shape.
      ⚠️ One candidate was investigated and DOES NOT hold: `lib/seed/demo-data.ts` seeds ~30 real
      financial and government brands with real URLs (Chase, Bank of America, PayPal, American
      Express, Coinbase, IRS, Social Security, 1Password). That WOULD be textbook classifier bait -
      a non-brand domain showing many financial institutions beside credential fields - but the
      public `/demo` HTML contains none of those strings, and `src/app/demo/page.tsx` is 350 lines
