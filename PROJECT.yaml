  - id: retire-paid-advertising
    date: 2026-08-16
    owner: steve
    decision: "ABANDON paid advertising as a channel for this product, permanently for now. Focus
      on B2B2C, reached through op-eds on caregiver and elder-care platforms — caregiver.com, AARP
      and comparable outlets. Every roadmap item carrying the advertising angle is retired; the
      op-ed programme is ramped up in its place."
    plan: docs/g1-editorial-lane.md
    supersedes: "ratified.g1-lane-1-is-google-search-intent, ratified.g1-google-lane-cancelled
      (which cancelled one lane; this retires the whole channel), and the paid halves of
      docs/g1-ad-creatives.md, g1-sitting-sheet.md, g1-channel-send-kit.md and step 8 of
      g1-launch-checklist.md — all four banner-retired in the same commit rather than deleted."
    evidence: "Three instruments measured on 2026-08-16, total cost $0.
      (1) Reddit community targeting — the caregiver communities are not in the targetable index at
          all. dementia and Alzheimers refused on ToS as health-condition targeting; AgingParents,
          CaregiverSupport and the partial 'caregiv' return No Search Results while personalfinance
          returns r/personalfinance 21.8M in the same field.
      (2) Reddit keyword targeting — does not narrow. 251.2m-314.1m estimated audience under
          US-only scoping with nine caregiving keywords, HIGHER than the 248.3m baseline that had
          included Personal Finance and 25 broad terms.
      (3) Google search intent — the demand is not there. ~330 on-wedge searches/month, and ten of
          the sixteen keyword ideas Google generated were Netflix password sharing, three of them
          declining 90% year on year."
    the_inference: "Not three bad channels — one fact. There is no self-identifying, addressable
      population searching for this, and no platform will sell access to it by inference either.
      Paid search HARVESTS existing demand and the measurement says almost none exists; paid social
      requires an attribute the platforms will not sell. Both roads are closed for this wedge.
      ⚠️ This does NOT prove low willingness to pay. It proves the channel does not exist. Those are
      different findings and conflating them would archive a product on the wrong evidence."
    why_op_eds: "The people plainly exist — they are reading AARP, caregiver.com and Next Avenue
      right now, about this exact problem, in words that are not our words. The gap is not reach,
      it is that nobody has a name for what they need until somebody describes it. An article does
      that and an ad cannot. Editorial also compounds: a placement keeps working, builds the
      standing a B2B2C conversation requires, and costs attention rather than money — which suits a
      project whose ratified KPI is audience rather than revenue
      (project-founder-direction-2026-07-26)."
    b2b2c_linkage: "Steve's framing pairs op-eds WITH B2B2C, and the pairing is the point: published
      thought leadership is the credential that gets a benefits broker or a credit-union product
      lead to take the meeting. Recorded precisely so the gates stay honest — op-eds are an EARNED
      AWARENESS channel, and B2B2C (gate G3) is a DISTRIBUTION model. The first supplies standing
      for the second. They are not the same measurement and must not be reported as one."
    chain_change: "G3 (B2B2C pilot LOI) moves from 'after G1' to RUNNING IN PARALLEL with G1's
      re-instrumented form. G1's own kill branch already routed to 'B2B2C-only or archive', so this
      is the disposition the gate itself specified — arrived at because the test proved unrunnable
      rather than because it ran and failed. That distinction is recorded on the gate."
    money: "$0 spent, on either platform, at any point. Reddit draft unlaunched; Google account
      668-681-8891 dormant with no payment method. Both spend-$500-get-$500 credits were confirmable
      only at a payment step that was never reached, so neither was accepted."
    revisit: "if an op-ed placement produces measurable click-through and the wedge turns out to
      have a searchable vocabulary after all — the retired lane docs and lib/g1/google-lane.ts are
      retained, tested and ready, and reviving is adding one src to GATE_LANES."

