  - id: verify-live-cannot-enter-ci                          # "D4"
    owner: steve            # infrastructure spend - explicitly not a Claude item
    opened: 2026-08-18
    what: "The release gate is a chain of live walks a PERSON has to remember to run,
      against the PRODUCTION cluster, creating and deleting real accounts as it goes."
    narrowed_2026-08-18: "`verify:factors` was folded into `verify:live`, so the chain
      is one command covering five walks rather than four plus one nobody was told to
      run. It shipped 2026-08-17 as a standalone and its own sprint report filed that
      as debt while opening no item for it. That reduces what must be remembered. It
      does NOT close this."
    chain_live_proven: "2026-08-18. The five-walk chain was RUN, not just declared - `npm run
      verify:live` exit 0 against the production cluster, with `verify:factors` executing INSIDE
      the chain (reveal 20/20, factors 15/15 observed; the earlier three are proven by the `&&`
      reaching them). Every disposable account cleaned up, HTTP 200 on each close.
      Recorded because the change that added the fifth walk was itself only proven in parts - the
      guard test, and the walk standing alone - which is the same wired-not-live-proven gap this
      file keeps catching. A gate whose composite has never executed is a gate on paper."
    why_it_is_still_out_of_ci: "Unchanged and still correct: `.env.local` points at
      production because Relay has no dev database, and a job writing to customers'
      data to check a pull request is not a gate, it is a hazard - the rows it forgot
      would be the ones nobody was watching. An early multi-owner run left four behind,
      which is the argument rather than a hypothetical."
    it_happened_again_2026-08-18: "FOUR MORE were found on the production cluster, and not by
      the walks - by looking, after an unrelated question. `relay-a11y-1787097733392`,
      `relay-a11y-1787097708673`, `relay-d3shot-1787096967689` (2 vault items, 1 verifier,
      4 audit entries) and `relay-stepup-e2e-1787031095368`, the oldest from 2026-08-17. Every
      run that made them REPORTED success; a walk that dies mid-way, or a fixture script that
      never had a close step, leaves rows and says nothing.
      ⚠️ THIS IS THE SAME ARGUMENT A SECOND TIME, which is what makes it worth writing down:
      the hazard is not that a CI job would be careless, it is that NOTHING COUNTS THE ROWS.
      Purged 2026-08-18 through `deleteAccount()` - the product's own cascade, never a
      hand-written DELETE, because this schema has no FK constraints and that function IS the
      integrity layer. Each was checked first for a subscription and for standby roles in other
      owners' rosters (all zero) - a disposable-looking account holding live billing is the
      recorded trap. Verified after: zero `.test` owners remain and zero leftover rows across
      vault_items, recipients, verifiers, access_rules, release_state, invitations and
      subscriptions.
      🔑 THE REAL GAP IT EXPOSES: a separate test cluster would make the walks safe, but it would
      NOT make an abandoned row visible. A count of disposable accounts older than a day, checked
      somewhere, is a smaller and more useful thing than the cluster - and nothing in this repo
      does it."
    the_argument_for_closing_it: "2026-08-18 supplied a clean one. D1's fail-closed
      boundary - `secret_kinds` required on every vault write - broke e2e-multiowner
      and e2e-ui, and `npm run gate` was GREEN throughout, because a unit suite cannot
      see a real write path. Only a deliberate manual re-run caught it. The half of the
      release gate that catches this class of regression is the half nothing schedules."
    blocked_on: "a separate test cluster. Infrastructure with a cost attached, Steve's
      call, and not a thing to arrange quietly inside a test file."
    # ⚠️ STILL OPEN. Two of this item's SYMPTOMS are now covered; its CAUSE is not,
    # and the distinction is the whole point of leaving it open rather than closing it
    # on a partial win.
    partially_mitigated:
      date: 2026-08-19
      what_shipped: "`npm run verify:orphans` (the counting half) and a staleness dead-man on
        `verify:live` (the remembering half). This entry's own text said of the first — 'a count
        of disposable accounts older than a day, checked somewhere, is a smaller and more useful
        thing than the cluster - and nothing in this repo does it.' Something in this repo does it
