  - id: approve-is-unreachable-before-the-first-rule
    owner: steve
    opened: 2026-08-21
    found_by: >-
      `scripts/e2e-request.ts`, on its first run - the J6 walk built to close D10. No unit test
      reaches it: it needs a real account in a real intermediate setup state.
    what: >-
      `release_state` rows are provisioned by `POST /api/rules` (and by setting a quorum), NOT by
      naming a recipient. `respondToChallenge`'s APPROVE arm requires one. So an owner who has
      named and invited somebody but has not yet written an access rule can be asked for access,
      can DENY perfectly well, and CANNOT APPROVE - they get HTTP 400 "No release state for that
      trigger type".
    and_worse: >-
      `claimRequest` sets status to `approved_by_owner` BEFORE the release_state lookup, and the
      two are not in one transaction. So the failed approve COMMITS the status change and then
      throws. The request is burned: it is no longer `awaiting_owner`, so it can never be answered
      again, and the audit record says the owner approved something that never happened.
    why_it_matters: >-
      It is reachable in ordinary setup order - name, invite, claim, ask - which is exactly the
      anxious window J6 exists for. The message means nothing to a person reading it on their phone
      about their own mother, and the second half puts a false event in the owner's own record: the
      one place they go to reconstruct what occurred.
    reachability: >-
      Requires a CLAIMED contact, so the owner did invite somebody. Not hypothetical, and not yet
      observed in production only because production has one owner and no claimed contacts.
    options:
      - "PROVISION ON APPROVE - call ensureReleaseState in the approve arm before the lookup.
         Smallest change, and makes approve always work. WARNING: it silently creates a
         release_state row as a side effect of answering a request, which is a state change the
         owner did not ask for."
      - "REFUSE EARLIER AND SAY SOMETHING TRUE - check for the row BEFORE claimRequest, so the
         request is not burned, and answer with copy an owner can act on. Does not make approve
         work; stops it lying."
      - "BOTH - refuse-before-burn is a correctness fix regardless of which way the product
         decision goes on provisioning. The transaction-ordering half has no argument against it."
    ends_when: >-
      Steve rules on which of the three, and the two FINDING assertions in
      `scripts/e2e-request.ts` are inverted to assert the new behaviour in the same commit as the
      fix. They are written to go RED when this is fixed, on purpose, so the fix cannot land
      without updating the record.
    closed:
      date: 2026-08-21
      ruled: "OPTION C - both halves. Steve, same session it was found."
      what_shipped: >-
        In `lib/release/challenge.ts`, the approve arm now (1) peeks at the open request for its
        trigger type, (2) calls `ensureReleaseState` - idempotent, so it returns the existing ARMED
        row untouched for every owner who already has one - and only then (3) claims the request.
        The ORDER is the half that matters beyond this bug: nothing is claimed until the thing it
        is claimed FOR is known to exist, so a failure while establishing the release row leaves the
        request `awaiting_owner` and answerable instead of consuming it forever.
      why_the_ordering_half_had_no_argument_against_it: >-
        There is no path back from `approved_by_owner` to `awaiting_owner`. Any throw between the
        claim and the first transition is unrecoverable for that request, whatever caused it. The
        provisioning half fixes the known trigger; the ordering half fixes the class.
      proven: >-
        UNIT - `lib/release/challenge.test.ts` gained three tests, one asserting the release read
        happens at a lower call index than the claim, one asserting no `UPDATE access_requests`
        occurs when provisioning throws, and one asserting an unknown request id provisions nothing.
        12 pass. LIVE - `scripts/e2e-request.ts` re-run against production: an owner with no access
        rule approves (HTTP 200), the release row is provisioned to `grace`, answering the same
        request twice is refused without a second row. 33/33.
      the_assertions_did_their_job: >-
        The two checks in the walk were written INVERTED, asserting the defect, so that fixing it
        would turn them red. It did. They are now inverted back and carry the history in place -
        which is the record working as designed rather than a silent edit.

  - id: the-live-chain-sits-at-its-own-signup-limit
    owner: steve
    opened: 2026-08-21
    found_by: >-
      Hit four times in one session while building the D10 walks - each time as a bare
      "ERROR: signup begin 429" part-way through a run, which reads as a flaky test and is not one.
      CLAUDE.md documents the arithmetic; nothing enforces or monitors it.
    what: >-
      `/api/auth/signup` allows LIMIT = 10 per WINDOW_MS = 1h, keyed on IP
      (`lib/http/rate-limit.ts` clientKey), held in per-instance memory. One full `verify:live`
      chain performs EXACTLY 10 signups. The release gate's live half therefore runs at 100% of its
      own rate limit, with zero headroom.
    why_it_matters: >-
      Any new assertion that needs an account breaks the chain, and breaks it MID-RUN rather than
      at the start - so the walks that already passed are wasted and the failure is
      indistinguishable from a real defect. It also means the chain cannot be run twice in an hour
      from one host, and the only workaround is restarting `npm run dev` to clear an in-memory
      limiter, which is a thing a person has to know. The constraint has now shaped the
      architecture of the verification (it is why `verify:journeys` is separate), and that should
      be a decision taken deliberately rather than inherited from an unexamined constant.
    do_not: >-
      Raise LIMIT to make the tests fit. It is the owner front door's abuse control, and loosening
      a security constant so a fixture chain fits inside it is the wrong direction of fit.
    options:
      - "LEAVE IT AND SAY SO - verify:journeys stays separate and the split is documented. Costs
         nothing, and is what shipped 2026-08-21. The two chains must then be run an hour apart, or
         with a dev restart between."
      - "EXEMPT THE RESERVED DOMAINS - skip the limiter for .test/.invalid/.localhost addresses,
         which undeliverable() already refuses to let anything else use. WARNING: it puts a bypass
         in an abuse control keyed on caller-suppliable input; it would need the reserved check to
         be the same one the mail seam uses, plus a test proving a real address never takes the
         exemption."
      - "A SEPARATE TEST CLUSTER - the standing answer to the whole class
         (verify-live-cannot-enter-ci, ruled deferred until the first paying customer). It solves
         this too, and it costs money."
    ends_when: >-
      Steve rules, or the separate-cluster decision is revisited and swallows it.

  - id: every-secrets-age-is-unknown                           # "D11"
    owner: steve
    opened: 2026-08-20
    what: >-
      docs/secret-rotation-runbook.md shipped 2026-08-19 with a "Last set" column reading
      `unknown` for all twelve secrets — written out deliberately, because the unanswerability was
      the finding. The procedure now exists; the clock it needs has no starting point.
    why_it_matters: >-
      A rotation runbook with no ages cannot tell you which secret to rotate first, and "rotate
      everything" is not available here: the runbook's own rule is that every secret in this
      product is signing or authenticating something in flight, and for the two JWT secrets that
      in-flight thing is a family in an emergency.
    ends_when: >-
      Each secret has a real last-set date, or an explicit "predates records" with the date that
      determination was made.
    note: >-
      The AWS access key's age is discoverable without asking anyone — `aws iam list-access-keys`
      returns `CreateDate`. ⚠️ `@aws-sdk/client-iam` is NOT a dependency of this repo, so that is a
      CLI-side lookup and not a script to add. The Vercel-held secrets have no such record and
      need Steve.
    note_corrected:
      date: 2026-08-28
      what_was_wrong: >-
        The sentence above is FALSE and has been since before this entry closed:
        `@aws-sdk/client-iam` IS in `package.json` — `devDependencies`, `^3.1111.0`. The note is
        left standing rather than overwritten, because the reasoning built on top of it ("so that
        is a CLI-side lookup and not a script to add") is what a later reader would otherwise
        inherit without seeing where it came from.
      why_it_matters_beyond_pedantry: >-
        The note talked a future session out of writing a script, on a premise that was not
        checked. The AWS CLI is Norton-blocked on this machine (recorded against D3.1, which
        reaches for the Node signer for the same reason), so "just use the CLI" is the advice
        that does not work here, and the SDK that does work was present the whole time. The
        general shape: a note that forecloses an option must carry the command that proves the
        premise, not a recollection of it.
      derive_it: "`node -e \"const p=require('./package.json');console.log(p.devDependencies['@aws-sdk/client-iam'])\"`" 
    closed:
      date: 2026-08-21
      by: claude
      how: "Every row in docs/secret-rotation-runbook.md now carries a date. The ten Vercel-held
        values were READ from the Vercel API (createdAt / updatedAt per key; values never
        fetched) rather than asked of Steve — this entry's own note assumed no such record
        existed, and one does. The three IAM keys were already dated from `aws iam
        list-access-keys`. AUTH_SECRET is recorded as not set in production rather than unknown."
      what_the_clock_now_says: "createdAt == updatedAt for all 26 production keys: NOTHING in
        production has ever been rotated. The oldest — NEXTAUTH_SECRET, both JWT secrets,
        CRON_SECRET, RESEND_API_KEY, OPENAI_API_KEY and the relay-runtime IAM key — date from
        2026-06-24, 58 days on 2026-08-21. The runbook's own rules decide what that means; this
        entry only supplies the starting point it lacked."
      caveat: "a Vercel date is when a value was PLACED, not when the upstream credential was
        ISSUED. That is the conservative direction for a rotation clock — a value older than its
        placement is older, never younger — so the dates are a floor on age, not an estimate."

  - id: the-auth-and-react-lines-are-a-major-version-behind    # "D12"
    owner: claude
    opened: 2026-08-20
    what: >-
      Dependency drift measured 2026-08-20 was patch/minor only with zero advisories. Two
      structural facts are worth recording anyway: `next-auth ^4.24.15` is the legacy line
      (v5/Auth.js is current), and React 18 runs under Next 16.
    why_it_matters: >-
      This is a WATCH ITEM AND NOT WORK, and it is filed precisely so it is not mistaken for work.
      A major-version upgrade of a working system is barred by the portfolio Infrastructure Change
      Policy absent a documented problem, and there is no documented problem — the current
      versions are secure and functioning. Recorded so the next reviewer who notices the gap finds
