  - id: the-suite-went-red-on-machine-load
    owner: claude
    opened: 2026-08-21
    found_by: >-
      Running the full suite repeatedly while verifying this session's work. It failed in two of
      three runs, on a DIFFERENT test each time.
    what: >-
      Seven tests dynamically import a heavy module graph - the six dependency smoke tests in
      `lib/setup.test.ts` (openai, resend, next-auth, the AWS SDK, pg, fast-check) and the
      cron-wiring assertion in `lib/release/grace-window-invariant.test.ts`. Alone, each takes well
      under a second. Inside the full suite, with 312 files transforming and importing in parallel,
      they intermittently blew vitest's 5s default and the suite went RED with nothing wrong.
    why_it_matters: >-
      A gate that goes red on machine load teaches people that red means nothing, and that costs
      exactly what a false green costs. This repo has recorded the green half of that lesson many
      times (a health check that never renders, a log that resets, a monitor counting its own
      traffic); this is the red half, and it had no entry. It is also the worst possible shape for
      a release gate on a branch-protected repo, where CI is the merge condition: a re-run makes it
      pass, which trains everyone to re-run rather than read.
    ends_when: >-
      The full suite passes repeatedly, and the fix does not weaken any assertion.
    closed:
      date: 2026-08-21
      what_shipped: >-
        An explicit 20s timeout on those seven tests, with the measurement and the reasoning written
        in place. NOTHING ELSE CHANGED - the assertions are identical.
      why_not_weaken_the_assertion: >-
        The obvious cheap fix for the grace-window one is to read `heartbeat.ts` as TEXT instead of
        importing it. That was rejected: the name would then match inside a COMMENT, which destroys
        the exact claim the test exists to make ("wired into the cron, not merely defined"). The
        assertion is right; the time budget was wrong. Move the budget.
      proven: >-
        Three consecutive full-suite runs green after the change - 3647 passed, 1 skipped - against
        two failures in the three runs before it.
      the_signal_if_it_returns: >-
        If these fire again at 20s, the finding is that a dependency's import cost has grown
        materially, which is worth knowing. It is NOT a reason to raise the number again.

  - id: the-key-wall-could-not-run-its-own-command
    owner: claude
    opened: 2026-08-21
    found_by: >-
      Running `npm run verify:kms` while preparing the restore drill (D3 + B4). It exited
      immediately: "KMS_KEY_ID is not set. Nothing to check."
    what: >-
      `npm run verify:kms` is declared as `--env-file=.env.admin`, and `.env.admin` carried the
      DSQL endpoints and AWS_PROFILE but never KMS_KEY_ID. So the one check in this repo whose
      failure is PERMANENT and unrecoverable - a CMK disabled, deleted or scheduled for deletion
      makes every vault unreadable forever, and a key pending deletion still decrypts, so every
      other signal stays green for the whole waiting period - was the one check that could not run
      the way it is documented.
    why_it_was_not_a_false_green: >-
      It failed CLOSED, exit 1. Nobody was being told the wall held; nobody was being told
      anything. That is the correct failure direction and it is why this is a defect rather than an
      incident. CLAUDE.md meanwhile records it as LIVE-PROVEN on 2026-08-20, which it was - by
      somebody supplying the key by hand. The proof was real and the command was not.
    ends_when: >-
      `npm run verify:kms` runs green from its own declared command, with no variable supplied by
      hand, and its refusal path names the fix rather than only the symptom.
    closed:
      date: 2026-08-21
      what_shipped: >-
        Two halves. (1) KMS_KEY_ID added to `.env.admin` - it is an identifier rather than a
        secret, it already appears in `.env.local`, and the file is gitignored. (2) The refusal
        message in `scripts/verify-kms.ts` now prints the exact fix
        (`grep ^KMS_KEY_ID= .env.local >> .env.admin`) instead of only the symptom, because a
        refusal that does not say what to do is one somebody routes around.
      proven_both_ways: >-
        POSITIVE - `npm run verify:kms`, no hand-set variables, reports the wall holding: CMK
        b3af288c... in us-east-1, Enabled, CUSTOMER-managed, SYMMETRIC_DEFAULT, not pending
        deletion, rotation off matching ROTATION_INTENDED, and the key policy still granting
        arn:aws:iam::461293170793:user/relay-runtime GenerateDataKey and Decrypt.
        NEGATIVE - `KMS_KEY_ID= npx tsx --env-file=.env.admin scripts/verify-kms.ts` still exits 1,
        and now prints the remedy.
      still_true: >-
        WARNING - `.env.admin` is gitignored and local to one machine, so this is fixed HERE and
        not everywhere. Any other host running `verify:kms` hits the same wall, and now gets told
        how to clear it. The general shape belongs with
        `the-read-only-identity-is-not-in-the-cloud`.

  - id: no-recurring-restore-drill-exists
