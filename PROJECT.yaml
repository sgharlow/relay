  - id: g1-editorial-over-paid
    date: 2026-08-16
    owner: steve
    decision: "Write opinion pieces for AARP and comparable elder-care communities that publish
      this kind of article, and treat editorial as a HIGHER PRIORITY than paid advertising.
      Paid lanes are not cancelled — they are demoted, unlaunched and unfunded, behind this."
    plan: docs/g1-editorial-lane.md
    supersedes: "the ordering in ratified.g1-lane-1-is-google-search-intent, taken hours earlier
      the same day. That decision was correct on the information available; Keyword Planner then
      supplied information that was not available, and this is the response to it."
    rationale: "Three paid instruments were tested on 2026-08-16 and all three failed, at a total
      cost of $0: Reddit community targeting (the caregiver communities are not in the targetable
      index), Reddit keyword targeting (does not narrow — 251.2m-314.1m under US-only), and Google
      search intent (~330 searches/month on-wedge, with 10 of 16 keyword ideas returning Netflix
      password sharing). The common thread is not three bad channels but one fact about the market:
      there is no self-identifying, addressable population searching for this, and no platform will
      sell access to it by inference either.
      That fact kills HARVESTING and points at CREATING. Search advertising captures demand that
      already exists and the measurement says almost none does — but the people exist and are
      reading AARP and Next Avenue right now, about this exact problem, in words that are not our
      words. The gap is not reach; it is that nobody has a name for what they need until somebody
      describes it. An article does that and an ad cannot.
      Also consistent with project-founder-direction-2026-07-26, whose KPI is audience, not revenue."
    constraints_carried: "§1a third person; estate stays out (gates.g2-counsel-opinion.declined
      withdrew it permanently, so the death-and-inheritance piece must not be written however well
      it would place); no medical claims; commercial interest disclosed on every placement."
    known_risk: "⚠️ Most of these outlets do not run vendor-written promotional pieces, and
      pitching one as though they do gets a founder permanently blocked. The realistic shape is
      contributed expertise where the product is at most a byline. Reading each outlet's own
      contributor guidelines is step 1 of the plan and gates everything after it — the 2026-07-05
      portfolio rule about auditing a GTM channel's rules BEFORE ratifying it."
    measurement: "Each placement carries ?src=ed-<outlet>, and because GATE_LANES is an allow-list
      the src must be declared there IN THE SAME COMMIT the placement goes live, or the article runs
      and N stays at zero. Editorial is recorded as its own segment rather than blended into the
      paid headline ratio — g1-flight-log.md already computes per-lane ratios."
    unknown_and_stated: "Volume. One placement may deliver more qualified readers than the whole
      $250 paid flight would have, or forty. This is not known. What IS known is that the paid
      alternative was measured and cannot reach N>=100 inside the window at all, so the comparison
      is against something that does not work."

  - id: g1-lane-1-is-google-search-intent
    date: 2026-08-16
    owner: steve
    decision: "Reddit is retired as lane 1. Lane 1 becomes Google Ads SEARCH INTENT.
      `reddit-ads` removed from GATE_LANES the same day; `google-ads` added."
    supersedes: "docs/g1-ad-creatives.md's Reddit lane and screens 7-13 of
      docs/g1-sitting-sheet.md, both of which are marked NOT EXECUTABLE in place rather
      than deleted, because the evidence is the point."
    finding: "Established live in Ads Manager during the sitting, against a real ad
      account, with nothing submitted and nothing spent. Reddit sells no caregiver
      targeting. `dementia` and `Alzheimers` are refused outright on ToS — correct, since
      a subreddit defined by a diagnosis identifies people by inferred medical status,
      a restricted category and the same principle as the §1a copy rule. The other three
      are simply ABSENT from the targetable index: `AgingParents`, `CaregiverSupport` and
      `caregiv` all return No Search Results, while `personalfinance` returns
      r/personalfinance 21.8M in the same field, so it is the index and not the tooling.
      `eldercare` offers only r/CircleOfCaregivers at 245 users."
    fallback_tested_and_failed: "Keyword targeting, against a threshold Steve set BEFORE
      the number was visible: 'if it stays in the hundreds of millions, keyword targeting
      is not targeting and we stop there rather than spend.' With Personal Finance removed,
      keywords cut to nine caregiving terms, no communities and location United States, the
      audience estimate read 251.2m-314.1m — slightly HIGHER than the 248.3m-310.4m
      baseline that had included Personal Finance and 25 broad keywords, and far exceeding
      Reddit's US user base while scoped to the US. Either the estimator ignores targeting
      or the targeting does not narrow delivery; neither permits predicting or verifying
      who receives the ad."
    rationale: "Search intent matches a QUERY rather than inferring an attribute about a
      person, so the policy wall that closed Reddit does not exist there — and the wedge's
      defining moment is a situation, not a demographic. Somebody typing 'how do I access
      my mother's bank account while she is in hospital' has declared the exact need.
      Intent traffic also converts better than interest traffic, which matters on a gate
      already ratified as a directional read."
    unchanged: "the thresholds, the $250 ceiling, the 4-week window, the N>=100 stop, the
      directional-read constraint, both lane definitions, the landing page and the whole
      instrument. verify:funnel, flight:snapshot and the funnel events are channel-agnostic
      and needed no change."
    still_to_build: "a Google lane plan to replace docs/g1-sitting-sheet.md — keyword set,
      match types, negative keywords, budget shape, and the ad copy re-fitted to Google's
      character limits (R1 is written for Reddit's free-form body, which has no equivalent
      there). Google's own healthcare/health-adjacent copy policies must be read from the
      primary source before drafting, not from memory."
    watch: "⚠️ Meta is unlikely to be a quicker substitute — it removed most health and
      caregiving detailed-targeting options in 2022, so lane 2 may hit the same wall. Test
      that BEFORE investing in the image assets (D6), not after."
    note: "⚠️ Do NOT reuse report-bridge's Google Ads account (990-960-7101). Separate
      product, separate measurement, and the portfolio rule against sharing per-product
      billing surfaces applies."

  - id: two-constraints-on-unattended-work-2026-08-21
    date: 2026-08-21
    owner: steve
    decision: "Take BOTH cheap halves of the 'how do we handle this in future' question: branch
      protection on master now, and a read-only production credential (`relay_ro`). The full test
      environment (D4) stays deferred."
    the_question_behind_it: "Unattended and cloud agents hit two walls: they have no credentials,
      and they must not push master because a push auto-deploys to a live product. Both walls have
      ONE root cause — relay has no non-production environment, so 'a credential' and 'production
      access' are the same object. These two changes address the symptoms cheaply; only D4
      addresses the cause."
    what_shipped:
      branch_protection: "master requires a PR and two status checks (`verify`, `axe`) with
        `enforce_admins: true`, so NOBODY pushes it directly — not Steve, not an agent holding his
        token. `required_approving_review_count: 0`, so a solo operator can still self-merge and an
        emergency fix is a PR away rather than blocked. PROVEN rather than assumed: a throwaway
        empty commit was pushed at master and REJECTED ('Changes must be made through a pull
        request'; '2 of 2 required status checks are expected'), remote unchanged, probe discarded.
        ⚠️ `probe` is deliberately NOT required — production-canary.yml runs on a schedule and
        never on a PR, so requiring it would deadlock every PR forever.
        Rollback: `gh api -X DELETE repos/sgharlow/relay/branches/master/protection`."
      relay_ro: "IAM user `relay-ro` + `relay-ro-policy` (`dsql:DbConnect` on both clusters, and
        NOTHING else) mapped to DB role `relay_ro` by migration 039, applied to BOTH regions.
        SELECT on every table, no writes, no DDL, and — the point — NO KMS. `relay-dev` by contrast
        holds `kms:Decrypt`. So a leaked `relay_ro` key reads metadata and can never turn a
        ciphertext column into a secret."
    proven_not_assumed: "A no-op write probe (`WHERE 1=0`, `SELECT ... WHERE false`, so a missing
      permission check could not damage anything) ran in BOTH regions: 7/7 correct each time —
      SELECT allowed on users, vault_items, caregiver_leads and the catalog; UPDATE, DELETE and
      INSERT all refused with `permission denied`. Then the five database-only verifications were
      run under it end to end: verify:schema (both regions green), verify:dogfood (correctly NOT
      READY), verify:orphans, flight:snapshot, verify:roles."
    a_gap_this_created_and_closed: "`verify:roles` checked TWO roles and would have ignored
      `relay_ro` entirely — a new wall the instrument that guards the other two does not watch,
      which is precisely the shape that file's own header warns about ('anyone with admin can widen
      a role in one statement that appears in no diff'). It now checks three, via a
      `writesAnything` flag that defaults true so the original two are unchanged. Proven able to
      fail: declaring relay_ro a writer produced 78 problems; restoring returned it to green. Its
      summary line is now DERIVED from the contract, because it had gone on saying 'neither holds
      DDL' while three roles were being checked."
    what_it_does_NOT_unlock: "verify:iam and verify:kms. Those read the AWS API rather than the
      database, so a DB credential does nothing for them — and a credential that lives in someone
      else's cloud has no business enumerating IAM. They stay admin-run.
      ⚠️ I told Steve this unlocked 'all seven read-only scripts'. It unlocks FIVE. Corrected the
      same day, before anything was built on the wrong number."
    residual_risk_accepted: "`.env.ro` is still a PRODUCTION credential and still reads PII —
      emails, display names and vault item titles are plaintext columns. Read-only is not harmless.
      It was added to .gitignore BEFORE the key was ever created, because this repository is
      PUBLIC and a credential committed here would be world-readable."
    still_deferred: "D4, the real fix. And it is BIGGER than the 'cluster' I first described: the
      walks do a full KMS wrap/unwrap, so a genuine test environment needs its own CMK, IAM
      principal and env file as well as a DSQL cluster. Re-argue it under the 5-gate infra policy
      when there is a customer to justify it."

  - id: journey-safety-subset-2026-08-21
    date: 2026-08-21
    owner: steve
    decision: "Build the SAFETY-FIRST SUBSET of the open journey steps in ROADMAP §2-F — and only
      the steps that make an EXISTING promise true or fix a CUSTODIAL false-positive. A narrow,
      recorded exception to the demand-gate rule, not its removal."
    why_it_is_not_horizontal_build: "§1's own test: barred work adds a capability nobody asked for,
      justified by a forecast; obliged work makes an existing capability or promise actually true
      and safe, justified by a property of the live system. Each item below fails the first test
      and passes the second — every one of them was a thing the product already SAID it did."
    what_shipped:
      - "J5-R4 owner-reminder ladder before ARMED->PENDING. A living owner who missed ONE interval
        had their verifiers asked whether they were incapacitated, with no nudge first — J5's own
        preamble calls a false PENDING the fastest way to destroy trust, and spuriously-asked
        verifiers stop answering the real one. Rungs at 75% and 90% of the owner's interval."
      - "J6-R8 cooling-off after a refused access request (12h, per requester, per owner)."
      - "The Cancel control RETIRED (see docs/retired-surface.md). CANCELLED is terminal and one
        two-tap press permanently retired the whole trigger TYPE for that owner. Stand-down covers
        the case and re-arms. The grace->cancelled edge is KEPT with no caller."
      - "J4-R1 one person, many roles, at the point of ENTRY — a unified add-a-person form. A
        spouse who was both recipient and verifier used to be typed into two forms and became two
        rows, which is the failure J4-R1 describes verbatim."
      - "J3: the delegate scopes the consent copy promised but no handler honoured were WITHDRAWN
        rather than built, so the grant list, the routes and the copy now agree."
    found_while_doing_it_and_fixed:
      - "ONE HUMAN COULD BE COUNTED TWICE TOWARD A QUORUM. `countEligibleVerifiers` counted verifier
        ROWS, so one person invited at two addresses who claimed both with the same account, and
        was confirmed twice, counted as 2 — a 2-of-3 quorum satisfiable by one human, with the
        coverage matrix reporting two verifiers. Now counts DISTINCT claimed_user_id, with
        unclaimed rows counting individually (collapsing those would undercount M and block a real
        emergency). lib/release/one-human-one-vote.test.ts."
      - "A HELPER KEPT READING A SECRET THE OWNER HAD ROTATED. `created_by_delegate_id` grants a
        delegate read access to items they entered, and `updateItem` rewrote the ciphertext without
        clearing it — so when an owner CHANGED the password on an account their helper set up, the
        helper could still unwrap the new secret. The consent panel says the opposite in so many
        words. Fixed at the statement (`created_by_delegate_id = NULL`), not in the copy, because
        rotating a credential is very often exactly because someone should no longer have it."
    ladder: "Everything above is `built` or `wired`. NOTHING here is live-proven — the reminder
      ladder in particular runs only on the hourly cron and no walk covers it. ⚠️ Its failure mode
      is this repo's most-cited shape: if the candidate query is rejected, the sweep logs to stderr
      and returns empty, the cron still answers 200, the scheduler ledger still records a healthy
      run, and the reminder simply never exists."
    # 📍 POINTER ADDED 2026-08-28 (ROADMAP §2-H). NOT an edit to the ratified text above, which
    # stands as ratified. The `ladder:` sentence "NOTHING here is live-proven" was true when it
    # was ratified on 2026-08-21 and is now too strong: `e2e-request.ts` walks the 12-hour
    # cooling-off and `e2e-ui.ts` covers `/circle`, both against production. What genuinely
    # remains unproven is narrower and is the part the sentence's own failure-mode paragraph is
    # about — the J5-R4 reminder ladder (cron-only, no walk covers it, and its failure mode is a
    # healthy-looking 200 with no reminder) and owner self-naming. Read the sentence as scoped to
    # those two. B15.1 and B15.4 in ROADMAP §2-B are the work that would retire it outright.
    awaiting_ratification: "Three numbers were CHOSEN and documented, not measured, and each is a
      one-line edit with no migration: the reminder rungs (75% and 90% of the interval) and the
      12-hour cooling-off. A fourth question is open and NOT built: an owner can currently name
      THEMSELVES as their own recipient or verifier — `isEligibleVerifier` already refuses to count
      an owner toward quorum (rule 7), so the runtime hole is closed, but nothing stops the row
      being created and the roster reading as fuller than it is."

