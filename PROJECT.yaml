post_event_plan: "h0-verdict-disposition gate + auto-scheduled teardown (CCR triggers 7-25 + 7-31 tickler); commercial fork = the G1->G5 chain"

# Decisions ratified by Steve, recorded here so they stop reading as open items
# in the pre-ads blocker list. Each one had been authored but never confirmed.
ratified:
  - id: refund-stance
    date: 2026-08-09
    decision: "30-day money-back guarantee on every charge (renewals included), then no refund of the unused part of a year"
    supersedes: "no refund by default, with an email-us escape — authored, never confirmed"
    implemented: "lib/offer.ts is the single definition; consumed by the Terms, the /caregivers price card and the in-product PriceCard, pinned by lib/offer.test.ts"
    note: "Refunds are issued BY HAND in the Stripe dashboard — nothing in the codebase refunds, and Stripe's portal cancels without refunding. The copy routes to a human by design, and a test enforces that it keeps doing so."
  - id: g1-flight-power
    date: 2026-08-10
    decision: "hold the $250 ceiling and accept a DIRECTIONAL G1 read"
    detail: "The 2026-08-08 amendment to docs/g1-wtp-test-design.md puts the honest minimum at
      N ~= 250 for the ratio to distinguish 2% from 0.5%. The ratified $250 ceiling buys roughly
      125-200 clicks at $1-2 CPC per g1-channel-send-kit.md, less ad-blocker suppression of the
      analytics events -- so this flight is expected to land near N = 100-180, structurally short."
    rationale: "Steve chose the cheaper path to real caregiver words over a decisive ratio. The
      amendment already forbids a bare ship OR kill call on the ratio below N=250, and promotes the
      lead count and lead notes to a co-equal read, so the flight still produces a decision -- just
      one carried by lines 3 and 4 of the verdict rather than line 1."
    implemented: "Recorded at the top of the verdict section in docs/g1-flight-log.md, so the
      constraint is in front of whoever writes the verdict rather than in a decision log they may
      not open."
    revisit: "if the observed CPC comes in materially under $1, topping up toward N=250 becomes
      cheap enough to reconsider mid-flight"
  - id: build-standby-before-g1
    date: 2026-08-11
    decision: "build the standby architecture now rather than waiting for G1 evidence"
    supersedes: "the sequencing rule above -- 'NO further building until G1 produces evidence'"
    rationale: "Steve's ruling: the only way we get to G1 is to finish building the modified
      product for beta testing. The sequencing rule was written to stop horizontal build ahead of
      demand, and it is a good rule -- but it assumed the product could be tested as it stands.
      The 2026-08-11 analysis found it cannot: the escalation transition was missing, so the
      incapacity fast path did not work at all, and credential delivery rides a channel measured
      broken (Outlook SCL 5, Resend suppression returning 200). Buying traffic for a funnel whose
      product cannot serve its headline case spends the G1 budget on a known-bad reading."
    scope: "docs/standby-sprint-plan.md sprints A-F. Sprint A shipped 2026-08-11 (b5dc339) as a
      defect fix in its own right and did not need this override."
    unchanged: "G1 itself, its thresholds and its 2026-09-15 hard stop are untouched, as is
      g2-counsel-opinion. This changes WHEN building happens, not what the gates measure."
    # ⚠️ That sentence is the record of what was ratified on 2026-08-11 and is left
    # standing as such -- but the hard stop it names did NOT stay untouched. It moved
    # the same day (to 2026-10-31) as a stated consequence of this very ruling, and
    # again on 2026-08-14 (to 2026-10-02) once the sprints it waited on landed early.
    # THE THRESHOLDS ARE STILL UNTOUCHED, which is the part of the claim that matters.
    # Read gates.g1-caregiver-wtp for the live date; do not read it from here.
    risk_accepted: "If claim conversion is poor (sprint plan Phase 0), this build is partly wasted.
      Phase 0 exists to find that out and can run in parallel at no engineering cost."
  # ⚠️ SUPERSEDED 2026-08-14 by gates.g2-counsel-opinion.declined. Its "until" is
  # now "never": no counsel opinion is being sought, so estate is withdrawn from
  # the product permanently rather than held pending one. Kept because it is the
  # reasoning that got here, and because its `revisit:` line below — "when
  # g2-counsel-opinion is met" — is exactly the sentence a future reader would
  # otherwise act on.
  - id: estate-gated-until-counsel
    date: 2026-08-10
    superseded_by: gates.g2-counsel-opinion.declined (2026-08-14)
    decision: "estate stays OUT of the product until g2-counsel-opinion produces a written opinion"
    detail: "Found 2026-08-10: src/app/terms/page.tsx states 'Estate and inheritance functionality
      is not offered', and src/app/how-it-works deliberately excludes it -- while /rules rendered
      its trigger dropdown straight from VALID_TRIGGER_TYPES, so any signed-in owner could create a
      PERMANENT, irreversible estate handoff. The API accepted it too. Live Stripe means such a user
      is a paying estate customer, which is exactly what the g2 gate says requires counsel first."
    rationale: "Steve's call after pushback. The deciding argument was asymmetry, not law: with
      caregiver_leads at 0 and wtp_evidence none there is no estate customer to win today, so
      offering it early buys zero revenue against an uninsurable and irreversible risk -- while
      offering it after counsel costs only waiting. Secondary: every ad creative and the G1
      thresholds are calibrated on the emergency/incapacity positioning, so widening to estate 8
      days before the serving-by date would change what the gate measures."
    implemented: "USER_SELECTABLE_TRIGGER_TYPES in lib/domain/enums.ts, kept deliberately SEPARATE
      from VALID_TRIGGER_TYPES -- the domain still supports estate because Property 7, heartbeat
      blocking and grace windows depend on it, and existing rows must keep working. Enforced at the
      trust boundary, not in the dropdown: /api/rules, /api/policies, /api/triggers/[id]/initiate
      and /api/triggers/[id]/config all refuse it. Pinned by lib/domain/enums.test.ts, which fails
      if the list widens by accident. The estate acknowledgement path in /api/policies is left
      dormant rather than deleted."
    revisit: "when g2-counsel-opinion is met -- re-enabling is moving one string into one list"
  - id: beta-free-release
    date: 2026-08-13
    decision: "the free tier CAN release during beta; enforcement stays off until beta ends"
    detail: "TIER_LIMITS.free.canRelease is true. Founding families are onboarded by
      hand and will not have paid, so enforcing the paywall now would mean the beta
      cannot exercise the one capability the product exists for. The machinery is
      live rather than dead: checkout is wired and assertCanRelease is called on the
      release path (lib/release/triggers.ts:125), so turning enforcement on is one
      line rather than a discovery."
    recorded_because: "The pre-release audit found this deliberate and undated, paired
      with a skipped test (lib/billing/entitlements.test.ts) carrying no owner either.
      An undated temporary flag is a permanent flag nobody has admitted to. The flip
      also falsifies §2.7 of the user guide, which lib/billing/beta-flag.test.ts
      already enforces — so this is one decision with three artifacts that must move
      together."
    owner: steve
    revisit: "at every /daily-priority from 2026-10-01"

  - id: policy-edit-routes
    date: 2026-08-13
    decision: "retire PUT and DELETE /api/policies/[id] rather than wire them"
    detail: "Both sat in lib/ops/api-reachability.ts KNOWN_UNREACHABLE marked
      undecided — 'retire or wire' and 'a real product question'. The product
      question has an answer: a policy is a PROPOSAL that materialises into
      access_rules, and access_rules is the authoritative grant table. An owner who
      wants different access edits the rules on /rules, where the effect is visible.
      Editing the proposal after it has been accepted changes nothing a person can
      see, and un-accepting one would have to reconcile the rules it already wrote —
      a materialising layer that silently WIDENS or NARROWS access is exactly the
      hazard J4-R14/R15 were written about."
    rationale: "Carrying two undecided handlers through a release is how debt becomes
      permanent. Retiring is reversible; a half-built un-accept path in front of beta
      users is not."
    implemented: "Moved to docs/retired-surface.md with the reason and the
      replacement, and the handlers deleted. Policies are still removed as a cascade
      of deleting the person, which is the path that has always been used."

  - id: outbound-mail-bounds
    date: 2026-08-13
    owner: steve
    decision: "cap free-tier verifiers at 4, meter invitation email per owner, and
      clean every name that reaches a message"
    detail: "The 2026-08-13 release audit (docs/standby-sprint-plan.md §20) found
      the product was an open mail relay for anyone who signed up. Three gaps
      compounded: POST /api/verifiers had no entitlement cap (TIER_LIMITS had no
      `verifiers` key at all, while its sibling /api/recipients had been capped
      since the tier was written); POST /api/invitations had no rate limit and no
      daily ceiling and sends a real message per call; and a contact's `name` was
      validated only by isNonEmptyString while the owner's `display_name` was
      merely trimmed — the first lands in the message body, the second in the
      SUBJECT LINE. Signup is self-serve, so register → name N people → invite
      each → repeat was open to anybody, emitting SPF/DKIM-valid mail with
      attacker-chosen recipients and attacker-chosen text."
    rationale: "Steve's call on the number: 4, matching recipients, because a real
      N-of-M quorum runs at one or two and a circle is a spouse, a sibling, a
      doctor and a friend. The sender is a Resend account SHARED with
      report-bridge, so the reputation cost of abuse lands on a different
      project — which is what moved this from tidy-up to the audit's top finding.
      ⚠️ BETA_INVITE_CHANNEL='owner' did NOT cover it: that flag governs
      create-time only, and the invitations route defaults its own
      deliveryChannel to `email`."
    implemented: "TIER_LIMITS.verifiers + assertWithinVerifierCap (402, checked
      before the row is written); lib/notify/invite-budget.ts — 20 per owner per
      rolling 24h counted from audit_log, in the same shape as the AI meter,
      reserved inside inviteAndNotify because THREE callers reach the send;
      a per-owner burst limit on the route; cleanPersonName in lib/validation.ts
      as the single definition, applied to both people modules and to both doors
      onto display_name. lib/ops/outbound-mail-bounds.test.ts is the
      cross-cutting guard — it fails when a route that sends mail has no bound."
    revisit: "if a paying owner with a large circle hits the daily ceiling
      legitimately, which the message routes to a human by design"

  - id: retire-shared-totp-secret
    date: 2026-08-13
    owner: steve
    decision: "remove the shared TOTP_SECRET fallback entirely rather than scoping it"
    detail: "resolveTotpSecret fell back to one environment variable for ANY row
      with a NULL totp_secret. Its comment said the fallback covered accounts
      predating self-serve signup; in fact nothing writes a totp_secret except
      signup.ts, so every contact account — created by upsertUser via claim,
      break-glass and the seed — was NULL forever and covered by it. Sign-in is
      email+TOTP with no password, so that variable plus an address was a
      complete credential over a population that GREW with the beta. Measured on
      production: 5 of 6 accounts resolved through it, including demo@relay.test
      (25 items, and the is_demo_account flag that gates /api/demo/simulate)."
    rationale: "Three separate written claims asserted the opposite was true —
      the module header, sprint-plan §14's recorded non-finding, and §19's
      'nobody can sign into' the demo account, which was the whole argument for
      why seeding no credential was safe in a PUBLIC repo. Removing the fallback
      makes all three true rather than correcting them into a weaker product.
      Costs nothing that worked: only NULL-secret rows are affected and every one
      is a fixture; contacts sign in by claim code, emergency code or passkey."
    implemented: "lib/auth/resolve-totp-secret.ts reads no environment variable
      at all (asserted on the source). generateTotpCode/validateTotpCode — the
      two exports that read the shared secret, with no production caller — are
      deleted, and their RFC 6238 known-answer vectors moved onto the per-user
      functions sign-in actually calls. TOTP_SECRET is named in .env.example as
      RETIRED rather than dropped, so anyone finding it still set knows it is
      inert."

  - id: demo-accounts-never-sweep
    date: 2026-08-13
    owner: steve
    decision: "exclude seeded accounts from the heartbeat sweep AND make seeded
      contact addresses deliverable"
    detail: "demo@relay.test is live with two ARMED release_states and a 30-day
      interval, so around 2026-09-12 the hourly cron would have armed both
      triggers unattended and mailed its verifiers at @example.com — reserved
      domains that hard-bounce, on the sender shared with report-bridge. Nobody
      could have stopped it: a demo account has no credential, so no owner exists
      to check in and reverse the false alarm. §18 found this harm in the QA
      fixtures on 2026-08-12 and fixed it there; the SEED was never changed, and
      the seed is the copy that ships."
    rationale: "Both layers, because they close different things. The address
      change stops the bounces; only the sweep exclusion stops a fixture
      performing a real release nobody asked for. Structural rather than a data
      cleanup — the seed can be re-run at any time. A demo still advances through
      /api/demo/simulate, which is explicit and driven by a person."
    implemented: "is_demo_account = false in runHeartbeatSweep's WHERE clause
      (asserted on the query, not on the result); demoAddress() in
      lib/seed/demo-data.ts with a test that fails on any seeded contact in a
      reserved domain. The demo OWNER stays demo@relay.test — that string is the
      identity auth_sub derives from, not a channel."

  - id: csp-enforce-the-safe-four
    date: 2026-08-13
    owner: steve
    decision: "enforce base-uri, object-src, frame-ancestors and form-action;
      keep everything else report-only"
    detail: "CSP shipped wholly report-only. That reasoning is right about
      script-src — enforcing it needs nonces, which needs Node-runtime middleware
      on every request — and irrelevant to four directives that have nothing to do
      with Next's inline bootstrap and cannot blank a page. frame-ancestors was
      already being enforced in its older spelling by X-Frame-Options: DENY."
    rationale: "Real protection against base-tag injection and form hijack at zero
      page-break risk. Verified before enforcing that every form in the app is an
      onSubmit handler with no `action` attribute and that Stripe checkout is a
      redirect rather than a cross-origin POST."
    implemented: "next.config.mjs sends both headers. The load-bearing guard in
      lib/ops/security-headers.test.ts is the negative one: it fails if the
      ENFORCING header ever grows a directive that could white-screen the product,
      because merging the two headers is a one-word change."
    note: "⚠️ /api/csp-report still only writes to stderr, so the 'observe then
      enforce' plan for script-src has no observer. Deliberate for now — routing
      it through lib/ops/incident.ts was offered and declined."

  - id: landing-copy-third-person
    date: 2026-08-14
    owner: steve
    decision: "rewrite the caregiver landing copy into the third person BEFORE the
      first ad submission — option (b) of the three posed in docs/g1-flight-log.md"
    detail: "g1-ad-creatives.md §1a rewrote four creatives after reading Meta's
      Personal Attributes standard from the source: the attribute is not the
      violation, the attribute joined to 'you/your' is. That rewrite was applied to
      the ADS ONLY. Reviewers visit the destination, so the landing page kept the
      prohibited shape while every ad pointing at it was compliant. Three strings
      carried it, not the one the finding named: SUBHEAD ('when a parent lands in
      the hospital, YOU need THEIR accounts NOW'), OG_DESCRIPTION ('Opens for YOU
      in a real emergency, seals itself when THEY recover') and
      DIFFERENTIATORS[2].relay ('the emergencies YOU actually face — which are
      usually survivable', R3's exposed phrase verbatim)."
    rationale: "Timing is the whole argument. Editing ratified instrument copy
      mid-flight changes what the gate measures; editing it now costs nothing,
      because ZERO qualified visitors have ever seen either version
      (caregiver_leads = 0, N = 0, re-verified live 2026-08-14). The alternative —
      option (c), rewrite only if a creative is rejected — pays for the information
      in rejections, and repeated rejections put an ad account at risk inside a
      window that has no spare account."
    implemented: "src/app/caregivers/content.ts is the single definition;
      OG_TITLE/OG_DESCRIPTION MOVED there from page.tsx, because copy governed by a
      pre-committed rule has to be testable without rendering RSC — that is the
      file's own stated purpose, and living outside it is why the rule that fixed
      the ads could not see it. §1a's prose rule is now
      content.test.ts 'landing copy is ad-policy compliant at the destination':
      sentence-level co-occurrence of second person with a medical condition or a
      named relative, across every string on the page, with a negative case that
      fails on the text which actually shipped. It caught a fourth join no human
      read had noticed ('a recovery check-in … so nothing you share')."
    unchanged: "price, CTA, the reversibility lead, 'No rival does the second
      half', every src exclusion rule, both lane definitions. The gate measures the
      same thing. Second person stays everywhere it is harmless — 'Encrypted in
      your browser', 'the trigger you chose', 'Start your family's vault'."
    note: "⚠️ Compliance here is a self-assessment against a published standard,
      exactly as §1a says. Policy review at submission is the only authoritative
      signal, and Reddit's policy still has not been read from a primary source
      (business.reddithelp.com returns a CSS error to every fetch)."

  - id: stripe-merchant-name
    date: 2026-08-09
    decision: "leave as-is for the G1 flight"
    detail: "The live billing portal header reads 'Relay/ReportBridge/LearningAI365' — an account-level name on the Stripe account shared with report-bridge, learningai365 and skillcrossroads. Per-portal-configuration branding does not override it."
    rationale: "G1 measures click-to-intent, which happens before checkout, so this cannot bias the gate reading. It is only seen by someone who reaches payment during the beta."
    revisit: "if G1 passes — at which point the options are a neutral shared name or a Relay-only Stripe account"

  - id: g1-n-is-an-allow-list
    date: 2026-08-16
    owner: steve
    decision: "N counts ONLY the declared paid lanes. `isGateQualifyingSrc` becomes an
      allow-list (`GATE_LANES` in src/app/caregivers/content.ts), replacing the deny-list
      that counted anything tagged and not explicitly excluded."
    supersedes: "the deny-list form of the same function, and — as a consequence — makes
      SHOWCASE_SRCS, QA_SRCS and the `beta-` prefix redundant rather than load-bearing.
      They are KEPT in the resolver: they are the only place the reasoning lives, and they
      are a second lock on the one mistake that has no undo (a QA or beta value pasted into
      GATE_LANES, which the allow-list alone would happily count). content.test.ts asserts
      that intersection is empty."
    rationale: "The direction of the failure, not tidiness. A deny-list fails SILENTLY —
      nobody notices a denominator that is slightly too big; the ratio simply reads worse
      than the truth and the verdict is written from it, and every stray tagged source
      (a newsletter, a launch post, a founding-family link) arrives with no priced
      numerator behind it, so the bias is one-directional toward the <0.5% that KILLS D2C.
      An allow-list fails LOUDLY: forget to declare a new lane and its traffic reads zero
      on day one of a flight, which is impossible to miss and costs one string to fix.
      This is the portfolio's `structural safety over convention` rule applied to a
      measurement rather than to a permission."
    timing: "Taken before any traffic exists, deliberately, because there is no retroactive
      version: a caregiver_leads row can be deleted, a Vercel Analytics event cannot. The
      same argument that made the beta exclusion worth building the same day."
    unchanged: "the thresholds, the $250 ceiling, the 4-week window, the N>=100 stop, the
      directional-read constraint and both lane definitions. This narrows WHICH visitors
      enter the denominator; it does not change what the gate asks or where it cuts."
    implemented: "GATE_LANES = ['reddit-ads', 'meta-ads'] — the two lanes
      docs/g1-channel-send-kit.md buys. Adding a lane goes in the same commit as the ad
      that carries it. Pinned by content.test.ts, including that the sitting sheet's
      destination src is a declared lane, because under an allow-list a typo there reads
      as zero demand rather than as a typo."

  - id: beta-cohort-deferred
    date: 2026-08-16
    owner: steve
    decision: "Defer launching the beta cohort. Deferred with instructions, not dropped."
    handoff: docs/beta-cohort-handoff.md
    state: "Everything is built and tested and waiting on ONE input — the list of people (names,
      emails, recipient-or-verifier, delivery arm). `npm run invite:cohort` creates the cohort,
      issues every code, captures them and prints a ready-to-send message per person. Dry-run by
      default. Tier caps are not a constraint: the account is paid, so recipients and verifiers are
      unlimited."
    what_stays_manual_on_purpose: "The four-word verification call and sending the owner-delivered
      arm. Both are load-bearing rather than tedious — see the handoff. Automating either breaks
      what it protects."
    cost_of_the_delay: "Phase 0 stays at N=0, and TWO SHIPPED SECURITY DECISIONS rest on that
      number: principle 1 of the standby architecture is conditional on claim conversion, and
      adaptive minting assumes verifiers actually reach `confirmed`. Both are live in production
      against an assumption nobody has measured. That is the real cost, and it is not a marketing
      cost."
    also_deferred_same_session:
      - "gates.g1-arms-length-demand due date 2026-12-31 is a DERIVED PROPOSAL awaiting Steve's
        confirmation, not a chosen date"
      - "outlet guidelines research for caregiver.com, Next Avenue, AgingCare and DailyCaring —
        step 1 of docs/g1-editorial-lane.md, and it gates the first pitch"
      - "angle 3 draft, queued behind that research by Steve's ruling"
    revisit: "at the next /daily-priority. ⚠️ Per the Steve's-Court protocol a parked item is
      re-raised, never silently dropped — and this one has now been ready-and-unstarted since
      2026-08-12."

  - id: h0-badge-reframed
    date: 2026-08-16
    owner: steve
    decision: "Keep the award on /caregivers, drop the word 'Hackathon'. WINNER_BADGE becomes
      'Independently judged — Most Impactful, 2026'."
    rationale: "The audience changed underneath the string. It was written as distribution
      ammunition for paid traffic and a technical readership, where 'hackathon winner' is a
      credential. Editorial now lands caregivers on that page, and to that reader the word carries
      'weekend project' — on the one page asking them to trust a stranger with their family's
      accounts.
      This project had already reached that conclusion once and acted on it: src/app/security/
      page.tsx moved the Devpost and repo links off the front door because 'on a landing page it
      frames a credential vault as a weekend project'. The badge was the remaining instance."
    what_is_preserved: "'Independently judged' states the property that makes an award worth
      anything — someone outside the project assessed it — without the noun that misreads.
      Understating a real third-party signal would be its own dishonesty, which is why the award
      was kept rather than removed. The unabridged fact, event name included, stays on /security
      and /about where the context is right."
    pinned: "content.test.ts asserts BOTH halves — that the award survives and that 'hackathon'
      does not reappear — so a future edit has to move each deliberately."

  - id: g1-demand-gate-replaced
    date: 2026-08-16
    owner: steve
    decision: "Retire the G1 click-to-intent ratio. Replace it with gates.g1-arms-length-demand:
      ONE arms-length person who pays, or states in writing they would pay, at a price they have
      seen."
    rationale: "The ratio needed a denominator, a calibrated threshold and a channel willing to
      sell us the audience. Two months established the channel does not exist, and the 2026-08-16
      Keyword Planner run established the demand is not sitting in search either. Its thresholds
      were calibrated against bought clicks and do not transfer to editorial readers. A gate that
      cannot be evaluated is worse than no gate — it is how this portfolio accumulates past-due
      -undecided gates.
      The replacement needs no denominator, no calibration and no channel, so it works identically
      whichever route produces the first person — op-ed, B2B2C pilot, beta invitation or
      conversation. Nobody can say in advance which that will be, and the old gate implicitly bet
      on one."
    the_bar: "Across 43 portfolio projects over ~24 months, arms-length revenue has been achieved
      exactly zero times. One is not a low bar in this context; it is the bar that has never been
      cleared."
    date_status: "✅ CONFIRMED by Steve 2026-08-16, as derived. It is now a decision rather than a
      proposal. ⚠️ The rule that governs every other date in this file applies to this one: a third
      party moving it is fine, a silent slide is not. Any change gets a dated record and a reason."

  - id: import-never-overwrites-a-vault-item
    date: 2026-08-16
    decision: "Re-importing an export EXPLAINS what it skipped. It does not update existing items."
    why: "Re-import is the natural way to pick up a two-factor code added after the first import, and
      splitDuplicates matches on a normalised title + service_name — so every row is skipped and the
      result reads `imported: 0`, which looks like success. The fix is the SENTENCE, not the
      behaviour: making import update duplicates would turn it into a path that can write over stored
      vault secrets, which it has never been. A mis-mapped column or a stale export could quietly
      replace a good credential with a worse one, on the accounts that matter most."
    scope_measured: "Production on 2026-08-16 held 1 owner and 0 vault items, and the single import
      event (40 items, 2026-08-12) refers to rows that no longer exist. NOBODY has lost a second
      factor to this. It was called blocking twice before anyone measured it — that is the error the
      rule about re-deriving numbers live exists to prevent."
    enforced_by: lib/ops/import-duplicates-explained.test.ts
    owner: steve

  - id: no-single-item-ciphertext-endpoint-yet
    date: 2026-08-16
    decision: "Field-level editing of a vault item is DEFERRED until a real vault needs it. The edit
      form keeps its replace-everything semantics and says so."
    why: "Adding a two-factor code to an existing item means retyping its password, because merging
      would need the item's ciphertext and there is no single-item endpoint to fetch it from — the
      GET was retired 2026-08-13 and /api/account/export is the whole vault behind a step-up. Adding
      one is a NEW SERVER SURFACE handing out ciphertext, needing its own auth, body-limit and
      step-up decisions. At 1 owner and 0 items nobody is retyping anything, so the surface buys
      nothing today."
    revisit_when: "The first real owner has a vault they maintain over time."
    also_settles: "⚠️ When it IS built, the step-up question comes with it. step-up-guard's own test is
      'would finding this machine unlocked hand somebody something that OUTLIVES the session?' — and a
      TOTP seed does, in a way a password does not, because it cannot be rotated by changing a
      password. /api/kms/unwrap's owner branch is currently OUT OF SCOPE of that guard, which only
      walks /api/account. Decide it in the same change, not after."
    owner: steve

  - id: relay-operator-is-an-individual
    date: 2026-08-16
    owner: steve
    decision: "Relay is operated by Steve personally. There is NO business entity and NO EIN."
    why_it_was_asked: "The Terms of Service — a contract a paying customer enters — name no party.
      The 2026-08-16 readiness assessment found the same unresolved fact blocking four separate
      surfaces, and the repo had already hit it three times without settling it."
    consequences:
      legal: "/terms and /privacy must name Steve as the operator. An unnamed provider in a contract
        is a defect in its own right, and it is the first thing a cautious reader checks before
        handing over family credentials."
      editorial: "An About page naming a real person unblocks the op-ed plan. Most contributor
        guidelines require an author bio and affiliation, and a pitch from an unattributable site
        reads as spam. A named individual is not a weakness here — for early-stage software a person
        is generally trusted more than an anonymous 'we'."
      sms_10dlc: "SETTLED. docs/deliverability-options-3-and-5.md could not choose a route because it
        did not know whether Relay had an EIN. It does not, so **Sole Proprietor is the only
        available route** — one 10DLC number, low throughput, lifetime three-use OTP limit. The
        Standard brand route requires a Tax ID and is closed. That doc's open question can now be
        answered rather than carried."
      stripe: "ratified.stripe-merchant-name left the shared 'Relay/ReportBridge/LearningAI365'
        header as-is 'for the G1 flight'. That flight is cancelled, so the stated reason has expired
        — but with no entity, separating the merchant name means a second personal Stripe account
        rather than a clean corporate one. Not urgent while volume is zero; re-decide if a real
        customer ever remarks on it."
    boundary: "⚠️ Naming Steve as Relay's operator is fine and is the point. It must NOT pull in any
      employment detail — the employer-anonymity rule (feedback_no_employer_references) is unchanged
      and applies with full force to any bio written for an outlet."

  - id: j9-5-7-dropped
    date: 2026-08-16
    owner: steve
    decision: "DROP J9 steps 5-7 — reversal receipt, re-arm confirmation, thank-you-the-recipient.
      Not deferred a fourth time: dropped."
    rationale: "docs/user-journeys.md filed these under a heading that reads 'Known gaps that are
      NOT defects', and the sentence directly beneath them was always the answer: 'Step 4 now
      carries the emotional weight these were meant to share.' Step 4 — the graceful close — was
