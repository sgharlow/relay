      live_proven: "2026-08-19, every path against the production cluster rather than in parts:
        an empty cluster reported as empty; a real orphan FOUND (a failed `disposable-owner
        create` left an account behind while exiting 1 — this item's exact failure mode,
        reproduced by accident within minutes of the tool existing); the row census returning real
        counts across all seven tables; and the alarm path firing with exit 1 under `--hours
        0.001`. Cleaned up afterwards through the product's own cascade; final sweep reads zero."
      what_is_NOT_covered: "the cause. The walks still write to the PRODUCTION cluster because
        Relay has no dev database, and no count makes that safe — it only makes the residue
        visible. `verify:live` is still not in CI and still must not be. The cluster remains
        Steve's call."
      # 🔴 THE FINDING THAT JUSTIFIES THIS ENTRY EXISTING AT ALL.
      and_the_first_run_found_a_bug: "Both new scripts invoked a bare `tsx`, which is not a
        declared dependency here — every other script entry uses `npx tsx`. `verify:orphans`
        simply failed; `verify:stamp` is the LAST link of `verify:live`, so the chain would have
        run all five walks against production and then died at the final step leaving no stamp —
        and the freshness dead-man would have read that as 'the walks never ran', on the day they
        had. A wasted production run and a lying monitor, from a missing three-character prefix,
        invisible to types, lint, tests and build. Fixed with a guard (`gate-script.test.ts`).
        Recorded here because it is the cleanest evidence this file has for its own claim ladder:
        wired is not live-proven, and the gap between them was one `npx`."
    ruled:
      date: 2026-08-20
      by: steve
      decision: "DEFER the test cluster until the first paying customer. Offered the priced
