# PROJECT.yaml — machine-readable project contract. Single source of truth for volatile
# facts and gates; prose docs reference this file, they never restate its values.
# Standard: global CLAUDE.md "Documentation & Claim Discipline" (2026-07-01). Checked by /roadmap-lint.

name: relay

# No standalone ROADMAP exists — the forward/commercial roadmap lives in the Build Spec §16–27
# (the richest strategy doc in the portfolio, per the 2026-07-01 audit; its gap is operational
# sequencing, which the gates below supply).
authoritative_plan: specs/Relay_H0_Build_Spec_v2.md

# Ratified architecture direction as of 2026-08-11. Subsidiary to the Build Spec above, which stays
# authoritative for strategy; this is authoritative for HOW release access is delivered. It removes
# the credential from the delivery path: every named person claims a standby account in calm, and at
# release nothing secret is transmitted. Supersedes relay-standby-pivot.md, which is retained for
# its reasoning. Recorded here because a direction that is not discoverable from this file is a
# direction the next session will not find.
architecture_plan: docs/standby-architecture.md   # version: hybrid+6

# dogfooded = deployed live + full E2E dogfood on real Aurora DSQL + KMS (2026-06-27), H0-submitted.
# Promote to customer-used only at the first arms-length user — which is gated on G1/G2 below.
#
# 2026-08-07: Sprints 1-4 of docs/implementation-plan-4-sprints.md shipped and deployed. The H0
# spine remains dogfooded; the NEW surfaces (policies, delegation, verifier decisions, access
# requests) are live-proven at the lib/API layer against the real cluster but have NOT been
# dogfooded through the UI end to end. They are "live-proven", not "dogfooded" — do not conflate.
#
# SUPERSEDED 2026-08-08: all ten journeys were walked against production as a brand-new self-serve
# account (sweep table at the top of docs/user-journeys.md), closing the distinction the note above
# draws for those newer surfaces.
#
# STAYS `dogfooded` as of 2026-08-09, deliberately. A real card was charged on 2026-08-08 — but it
# was the owner's own card. Paying yourself is not a customer, so it advances nothing here:
# `customer-used` needs an arms-length user and `revenue-proven` needs arms-length money. Promotion
# stays gated on G1/G2, and market.wtp_evidence is still `none`.
ladder: dogfooded

derived:
  test_count: "npx vitest run 2>&1 | grep -E 'Tests .* passed' | tail -1   # static proxy: grep -rE '\\b(it|test)\\(' --include='*.test.*' lib src | wc -l"
  head: "git rev-parse --short HEAD"
  branch: "git branch --show-current"
  # Added 2026-08-15 because README.md had been claiming "28 API routes" — a
  # hardcoded number that had drifted to less than half the truth, in the one
  # document a stranger reads first. The volatile-numbers rule exists for exactly
  # this; the number now has a command instead of a copy.
  api_routes: "find src/app/api -name route.ts -not -name '*.test.*' | wc -l"
  pages: "find src/app -name page.tsx | wc -l"

# Sequencing rule (from the 2026-07-01 audit): NO further building until G1 produces evidence.
#
# 🔴 THE CHAIN HAD A LINK THAT CAN NEVER CLOSE, corrected 2026-08-14. It read
# "G1 WTP -> G2 counsel -> G3 B2B2C pilot LOI -> G4 billing MVP -> G5 audited
# crypto", with G3-G5 entering this file "only after G1/G2 pass". G2 was DECLINED
# rather than met (see its `declined:` block below) — it is not going to pass, so
# as written every remaining gate was waiting on a condition with no path to
# being satisfied. A dead precondition does not stop work; it stops work being
# SCHEDULED, silently, which is worse.
#
# Corrected chain: G1 WTP -> G3 B2B2C pilot LOI -> G4 billing MVP -> G5 audited
# crypto. G3-G5 enter this file as gates once G1 passes.
#
# 🔄 AMENDED 2026-08-16 — G3 NOW RUNS IN PARALLEL WITH G1, NOT AFTER IT.
# ratified.retire-paid-advertising abandons paid channels and makes op-eds the
# route to visibility. G1's own kill branch already pointed at "B2B2C-only", and
# the paid instrument proved unrunnable rather than run-and-failed, so waiting
# for a G1 verdict before starting B2B2C conversations would be waiting on a
# measurement whose new timeline nobody can yet predict.
#
# The two are also mutually reinforcing rather than merely concurrent: a published
# op-ed is the standing that gets a benefits broker or credit-union product lead to
# take the meeting, and that meeting is G3. ⚠️ They remain SEPARATE measurements —
# earned awareness is not distribution, and reporting one as the other is how a
# gate stops meaning anything.
#
# ⚠️ G2 IS CLOSED, NOT SATISFIED, AND G3 INHERITS THAT. The B2B2C route was also
# the gate's own kill condition ("adverse opinion -> B2B2C-through-regulated-
# partners only"), and a regulated partner's diligence asks the questions the
# opinion would have answered. G3 therefore starts from "no legal opinion
# exists", which is a real fact about that conversation rather than an oversight
# — and one of the declined block's `revisit:` triggers is exactly that
# conversation happening.
gates:
  - id: h0-verdict-disposition
    metric: post_judging_decision (H0 judging ends 2026-07-24; winners ~2026-07-31; DSQL/KMS teardown auto-fires 7-25)
    target: "explicit commercialize / park / archive decision recorded within a week of results"
    kill: "n/a — the decision itself is the gate"
    owner: steve
    due: 2026-08-07
    met:
      date: 2026-08-07
      result: "WIN — H0 'Most Impactful' ($2k cash + $2k AWS credits, announced 2026-08-05)"
      decision: commercialize
      rationale: "Per pre-committed disposition plan (docs/h0-disposition-plan.md, 2026-07-03): a win is distribution ammunition, and every branch runs G1 before any park/archive call. The judges' verdict is evidence about the hackathon, not about the market."
      next: "G1 paid lanes (docs/g1-launch-checklist.md) — the instrument is now live-proven end to end on production (2026-08-07): all six funnel events observed on the wire carrying src attribution. Start G2 counsel outreach the same week (docs/g2-counsel-brief.md)."
      caveat: "G1 has still measured ZERO traffic. N=0 qualified. This gate records the disposition, not demand evidence."
  # ⛔ SUPERSEDED 2026-08-16 BY gates.g1-arms-length-demand, BELOW.
  # Retained whole, because it is the ratified record of what was decided on
  # 2026-07-01 and of an instrument that was built, verified and then found to
  # have no traffic it could buy. Do not act on any figure in it.
  - id: g1-caregiver-wtp
    superseded_by: g1-arms-length-demand
    metric: willingness_to_pay_signal (landing + price test on the caregiver wedge, N>=100 qualified visitors)
    target: ">= 2% click-to-intent at a real price point  # ratified by Steve 2026-07-01"
    kill: "< 0.5% after 100+ qualified -> park D2C; B2B2C-only or archive  # ratified 2026-07-01"
    owner: steve
    due: 2026-10-02
    # 🔴 THE INSTRUMENT IS RETIRED AND THE NUMBERS ABOVE NO LONGER MEAN WHAT THEY SAY.
    # Left standing rather than edited because they are the ratified record of what was
    # decided on 2026-07-01, and overwriting a ratified threshold in place is the drift
    # this file exists to prevent. Read this block before acting on any figure above it.
    instrument_retired:
      date: 2026-08-16
      by: steve
      what: "The metric above is a PAID-TRAFFIC test: N >= 100 qualified visitors BOUGHT through
        ratified channels. Paid advertising is abandoned (ratified.retire-paid-advertising), so
        this instrument cannot be run at all. Not 'was run and failed' — could not be run."
      why_it_could_not_run: "Three channels measured on 2026-08-16 at $0: Reddit sells no caregiver
        community targeting (the communities are absent from the targetable index), Reddit keyword
        targeting does not narrow (251.2m-314.1m under US-only), and Google search carries only
        ~330 on-wedge searches/month with ten of sixteen keyword ideas returning Netflix password
        sharing. No ad ever served and no money was spent."
      status: "OPEN, re-instrumented — NOT met, NOT killed, NOT expired. The question is unchanged:
        will caregivers pay, at a real price, having seen the number. Only the way of putting that
        question to them has changed."
      new_instrument: "Editorial. Op-eds on caregiver and elder-care platforms (caregiver.com,
        AARP, Next Avenue and comparable), each placement carrying its own ed-<outlet> src.
        Plan: docs/g1-editorial-lane.md."
      # ⚠️ THE OPEN TASK NOBODY SHOULD SKIP.
      thresholds_do_not_transfer: "2% click-to-intent and N >= 100 were calibrated against BOUGHT
        CLICKS. An editorial reader arrives having read a whole article about the problem and is a
        different population with a different expected conversion rate — plausibly much higher per
        visitor and far lower in volume. Carrying 2% across and pretending it means the same thing
        would be a fabricated gate. RE-DERIVING the threshold and N for the editorial instrument is
        an OPEN TASK owned by Steve, and it must be done BEFORE the first placement goes live so the
        number cannot be reverse-engineered from whichever result appears."
      due_date_status: "2026-10-02 was derived backwards from an ad-serving date that will never
        happen (submit ~08-26, serve ~08-28, 4-week window, one rejection cycle of slack). It is
        therefore MEANINGLESS as written and must be re-derived from the editorial pitch-to-
        publication timeline, which is slower and far less predictable than buying clicks. Not
        silently moved here — moving a gate date is a decision with a record, and this one is
        Steve's to make once the first outlet responds."
      kill_branch_note: "The kill condition above already routed to 'park D2C; B2B2C-only or
        archive'. That is the direction now being taken, but arrived at differently: the test proved
        UNRUNNABLE rather than run-and-failed. ⚠️ An unbuyable channel is not evidence of low
        willingness to pay. Do not record this as a D2C kill — it is a channel finding, and the
        editorial instrument exists precisely to ask the demand question a different way."
    # `moved:` is a LIST as of the second move. It was a single mapping, and a
    # second move would have had to overwrite the first -- destroying the record
    # the rule below exists to create. Newest LAST; the date above always equals
    # the last entry's `to:`.
    moved:
      - from: 2026-09-15
        to: 2026-10-31
        date: 2026-08-11
        by: steve
        why: "Consequence of ratified.build-standby-before-g1. The old date required the first ad
          SERVING by 08-18 to fit a 4-week window, and sprint C alone (passkeys, with no first-class
          next-auth v4 support) does not fit in seven days. Running the flight on the funnel we are
          replacing would spend the ratified $250 on a reading of the old product -- the exact
          known-bad reading the build ruling was made to avoid."
        derivation: "sprints C-E ~4 weeks -> ~09-08; Phase 0 claim conversion measured on the REAL
          claim flow ~09-15; ad serving by ~09-22; 4-week window -> verdict ~10-20; slack -> 10-31."
        unchanged: "thresholds, the $250 ceiling (ratified.g1-flight-power), and the directional-read
          constraint. Only the date moved."
      - from: 2026-10-31
        to: 2026-10-02
        date: 2026-08-14
        by: steve
        direction: EARLIER
        why: "The first move's derivation was overtaken by events within three days,
          and a date carrying slack it no longer earns is a date that invites the
          drift this gate's own rule was written against. Sprints C-E were budgeted
          at ~4 weeks to ~09-08; they landed 2026-08-14, twenty-five days early. The
          reason the flight was held -- that buying traffic for the funnel we were
          replacing would purchase a reading of the old product -- is satisfied: the
          replacement is live, and the landing page it lands on was made ad-policy
          compliant the same day (ratified.landing-copy-third-person)."
        derivation: "Re-derived term by term against today rather than adjusted.
          Ad sitting + submission ~2 weeks (Steve's card, Steve's sitting, per the
          co-pilot contract) -> R1 APPROVED AND SERVING by 2026-08-28; 4-week window
          -> 2026-09-25 (or N>=100, whichever first); 1 week slack, sized to absorb
          exactly one rejection-and-resubmit cycle -> 2026-10-02."
        phase_0_is_not_in_this_chain: "The first derivation placed Phase 0 claim
          conversion in SERIES between the build and ad serving. That was wrong on
          its own terms -- ratified.build-standby-before-g1 states Phase 0 'can run
          in parallel at no engineering cost' -- and it is wrong on the mechanics:
          neither lane's conversion path touches the claim flow (Lane A is a form
          POST; Lane B is signup -> seed -> reveal -> price -> Stripe). Phase 0
          remains at N=0 and remains important; it is simply not a precondition for
          the measurement this gate makes, and holding the gate for it would be
          holding it for an invitation nobody has sent."
        unchanged: "thresholds, the $250 ceiling (ratified.g1-flight-power), the
          directional-read constraint, the 4-week window and the N>=100 stop. Only
          the date moved -- in the other direction this time."
        note: "⚠️ The window straddles report-bridge's go-live target. Accepted
          knowingly: the daily obligation here is the snapshot in g1-flight-log.md,
          a ten-minute read of two dashboards.
          ⚠️ THE DATE IS NOT RESTATED HERE ON PURPOSE. It belongs to another repo
          (domo-ssrs/roadmap.md, 'GO-LIVE ROADMAP'), that repo says in its own
          header it is 'still deciding whether 9-12 holds', and its GL-G1 gate
          carries an explicit re-date clause. A cross-project date copied into this
          file is one nobody maintaining the other project will ever update — the
          volatile-numbers rule applies across repos, not just within one. Read it
          there if the overlap ever matters."
    # ⚠️ This gate has now moved TWICE, both times with an explicit decision, a
    # derivation and a record -- 2026-08-11 later, 2026-08-14 earlier. The rule is
    # unchanged and applies to a THIRD move: a gate that slides quietly is how this
    # portfolio accumulates past-due-undecided gates. Note that the rule is about
    # RECORDING, not about direction; moving a date earlier is just as capable of
    # being a quiet fudge as moving it later, so it gets the same treatment.
    revisit: "at every /daily-priority from 2026-09-01 -- moved earlier with the gate.
      A revisit that began 2026-10-01 would have first fired the day before the hard
      stop, which is a reminder that arrives too late to change anything. 09-01 is
      four days after the serving-by date, so the first question it asks is the one
      that matters: did the ad actually go live?"
  - id: g1-arms-length-demand
    metric: "ONE arms-length person — not Steve, not a friend doing a favour — who either PAYS, or
      states in writing that they would pay, at a real price they have seen."
    target: "1"
    kill: "zero by the date below -> park D2C consumer acquisition; B2B2C-only or archive"
    owner: steve
    due: 2026-12-31
    replaces: g1-caregiver-wtp
    date_ratified: 2026-08-16
    # ✅ CONFIRMED BY STEVE 2026-08-16. It began as my derivation and is now his
    # decision — the distinction matters, because an unconfirmed number on the
    # only live gate is a number nobody is accountable to. The derivation that
    # produced it is kept below as the reasoning, not as a caveat:
    # guidelines + draft ~1 week,
    # pitch ~1 week, editor response 2-4 weeks, publication 2-6 weeks after
    # acceptance = a first placement plausibly mid-October to mid-November, plus
    # time for a reader to arrive and act. 2026-12-31 is the first date that does
    # not require everything to go right. Correct it if you disagree; do not let
    # it slide silently, which is the failure this whole gate section exists to
    # prevent.
    why_this_shape: "The ratio it replaces required a denominator, a calibrated threshold and a
      channel that would sell us the audience. Two months established that the last of those does
      not exist, and today's Keyword Planner run established that the demand is not sitting in
      search either. A gate that cannot be evaluated is worse than no gate.
      This one needs no denominator, no calibration and no channel. It works identically whether
      the person arrives from an op-ed, a B2B2C pilot, a beta invitation or a conversation — which
      matters, because after paid advertising was retired nobody can say in advance which of those
      will produce the first one."
    why_one_is_enough: "Across 43 portfolio projects over ~24 months, arms-length revenue has been
      achieved exactly zero times (2026-07-05 retrospective). The binding question has never been
      'what conversion rate' — it is whether a single stranger wants this enough to pay. One is not
      a low bar here; it is the bar that has never been cleared."
    what_does_not_count: "Steve paying himself (already happened 2026-08-08 and advanced nothing).
      A friend or family member being polite. A free beta user enjoying it. A verbal 'that sounds
      useful'. Anything without either money moving or a written statement of intent at a seen
      price."
    unchanged: "market.wtp_evidence stays `none` until this is met. The ladder stays `dogfooded` —
      `customer-used` needs an arms-length user and `revenue-proven` needs arms-length money, which
      is precisely what this gate now measures."
    revisit: "at every /daily-priority from 2026-10-01"

  - id: g2-counsel-opinion
    metric: legal_opinion_on_fiduciary_custodian_status (RUFADAA/estate access — REQUIRED before any paying estate customer)
    target: "written counsel opinion obtained"
    kill: "adverse opinion -> B2B2C-through-regulated-partners only, or park  # ratified 2026-07-01"
    owner: steve
    due: 2026-09-30
    declined:
      date: 2026-08-14
      by: steve
      decision: "no counsel will be engaged. Estate is narrowed OUT of the product
        PERMANENTLY rather than held pending an opinion. This gate is closed by
        removing the capability it guarded, not by satisfying it."
      rationale: "Sequencing, on this project's own rule: demand before spend.
        wtp_evidence is none, G1 has measured zero traffic, and no arms-length
        revenue exists anywhere in the portfolio — a $5-15k written opinion before
        one customer is the exact pattern the 2026-07-05 retrospective flagged. The
        2026-08-10 estate-gated-until-counsel rationale also still holds and now
        points further: with no estate customer to win, the cheapest correct move
        is not to offer estate at all. An opinion spanning 12 questions, 50 states
        and the CA divergence would also come back heavily qualified rather than
        as the crisp go/no-go the gate assumed."
      # 🔴 THE FINDING THAT MADE THIS A REAL DECISION RATHER THAN A FORMALITY.
      # The pre-release audit (2026-08-14) established that the estate gate was
      # holding a LABEL, not a mechanism:
      #
      #   - runHeartbeatSweep selects overdue owners and arms EVERY armed
      #     release_state for them (lib/release/heartbeat.ts) — there is no
      #     trigger_type filter.
      #   - Nothing auto-closes a `released` state. It closes only on owner
      #     check-in or stand-down.
      #
      # So an owner who dies stops checking in, goes overdue, their `emergency` or
      # `caregiver` trigger arms, verifiers confirm, access RELEASES — and stays
      # released, because the person who would reverse it is dead. That is an
      # estate handoff. It is "reversible" only in the sense that a dead man could
      # reverse it. Meanwhile src/app/terms/page.tsx states estate functionality
      # "is not offered".
      #
      # The exposure the opinion was meant to price is therefore ALREADY in the
      # shipping product, and refusing the `estate` trigger type never contained
      # it. Declining counsel is defensible; believing the gate was protecting
      # anything was not.
      supersedes: "ratified.estate-gated-until-counsel (2026-08-10), whose 'until'
        is now 'never'. That entry stays as the reasoning that got here."
      instead_of_an_opinion: "the question is made not to arise, which is cheaper
        and entirely in our control:
        (1) estate stays out of USER_SELECTABLE_TRIGGER_TYPES permanently, now
            enforced as a closed door rather than a pending one (lib/ops/gates.test.ts);
        (2) the Terms describe the mechanism actually operated, including that a
            release does not end on its own;
        (3) a recipient-side statement that Relay conveys the access an owner
            chose to share and confers no legal authority — the single highest-value
            mitigation available, and it costs an afternoon."
      residual_risk: "REAL, NAMED, AND ACCEPTED. Questions 4, 5, 7 and 11 of
        docs/g2-counsel-brief.md apply to the product as shipped, not to the gated
        feature, and go unanswered: Relay's exposure for facilitating a recipient's
        login to a third party whose ToS forbids credential sharing (CFAA and state
        analogs behind it); whether that analysis differs once the owner is dead —
        which the heartbeat finding above makes a live question rather than a
        hypothetical; whether N-of-M verifiers take on liability by attesting; and
        the B2B2C regulatory surface. There is also no analysed standard for a
        wrongful release or a wrongful failure to release, in either direction.
        Consequence accepted knowingly: the gate's own kill condition routed an
        adverse opinion to 'B2B2C through regulated partners', and that fallback
        closes too — a bank's diligence asks these same questions, and 'we did not
        look' is a worse answer than an adverse opinion."
      revisit: "ANY of: (a) the first B2B2C conversation with a bank, wealth
        manager or benefits provider — their diligence asks Q1/Q3/Q11 and counsel
        gets funded out of that opportunity; (b) the first arms-length inbound
        asking for estate/inheritance specifically; (c) G1 passing, at which point
        there is revenue to fund the opinion and a reason to want it. Until one of
        those, this stays closed and does not reappear at /daily-priority."
  # ⚠️ PROPOSED 2026-08-18 BY CLAUDE — NOT RATIFIED, NOT IN FORCE.
  #
  # Why it exists at all: the amendment at the top of this section ratified on
  # 2026-08-16 that G3 RUNS IN PARALLEL with G1 rather than after it. Two days
  # later `gates:` still held only G1 and the closed G2, and the whole B2B2C half
  # of the strategy lived in prose — a comment above, ratified.retire-paid-
  # advertising's `chain_change`, and g1-arms-length-demand's list of routes that
  # might produce the first person. Prose is not a schedule. This section's own
  # header says what that costs: 'A dead precondition does not stop work; it stops
  # work being SCHEDULED, silently, which is worse.' A ratified lane with no gate
  # is the same defect arrived at from the other direction, and the reassessment
  # of 2026-08-18 found it by reading this file against its own amendment.
  #
  # 🔴 EVERY NUMBER BELOW IS A DERIVATION FOR STEVE TO ACCEPT, CHANGE OR REJECT,
  # exactly as g1-arms-length-demand's date began before he confirmed it. Record
  # the ruling in place when it is made. Do not leave it standing as a draft: a
  # proposed gate nobody rules on is indistinguishable from the silence it was
  # written to end.
  - id: g3-b2b2c-pilot-loi
    status: "PROPOSED — awaiting Steve's ratification. Drafted 2026-08-18."
    metric: "signed pilot agreement or letter of intent from ONE distribution partner — a benefits
      broker, credit union, employer benefits provider or wealth manager — to put Relay in front of
      their members, employees or clients."
    target: "1"
    kill: "zero partner MEETINGS taken by the date below -> the B2B2C branch that G1's own kill
      condition routes to is closed as well, and the disposition becomes an explicit park-or-archive
      decision recorded here."
    owner: steve
    due: 2026-11-30
    leading_indicator: "meetings taken, logged as they happen. ⚠️ Note what the kill is measured on:
      MEETINGS, not LOIs. Whether an interested partner signs inside a window is their procurement
      calendar's answer, not evidence about Relay. Being unable to get a meeting at all IS evidence,
      and it is the finding this gate can honestly own."
    why_the_date: "DERIVED, NOT AGREED. It is the last date that still leaves the parallel claim
      true: G1's editorial instrument plausibly produces a first placement mid-October to mid-
      November (g1-arms-length-demand's own derivation), and a lane that only starts once that
      lands is sequential in everything but name. 11-30 sits before G1's 12-31 so the two verdicts
      arrive close enough to be read together. Move it with a `moved:` block and a reason, exactly
      as G1 was moved twice — never silently.
      ⚠️ The date binds the RECORD, not Steve. If this is still unratified on 2026-11-30,
      lib/ops/gates.test.ts fails the suite and forces the decision. That is the intended
      behaviour of proposing a gate rather than leaving the lane in prose."
    why_it_is_separate_from_g1: "ratified.retire-paid-advertising states it and it is worth
      restating where it can be acted on: op-eds are an EARNED AWARENESS channel and B2B2C is a
      DISTRIBUTION model. The first supplies the standing that gets the second a meeting. They are
      two measurements and reporting one as the other is how a gate stops meaning anything. A
      published byline is not a pilot; a pilot conversation that came from a byline still counts
      here, not there."
    inherits_from_g2: "G2 is CLOSED, NOT SATISFIED, and this gate starts from 'no legal opinion
      exists'. A regulated partner's diligence asks the questions the opinion would have answered
      (docs/g2-counsel-brief.md Q1, Q3, Q11), and 'we did not look' is a worse answer than an
      adverse opinion. This is not a reason to delay the conversation — g2's own `revisit:` trigger
      (a) is exactly this conversation happening, and counsel then gets funded out of a real
      opportunity rather than ahead of one. Go in knowing the questions are coming."
    what_does_not_count: "a friendly introductory call with no discussion of putting Relay in front
      of their people. An advisor, a mentor or an investor. A partner who wants the estate product,
      which was narrowed out permanently. And — the employer-anonymity rule applies with full force
      — nothing routed through the day job, in either direction.
      ⚠️ It also does not count toward g1-arms-length-demand. A partner signing a pilot is a
      DISTRIBUTION signal; that gate wants a PERSON who pays or says in writing they would. If a
      pilot later produces such a person, they count there, on their own evidence."
    first_targets: "OPEN — Steve's to name. Two specific organisations, not two categories: the
      dossier work on outlets showed that a named contact and a published route are what turn a
      plan into an action, and the same is true here."
    ratify_by: "2026-09-01, the date G1's own revisit begins, so both lanes come up in the same
      /daily-priority rather than one being remembered and the other not."
    revisit: "at every /daily-priority from 2026-09-01, alongside g1-arms-length-demand."

market:
  competitors_doc: docs/COMPETITORS.md   # authored 2026-07-01; PRICES RE-VERIFIED 2026-08-18
    # against each vendor's own pricing page, so the 60-day staleness clock restarts there.
    # Everplans holds at $99.99/yr (free tier is 3 items, not ~10) and is distributed via VSP at
    # $27/yr. The anchor that MOVED: Trustworthy is now tiered and its entry paid tier is
    # $10/mo billed annually = $120/yr — within a dollar of Relay's $119, so the nearest
    # competitor price is no longer $99.99. GoodTrust renews at $39/yr but has pivoted into
    # wills/trusts/directives, which g2-counsel-opinion withdrew Relay from permanently: a
    # different product, not a price floor.
  g1_instrument_verified: "2026-08-07 — all six funnel events observed on the wire against
    production, each carrying src attribution: caregiver_qualified, seed_started, seed_completed,
    reveal_viewed, price_viewed, intent_clicked. Two bugs were found and fixed by this check
    (props were being dropped by a wrong payload shape; the channel key was `channel` where the
    landing page uses `src`). Re-probe if the instrument is touched — a 200 response proves
    nothing about attribution."
  wtp_evidence: none                     # UNCHANGED and load-bearing. One purchase by the owner is
    # not arms-length demand, and caregiver_leads held ZERO rows as of 2026-08-09. G1 is still the
    # test; COMPETITORS.md implication: test at/above Everplans' $99/yr, lead with reversibility.

monetization_path: stripe_live_annual   # $119/yr, live-mode Stripe, charged end to end 2026-08-08.
# CORRECTED 2026-08-09. This field read `none` with the comment "there is NO payment processor and
# no money can be taken" for a day AFTER a real card was charged on relaystandby.com. That is the
# exact drift the claim-discipline rule exists to prevent, in the one file the rule names as the
# source of truth — so it is recorded here rather than quietly overwritten.
#
# What is actually true: checkout is live (src/app/api/stripe/checkout), the webhook reconciles
# subscription state, entitlements read the tier, and as of 2026-08-09 a subscriber can cancel
