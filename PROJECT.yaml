    risk_if_left: "Low, and stated rather than waved away. `auth_challenges` are single-use nonces
      that also expire. The three code tables hold HASHED codes whose owner_id no longer resolves,
      so redemption cannot complete — but they are the sharper ones, because a code is an
      access-granting artifact and 'cannot resolve' is a claim about today's code rather than a
      property of the data."
    # ⚠️ `ends_when` below said "The 38 rows" until 2026-08-28 — the exact count this entry's own
    # `what:` block bans, and the reason the entry was RENAMED off a count in the first place. The
