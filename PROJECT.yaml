  # ── OPENED 2026-08-20 by the deep production-readiness pass ───────────────
  #
  # Provenance, because it decides how much weight these carry: they came out of
  # a full re-analysis of the requirements, the live code and the live
  # infrastructure against one question this repo had not asked in those words —
  # what does a CUSTODIAN of other people's credentials owe the people already
  # inside? The 2026-08-16 readiness assessment answered a different one, well:
  # what a reader and an editor would see. Its verdict, 'nothing in the shipping
  # product is broken, half-built, or embarrassing', was true of that question
  # and is not evidence about this one.
  #
  # ⚠️ THEY LIVED IN ROADMAP.md AND NOWHERE ELSE FOR A DAY, which is the drift
  # this list exists to prevent: ROADMAP.md is SUBSIDIARY to this file, and a
  # debt item recorded only in a subsidiary document is one session away from
  # being lost. ROADMAP.md §8 recorded that weakness against itself; this is the
  # fix it named. (Was §7 before the rev-4 renumbering of 2026-08-27.)
  #
  # None of these is a feature. Each makes an EXISTING promise true, which is why
  # they are not held by the demand gate — that gate bars horizontal build, and
  # reading it as barring maintenance of a live system would make it a rule
  # against custody. ROADMAP.md §1 carries the test that separates the two.

  - id: signin-had-no-attempt-budget                          # "B1"
    owner: claude
    opened: 2026-08-20
    what: "Owner sign-in is an email address and a six-digit authenticator code and nothing else —
      there is no password. `authorize` did a DSQL lookup and a code comparison per attempt with no
      failure counter and no rate limit, so a stranger who knew an owner's address could walk the
      keyspace unattended. Three valid codes in a million against the skew window means a hit in a
      few hundred thousand attempts, and behind the door is an owner session, which unwraps that
      owner's items without step-up."
    why_it_matters: "Account takeover was vault compromise. Every OTHER guessable credential here
      already had a budget — recipient, verifier and recovery codes each carry MAX_FAILED_ATTEMPTS,
      /api/account/step-up calls rateLimit, and break-glass carries a written argument for why ~59
      bits needs neither. The six-digit code was the shortest secret in the product and the only one
      with no argument attached, which is what makes this an oversight rather than a decision."
    closed:
      date: 2026-08-20
      commit: e32e15b
      what_shipped: "lib/auth/signin-throttle.ts — a per-ADDRESS failure budget that counts failures
        only and RESETS on a correct code (the shape recipient-code.ts uses, not the shape of a rate
        limiter), plus a generous per-SOURCE attempt limit for the spray case the per-address budget
        is structurally blind to. Checked BEFORE resolveTotpSecret so a refused attempt costs no
        query. A refusal returns the same bare null as every other failure — answering 'too many
        attempts' would confirm that an address holds a Relay account."
      not_charged: "A DSQL lookup failure is OURS and must not spend the caller's budget; charging
        for it would turn a database blip into a lockout of every owner who tried during it."
      proof: "32 new tests; all three claims of the sibling guard proven by planting the defect —
        gate call removed (3 red), guess-watch call removed (2 red), recordSigninFailure added to the
        lookup-failure catch (2 red). Gate exit 0."
      what_it_does_not_do: "Both counters are per-instance memory, so a distributed attempt is
        under-counted — lib/http/rate-limit.ts says so in its own header and it is still true. This
        raises the floor from NOTHING to the control the step-up route already had. The durable
        per-account budget needs a row, therefore a migration, therefore Steve: see
        `signin-budget-is-not-durable` below."
    durable_half:
      date: 2026-08-20
      status: "WRITTEN AND WAITING ON A MIGRATION — not live, and not claimed as live."
      what_shipped: "db/migrations/036_signin_attempts.sql (authored, NOT applied) and
        lib/auth/signin-attempts.ts, composed inside signin-throttle.ts so the two layers are one
        choke point and callers never learn where a count is kept."
      the_property_that_matters: "It refuses only on a NUMBER. `null` from the store means it could
        not answer — no migration, unreachable cluster, timed-out query — and that is NOT zero.
        Treating null as a refusal would hand any DSQL blip the power to lock out every owner at
        once, which is the failure this control must never cause. Memory stays the floor, is checked
        FIRST, and is never removed by an unreachable database."
      deploy_order_is_not_a_hazard_this_time: "Migration 029 THREW when its table was absent and
        took passkey sign-in down for four minutes. This detects a missing relation (42P01) once,
        logs one line, latches, and falls back to memory — so the code is safe to deploy before the
        migration and simply does not engage until it lands."
      the_address_is_never_stored: "email_key is SHA-256 of the normalised address. The table must
        count failures against addresses that have NO account — refusing to would tell an attacker
        which addresses are real — so in plaintext it would slowly become a list of everyone anybody
        ever tried, including typos of real people's addresses. Hashing costs nothing: counting is
        identical and an investigation can still hash a SUSPECTED address and search for it."
      steve_must_run: "npx tsx --env-file=.env.admin db/migrations/migrate.ts
        036_signin_attempts.sql — BOTH regions (the second by naming DSQL_PRIMARY_ENDPOINT with the
        secondary's value; migrate.ts does not honour DSQL_USE_SECONDARY), then npm run
        verify:schema. ⚠️ verify:schema derives what it expects from the migration files, so it will
        report signin_attempts MISSING from the moment this lands until it is applied. That is the
        check working, not a defect."
      applied:
        date: 2026-08-20
        status: "✅ APPLIED TO BOTH REGIONS AND LIVE-PROVEN. The durable half is no longer 'written
          and waiting'."
        preconditions_checked_first: "AWS Backup fresh in both regions before any DDL — us-east-1
          newest 0.3h old, us-west-2 newest 0.1h old, deletion protection ON for both clusters
          (scripts/backup-status.mjs). The 5-gate infrastructure policy, satisfied rather than
          assumed: documented problem, <10min rollback (DROP TABLE), snapshot verified BEFORE,
          isolated test (the code tolerates the table's absence), explicit request."
        proof: "verify:schema ✓ 26/26 tables and 33/33 columns in BOTH regions, where it had
          reported signin_attempts ABSENT in both an hour earlier. verify:roles ✓ 'the split is
          intact' in both regions against 26 declared tables — which is the check that migration
          031's trap did NOT recur: ALTER DEFAULT PRIVILEGES (032/033) did grant relay_app DML on a
          table created afterwards, as 036's header claimed and did not assume."
        happy_path_live_proven: "The unit suite could only ever reach the missing-table and error
          branches. A probe against the production cluster exercised the rest: a clean address
          counts 0 (not null), three failures count 3, the window predicate both includes and
          EXPIRES them, another address is unaffected, a clear removes every row, and housekeeping
          runs. Zero rows left behind afterwards (census: 0)."
        proven_in_production_after_deploy: "The chain end to end, against relaystandby.com after the
          merge: a failed sign-in for an address with NO account answered HTTP 401, minted no
          session, and left exactly ONE row in signin_attempts — written by the DEPLOYED runtime
          connecting as relay_app, which no earlier check covered. verify:roles proved the GRANT
          exists; this proves production uses it. Row deleted afterwards; zero remain.
          ⚠️ THE FIRST ATTEMPT REPORTED A FALSE FAILURE and it was the probe, not the product: it
          POSTed to /api/auth/callback/credentials when the provider id is `email-totp`, so NextAuth
          answered 400 before `authorize` ever ran and no row could have been written. Reported as
          'production did not record the failed sign-in' for about a minute. A probe that cannot
          reach the code it is testing produces a confident wrong answer — the reference to copy was
          scripts/e2e-stepup.ts, which posts to the provider id and keeps a cookie jar."
        # 🔴 AND THE PROBE DISAGREED WITH AN EXPECTATION, WHICH IS WHY IT WAS WORTH RUNNING.
        the_contract_nobody_had_written_down: "It asked for a 1ms window and got back the three rows
          it expected to be excluded. `make_interval` takes SECONDS, so windowMs is ceiled — 1ms
          becomes 1s. The CODE was right and the EXPECTATION was wrong, but nothing said so, and a
          contract nobody writes down is one the next caller discovers the same way. Rounding UP is
          deliberate: a wider window counts MORE failures, so the error falls on the side of
          refusing an attacker, and rounding down could produce a zero-length window that silently
          disables the budget while looking healthy. Now documented on the function and pinned by
          two tests (1ms -> 1s, 1500ms -> 2s, and 15min -> exactly 900s)."


  - id: the-guess-watch-did-not-cover-the-front-door          # "B2"
    owner: claude
    opened: 2026-08-20
    what: "lib/ops/guess-watch.ts exists because 'a guess at a code that does not exist left no trace
      at all'. Its GuessKind union was recipient | verifier | invitation | recovery. The sign-in path
      was absent, so a walk through the authenticator keyspace was not only unlimited, it was
      unobserved."
    why_it_matters: "A limiter without an alarm hides the attack it deflects — the attacker slows to
      fit the budget and nobody ever learns they were there. The credential most worth guessing was
      the one kind a guess against which was never counted."
    closed:
      date: 2026-08-20
      commit: e32e15b
      what_shipped: "The `totp` kind, recorded in the same branch that spends the budget, and
        `severityParagraph()`."
      the_copy_would_have_lied: "The alert closed with an unconditional 'Nothing is currently at risk
        from guessing alone (the short codes carry 2^39.6, recovery codes 2^49.5), so this is a
        prompt to look, not an incident.' True of four long codes and false of six digits. An alert
        that reassures the reader at exactly the moment the arithmetic stops being comfortable is the
        alert doing the attacker's work. Both branches are now asserted by content."

  - id: the-failover-does-not-carry-the-ability-to-decrypt    # "B3"
    owner: claude
    opened: 2026-08-20
    what: "lib/kms/kms-client.ts builds one KMSClient from AWS_REGION (default us-east-1) against one
      CMK. lib/db/connection.ts keeps primary and secondary pools and DSQL_USE_SECONDARY fails the
      DATABASE over to us-west-2. The crypto path does not move with it, so a us-east-1 KMS
      impairment makes every vault unreadable from BOTH regions."
    why_it_matters: "CLAUDE.md's failover invariant reads as though the env switch is sufficient. It
      is sufficient for the data and not for the key, and nobody discovers that on a calm afternoon."
    ends_when: "the limitation is written where a person mid-failover meets it, AND Steve rules on
      the multi-Region-key proposal. ⚠️ The FIX is an infrastructure change to a working system —
      5-gate policy, snapshot, rollback, explicit request. Writing it down is in scope; taking it is
      not."
    half_closed:
      date: 2026-08-20
      what_shipped: "The writing-down half. CLAUDE.md's failover invariant now states that the env
        switch moves the data path and not the crypto path, and docs/backup-restore-runbook.md
        carries it as its own section plus a sixth restore step — unwrap ONE item before calling a
        restore done, because a restored cluster is ciphertext and the key is in no recovery point
        in any vault here. The proposal Steve rules on is docs/kms-region-proposal.md."
      still_open: "the RULING. Recommendation on the proposal is Option A — accept it until the
        first arms-length customer, then re-argue under the 5-gate policy — on this project's own
        sequencing rule rather than on a technical judgement. ⚠️ An accepted risk with no recorded
        acceptance is just an unknown risk, so the entry stays open until Steve answers."
    closed:
      date: 2026-08-20
      by: steve
      # Both halves of `ends_when` are met: the limitation is written where a
      # person meets it, and the proposal is ruled. What remains is an ACCEPTED
      # risk with a recorded acceptance and a reopen trigger — which is the
      # opposite of an open item, and the reason this closes rather than lingers.
      decision: "OPTION A — keep the single-Region CMK. The exposure is accepted knowingly, in
        writing, rather than by omission."
      what_is_accepted: "During a us-east-1 KMS impairment, Relay cannot open anybody's vault, from
        either region. It is an AVAILABILITY problem and not a durability one — nothing is lost and
        nothing is exposed, and reveals resume when the Region does. What makes the acceptance
        honest rather than lazy is that the limitation is now written where a person meets it
        (CLAUDE.md's failover invariant, docs/backup-restore-runbook.md's own section and its sixth
        restore step) and the customer-facing answer is prepared."
      reopens_when: "the first arms-length customer — then re-argue Option B under the 5-gate policy
        with docs/kms-region-proposal.md's ordering, which is not negotiable. Also on a partner's
        diligence (they will ask) or the first time a Region actually wobbles."
      why_not_now: "This project's own sequencing rule rather than a technical judgement.
        demand_signal is none; the mitigation's real cost is not the dollar a month, it is a
        permanent two-key decrypt path in the most dangerous code in the repository, taken before a
        single stranger has stored anything in it. The same logic declined counsel."
      verified_live_the_same_day: "npm run verify:kms now RUNS, and prints the single-Region note on
        every pass — so the accepted limitation is re-stated to whoever runs the wall check rather
        than living only in a proposal nobody reopens."

      the_deceptive_part: "It is an AVAILABILITY problem, not a durability one — nothing is lost and
        nothing is exposed. What makes it worth a runbook section is the shape of the day: the site
        is up, pages render, the vault list loads, and Reveal is the only thing that fails. Somebody
        flipping the switch under pressure concludes the failover worked."

  - id: nothing-watches-the-key                               # "B4"
    owner: claude
    opened: 2026-08-20
    what: "Ciphertext without the CMK is unrecoverable. A deleted key, a scheduled deletion, or a key
      policy edited to drop the runtime principal destroys every vault permanently — and none of it
      appears in a diff, a test run or a build."
    why_it_matters: "This is exactly the class verify:roles and verify:iam were built for, one layer
      down: two walls have re-measuring probes and the one UNDERNEATH them had none.
      docs/backup-restore-runbook.md covers the database, and a restored cluster is ciphertext
      without the key that opens it."
    ends_when: "a read-only verify:kms exists in the shape of verify:iam, is wired into the
      pre-release list, and has been seen to FAIL against a planted change — a wall-checker that has
      only ever passed has not been seen to work."
    closed:
      date: 2026-08-20
      what_shipped: "lib/ops/kms-wall.ts + scripts/verify-kms.ts (sprint 1, df38d32), and on
        2026-08-20 it was RUN — the `ends_when` above is satisfied in full rather than in part."
      first_live_run: "✓ CMK b3af288c… in us-east-1: Enabled, CUSTOMER-managed, SYMMETRIC_DEFAULT,
        not pending deletion, and its key policy still lets arn:…:user/relay-runtime GenerateDataKey
        and Decrypt. The runtime principal ARN was derived correctly from the key's own ARN rather
        than configured."
      rotation_intent_was_right: "ROTATION_INTENDED = false was a DERIVATION from how
        docs/aws-setup.md creates the key, recorded as the as-provisioned state rather than a
        recommendation. The live key reports rotation OFF, so the pin matches reality and a silent
        change in either direction is now catchable."
      # 🔴 THE HALF THAT MATTERS: it has been seen to FAIL.
      negative_controls: "THREE, all exit 1. (1) a key id that does not exist -> NotFoundException,
        reported as a finding rather than a crash. (2) KMS_KEY_ID unset -> refused before any AWS
        call. (3) alias/aws/s3 — a key that REALLY EXISTS and is not ours -> the policy rule fires
        (`the key policy could not be read`), which proves the refusal is about the key's state and
        not merely about absence. A wall checker seen only to pass has not been seen to work."
      single_region_note_fires: "The B3 note printed on the live run exactly as designed —
        'single-Region CMK: DSQL fails over between regions and this key does not move with it' — as
        a NOTE, not a failure, because the fix is an infrastructure decision and a check that fails
        on a knowingly-accepted limitation is a check somebody disables."
      # 🔴 THE CLOSURE ABOVE WAS TRUE AND THE MONITOR DID NOT EXIST, corrected 2026-08-24.
      scheduled_2026_08_24: >-
        THIS ENTRY WAS CLOSED FOR FOUR DAYS ON A CHECK THAT NOTHING RAN. Every claim in the block
        above is accurate and the `ends_when` was met as written — "wired into the pre-release list"
        is a list a person reads. But scripts/verify-kms.ts describes ITSELF as "a scheduled
        re-measurement rather than a note asking somebody to look", and it was the note. Measured
        2026-08-24 against .github/workflows/: verify:kms appeared in NONE of the six. It ran when a
        person typed it on the one laptop holding .env.admin.
        The cost was not hypothetical. ratified.relay-parked-60-days-2026-08-22 listed the KMS wall
        watch among the custodial monitors "still running and still expected to page", and
        ratified.relay-resumed-2026-08-21 — the LIVE entry — asserts it "ran throughout" and holds
        that arrangement up as "the template for the next one". Both sentences were false, and they
        were written into the record BY the closure above. An ends_when weaker than the thing's own
        stated design is how a decorative guard gets counted as protection in the exact review that
        should have caught it.
        NOW REALLY SCHEDULED: .github/workflows/kms-wall.yml, daily, merged in ce776ef. GitHub OIDC
        to IAM role relay-kms-wall-ci — no stored secret; trust pinned to
        repo:sgharlow/relay:ref:refs/heads/master because this repo is PUBLIC; permissions are
        DescribeKey + GetKeyPolicy + GetKeyRotationStatus on the one CMK and nothing else, so it
        cannot Decrypt. Daily because AWS's minimum key-deletion waiting period is 7 days, so a
        daily check sees a scheduled deletion at least six times before it is irreversible. Proven
        BOTH ways on the day: green against the real key, and exit 1 against a dispatched bogus key
        id via the workflow_dispatch key_id input, which exists so the alarm can be proven red
        without a commit.
        WARNING - it inherits the trap all five scheduled workflows share: GitHub disables scheduled
        workflows in a public repository after 60 days with no repository activity, so this watchdog
        has the same failure mode as the thing it watches - a quiet owner.


  - id: tenant-separation-at-the-kms-boundary-is-not-cryptographic   # "B5"
    owner: claude
    opened: 2026-08-20
    what: "generateDataKey and decryptDataKey pass no EncryptionContext, and DecryptCommand names no
      KeyId, so any blob wrapped under the CMK unwraps for any caller the APPLICATION lets through."
    why_it_matters: "The application-layer hole this permitted was found and closed on 2026-08-13 —
      the route header in /api/kms/unwrap tells the story: a body-supplied wrapped_data_key was a
      cross-tenant oracle. The fix was correct and the structure that allowed it is unchanged. The
      portfolio rule is structural safety over convention: make the cross-tenant unwrap impossible AT
      KMS rather than refused by a check somebody has to keep writing."
    ruled:
      date: 2026-08-20
      by: steve
      decision: "DEFER THE BUILD. B5 stays OPEN deliberately — the design is finished and the code
        is not written."
      what_is_done: "docs/encryption-context-design.md (the compatibility rule, the call sites, and
        the fallback implementation that must NOT be built) and docs/encryption-context-rollout.md
        (three deploys, and the point of no return being the first row WRITTEN with a context).
        Migration 037 is authored AND APPLIED to both regions — a nullable column nothing reads."
      why_defer: "The exploit this addresses was closed at the application layer on 2026-08-13; what
        remains is structural rather than exploitable. demand_signal is none, and this is the one
        path where being wrong is unrecoverable — it needs live proof at each of three deploys. The
        design costs nothing to sit on. Same 'spend when there is a customer' logic that ruled B3
        Option A and declined counsel."
      reopens_when: "a customer exists, a partner's diligence asks how tenants are separated, or
        anything changes on the wrap/unwrap path — a change there without this design in hand is how
        the fallback shape gets built by accident."
      ⚠️_the_allow_list_entry_is_now_load_bearing: "vault_items.kms_context_era is applied and
        referenced by nothing, allow-listed in lib/ops/schema-columns-are-used.test.ts with its own
        removal condition. That entry is the only thing recording that the column is waiting rather
        than abandoned."
    ends_when: "new wraps are bound to a context and legacy blobs are PROVEN to decrypt forever.
      ⚠️ Compatibility is the whole risk: every key wrapped before the change has no context and can
      never be rewritten, because the server cannot read plaintext — the same permanent-legacy rule
      lib/crypto/secret-payload.ts already lives under. It needs a per-row marker, therefore a
      migration, therefore Steve, and it cannot be live-proven in a credential-less worktree. Design
      first: docs/backlog.md Sprint 4."

  - id: the-in-app-alarm-shares-fate-with-product-email       # "B6"
    owner: claude
    opened: 2026-08-20
    what: "lib/ops/error-reporter.ts and lib/ops/incident.ts alert through sendEmailBestEffort —
      Resend, the same provider whose Outlook deliverability is an open ticket and whose DMARC
      posture is still p=none."
    why_it_matters: "If Resend is degraded, or the alert lands in a junk folder, 500s stop being
      reported and the silence reads as health. The GitHub-hosted monitors do NOT share this fate —
      scheduler-monitor.yml and delivery-webhook-monitor.yml both exist because 'a watchdog must be
      able to outlive the thing it watches', and an in-app alerter that can only speak through the
      product's own mail provider is that same mistake one layer up."
    ends_when: "either the in-app alerts are readable by the independent monitor, or it is RULED that
      the GitHub monitors are the alarm of record and error-reporter.ts says so itself. Either is
      fine; the current state is neither."
    closed:
      date: 2026-08-20
      ruling: "THE GITHUB-HOSTED MONITORS ARE THE ALARM OF RECORD; every in-app email is ADVISORY.
        scheduler-monitor.yml, delivery-webhook-monitor.yml and production-canary.yml run
        off-platform and share fate with neither Vercel nor Resend. Written into
        lib/ops/error-reporter.ts and lib/ops/incident.ts, which are the two files that were making
        the implicit claim."
      why_this_branch_and_not_the_other: "The case that looks worst for the in-app alerter — Resend
        degraded — is ALREADY covered by an independent path, because a Resend outage stops the
        delivery webhook and that monitor reports it through GitHub. The two ways of making the
        alerter itself independent both fail on their own terms: persisting alerts for a monitor to
        poll puts the alarm behind DSQL, so it could not report a DSQL outage — the same
        fate-sharing moved rather than removed, and it needs a migration; and calling GitHub from
        the request path adds an outbound dependency and a second secret to an error handler whose
        first rule is that it must never throw."
      # 🔴 THE HALF THAT WAS A REAL DEFECT RATHER THAN A CLASSIFICATION.
      the_boolean_was_on_the_floor: "sendEmailBestEffort RETURNS false when the provider refuses,
        and error-reporter.ts discarded it. So a 500 during a Resend outage was silent twice — the
        incident, and the fact that its alert had been lost. Losing an alert is not worse than never
        having one; losing it SILENTLY is, because the quiet reads as health. It now writes one
        distinctly-marked line (`ALERT NOT DELIVERED`) so an operator reading back after an outage
        can tell 'composed and lost' from 'nothing happened'."
      guard: "lib/ops/alarm-of-record.test.ts — the three monitors exist, each runs on a schedule,
        each runs on GitHub, both alerters carry the ruling and name the monitors, and the delivery
        result is read rather than dropped. Proven by planting BOTH failures: removing the delivery
        result (1 red) and deleting a monitor file (3 red). ⚠️ It is a COVERAGE check, not a
        liveness check — it reads workflow files and cannot know whether GitHub ran them. What it
        prevents is a monitor removed in a tidy-up while three files still cite it as the reason
        their own alerting may be advisory."

  - id: no-incident-or-breach-runbook                         # "B7"
    owner: claude
    opened: 2026-08-20
    what: "docs/ holds a backup/restore runbook, an email-DNS runbook and a submission runbook. For a
      product holding other people's credentials there is no written answer to what is done first,
      what is preserved, who is told, and by when."
    why_it_matters: "Cheap now, unwritable at 3am. State breach-notification law binds an individual
      operator exactly as it binds a company, and the operator ruling means the person who makes each
      call is a real person rather than a role that does not exist."
    ends_when: "one page exists covering containment order (session-epoch revocation first — the
      mechanism already exists), evidence preservation (the audit chain is append-only and
      hash-chained; it must not be touched), and notification. It must also state what Relay CANNOT
      disclose because it cannot read it, which is the one genuinely good piece of news in a breach."
    closed:
      date: 2026-08-20
      what_shipped: "docs/security-incident-runbook.md — evidence first (verify the chain and record
        the result BEFORE touching anything, because a break found at the start is evidence and a
        break found later is a question about what you did), then containment in order, then scope
        in writing, then notification, then the write-up."
      named_security-incident_not_incident-response: "deliberate. `incident` already means two other
        things here — /api/audit/incidents is a CUSTOMER-FACING feature ('what happened while you
        were away') and /api/incident is a client-side error beacon. The runbook opens by naming all
        three, because confusing them mid-event would be expensive."
      # 🔴 TWO THINGS THE WRITING ESTABLISHED BY CHECKING RATHER THAN ASSUMING.
      the_zero_knowledge_claim_has_an_exception: "`users.totp_secret` is plaintext TEXT on the users
        table (migration 003) and is NOT wrapped by the CMK. So a database compromise reaches owner
        authenticator seeds even though it reaches no vault contents. Any notice that says 'we
        cannot read your data' without saying that is a notice that misleads — and it is the
        sentence that would be quoted back. Also exposed and worth naming plainly: item TITLES,
        which are metadata by our definition and personal by any reader's."
      there_is_no_bulk_session_revocation: "`bumpSessionEpoch` is per user and is called from exactly
        ONE place (/api/auth/recover). Signing everybody out means rotating NEXTAUTH_SECRET, which
        is a global outage as well as a containment — including for people mid-crisis. The runbook
        says so rather than leaving somebody to discover it at 3am. A bulk path is not proposed
        here: it is a real capability with a real blast radius and it deserves its own decision."
      what_it_deliberately_omits: "severity tiers, an on-call rotation, an escalation matrix. There
        is one operator and no rota (ratified.relay-operator-is-an-individual); inventing that
        ceremony would produce a document that reads as though somebody else is coming."

  - id: no-secret-rotation-runbook                            # "B8"
    owner: claude
    opened: 2026-08-20
    what: "NEXTAUTH_SECRET, RECIPIENT_JWT_SECRET, VERIFIER_JWT_SECRET, CRON_SECRET, RESEND_API_KEY,
      RESEND_WEBHOOK_SECRET, the Stripe keys and a long-lived AWS access key pair all sit in Vercel
      with no recorded age, no procedure and no owner. Nothing in docs/ rotates anything."
    why_it_matters: "This is the operational half of the arc docs/least-privilege-cutover.md closed on
      identity. Two of these are not merely inconvenient: rotating either JWT secret invalidates every
      live link, which during an open release means a verifier clicking a valid link gets an error at
      the moment a family is waiting. Nobody should be discovering that mid-incident, and
      no-incident-or-breach-runbook above points at this file for its rotation step."
    ends_when: "a page exists with, per secret: what it protects, blast radius, safe order, what
      breaks mid-flight, how to verify after, and a last-set date — where 'unknown' is a finding
      rather than a blank."
    closed:
      date: 2026-08-20
      what_shipped: "docs/secret-rotation-runbook.md — twelve secrets, a table with a Last set
        column that currently reads `unknown` throughout (written out rather than left blank,
        because 'how old is this?' being unanswerable IS the finding), and a section for each one
        that is not routine. Cross-linked from docs/security-incident-runbook.md §1 — the situation
        it exists for — and from .env.example beside the first secret."
      the_rule_that_outranks_the_table: "Rotating a secret here is never only a credential change.
        Every one of them is signing or authenticating something IN FLIGHT, and for two of them that
        in-flight thing is a family in an emergency. There is no secret in this product whose
        rotation is free, and the cost is not proportional to how alarming the name sounds."
      # 🔴 THREE THINGS THE WRITING ESTABLISHED BY READING THE CODE.
      nextauth_secret_signs_more_than_sessions: "It also signs step-up elevation, WebAuthn
        challenges and recovery enrolment. The 24h session is the cost; the other three are minutes
        long and merely fail an in-flight ceremony. ⚠️ AND THERE ARE TWO NAMES: auth-options.ts
        reads NEXTAUTH_SECRET ?? AUTH_SECRET while step-up.ts, webauthn.ts and recovery-enrolment.ts
        read only the first — so setting AUTH_SECRET alone leaves sessions verifying while step-up
        and passkeys throw."
      the_aws_keys_are_read_by_nothing: "No application code references AWS_SECRET_ACCESS_KEY; the
        SDK picks it up from the environment. Grepping finds nothing and it is easy to conclude they
        are unused. They authenticate DSQL token minting AND KMS — the whole product — and they are
        also the one rotation here that can be made seamless, by having two access keys valid at
        once. Deactivate the old key, delete it later."
      dsql_password_should_be_empty: "Found by the coverage check rather than by writing: it is a
        manual override holding a short-lived IAM token, and the code mints its own when it is
        absent. A VALUE in it is the finding — somebody worked around an auth failure by pasting a
        token instead of fixing the identity."
      guard: "lib/ops/secrets-have-a-rotation-procedure.test.ts derives the obligation from
        .env.example: every secret-shaped variable must appear in the runbook, so adding a secret
        without a procedure fails. Proven by planting a TWILIO_API_KEY entry. It also asserts the
        guard is not vacuous (a broken regex matching nothing would pass).
        ⚠️ IT TRIPPED OVER THE WRAPPED-PHRASE TRAP ON ITS FIRST RUN — an assertion went red against
        a runbook that said exactly what it looked for, because the phrase spanned a line break.
        That is gates.g3.dossier's recorded failure in a new place; it failed loudly here only
        because the phrase was expected to be PRESENT, and an absence check written the same way
        would have passed on a document that said the forbidden thing. Every multi-word match in
        that file now tolerates wrapping."

  - id: stripe-is-missing-from-the-subprocessor-list          # "B9"
    owner: claude
    opened: 2026-08-20
    what: "src/app/privacy/page.tsx lists AWS, Vercel, OpenAI and Resend under 'Who else is involved'
      and omits Stripe, which processes the payment details of every paying customer. Live-mode
      Stripe has been charging since 2026-08-08."
    why_it_matters: "Same class as the og:description that still sold estate after estate was
      withdrawn: a factual defect on a page whose entire value is that it is accurate."
    ends_when: "Stripe is named AND the list is pinned to the set of providers the codebase actually
      talks to — a hardcoded four-item assertion would pass the day a fifth arrives."
    closed:
      date: 2026-08-20
      what_shipped: "Stripe named on /privacy with what it receives and what it does not (card
        details go to Stripe directly and never reach our servers). Pinned by
        lib/ops/subprocessors-are-listed.test.ts, which derives the obligation from package.json:
        EVERY runtime dependency is either a service that receives customer data and must be named
        on the page, or is classified as in-process WITH A REASON. Adding any dependency forces
        that decision — the same shape as body-limit's ALLOWED_RAW."
      # 🔴 A SECOND DEFECT ON THE SAME PAGE, found by checking it against the CODE.
      the_authenticator_seed_was_undisclosed: "The 'what we can read' list did not mention that
        `users.totp_secret` is stored in readable form (plaintext TEXT, migration 003, not wrapped
        by the CMK), while the section above it said 'neither can anyone who obtains our database'.
        True of vault CONTENTS and materially incomplete as a whole: somebody holding the database
        could not read one vault item and COULD generate the owner's sign-in codes. Now listed, with
        a paragraph saying exactly that — and fixed loudly rather than silently, because it was
        outside this item's stated scope."
      # 🔴 AND THE GUARD PASSED ITS OWN PLANT ON THE FIRST TRY.
      nearly_the_fourth: "The first version asserted `section.toContain('Stripe')`. The plant renamed
        `<strong>Stripe</strong>` to `<strong>NotStripe</strong>` — which still CONTAINS 'Stripe',
        so the check stayed GREEN on a page that no longer named the processor. A substring match on
        a company name checks that those letters appear somewhere, not that the company is listed.
        This repo has three recorded cases of a guard passing on the very defect it was written for;
        this was nearly a fourth, and it was caught only because the plant was RUN rather than
        assumed. Now matched as a list entry, and the negative case is asserted in the test itself."

  - id: support-has-an-address-and-no-commitment              # "C6"
    owner: steve
    opened: 2026-08-20
    what: "hello@relaystandby.com is offered on the acute paths — the access screen tells a recipient
      whose reveal failed to write in 'so a person can look' — with no stated response time and no
      defined monitoring."
    why_it_matters: "A promise of a human, made to someone in an emergency, is either kept or it
      should not be on that screen."
    ends_when: "Steve decides a response commitment and who watches the inbox, and the acute-path copy
      is made to match it. This is a decision, not a build — which is why the owner is not claude."
    closed:
      date: 2026-08-20
      ruled_by: steve
      decision: "WITHIN ONE BUSINESS DAY, stated."
      why_that_number: "Honest for a solo operator on his worst week rather than flattering on his
        best. A commitment that is only true when nothing else is happening is the one that breaks
        on the day it matters."
      what_shipped: "SUPPORT_RESPONSE_TIME in lib/contact.ts — one definition, beside OPERATOR_NAME
        and CONTACT_EMAIL — consumed by /about and the support form. /about adds that an actively
        failing release should say so in the subject line and goes to the top."
      the_acute_copy_did_not_change: "deliberately. AccessClient's 'tell us … so a person can look'
        was IMPLYING a commitment; stating one makes that sentence true as written rather than
        needing it softened."
      guard: "lib/ops/support-commitment.test.ts. ⚠️ What it guards is the COUPLING, not the
        wording: the failure mode is not somebody deleting the sentence, it is a SECOND surface
        stating a different number until a customer quotes the wrong one back. It sweeps every .tsx
        under src/app for a rival response time and fails naming the file. Proven by planting 'we
        usually reply within a few hours' on the support form.
        🔴 And its first version was BACKWARDS — it required /about to contain the literal address,
        which would have gone green only on a page that HARDCODED it, the opposite of the rule this
        very file enforces. Assert the reference, not the value."


  - id: relays-own-continuity-is-unstated                     # "C7"
    owner: claude
    opened: 2026-08-20
    what: "The product's entire subject is what happens when the person holding everything cannot act.
      Relay is operated by one individual (ratified.relay-operator-is-an-individual) and says nothing
      about what becomes of a customer's vault if THAT individual is the one who stops."
    why_it_matters: "It is the first question a cautious reader asks of a one-person custodian, and
      the answer is good: self-serve export already exists, and the encryption means the operator was
      never able to read anything. This is a statement to write, not a system to build — the most
      on-brand trust copy available and it costs an afternoon."
    ends_when: "/about and /terms answer it plainly, WITHOUT promising an escrow or a wind-down period
      that does not exist, and the sentence is pinned the way operator-named.test.ts pins the
      operator."
    closed:
      date: 2026-08-20
      what_shipped: "/about gains 'What happens to Relay if something happens to me' and /terms
        carries the contractual half. Three answers: the service stopping means NOBODY is released
        to — 'a stopped service cannot release anything to anyone', which is the sharpest
        consequence and the one a reassuring rewrite would drop; the CONTENT is not at risk because
        vault items are encrypted in the owner's browser; and the remedy is the existing self-serve
        export, which needs nothing from the operator and produces a copy that outlives Relay."
      scoped_deliberately: "The 'cannot read' claim is scoped to CONTENT rather than written as 'I
        can never read anything'. /privacy now discloses that the owner's own sign-in authenticator
        secret IS stored readably (B9), and an unqualified claim here would contradict the page next
        door. Two pages, one answer."
      what_it_refuses_to_say: "No successor, no escrow, no trustee, no indefinite preservation. Those
        are the four comforting sentences available and none of them is true. The wind-down notice
        is marked as an INTENTION rather than a guarantee, because a guarantee would need somebody
        other than the operator to enforce it and there is nobody."
      guard: "lib/ops/operator-continuity.test.ts pins the three answers AND the four refusals.
        Proven by planting both directions: softening 'a stopped service cannot release anything to
        anyone' into 'your plan would be safe with us' (1 red), and adding an escrow promise (2
        red). type-scale and raw-color stayed green — the new copy uses tokens only."

  - id: the-rate-limiters-justification-cites-a-cancelled-flight    # "D6"
    owner: claude
    opened: 2026-08-20
    what: "lib/http/rate-limit.ts is per-instance memory and says so. Its stated argument for staying
      that way is that a shared store is not worth adding 'for a $250 ad test' — and that flight was
      cancelled (ratified.g1-google-lane-cancelled)."
    why_it_matters: "The reasoning now rests on a premise that no longer exists, while the endpoints it
      guards include ones that cost money (/api/ai/intake reaches OpenAI, /api/stripe/checkout reaches
      Stripe) and one that is now an authentication control (signin-had-no-attempt-budget above).
      Leaving a justification that cites a cancelled ad flight is the drift this repo keeps catching."
    ends_when: "the stance is re-derived against the world that exists, the header is corrected, and a
      recommendation with a cost reaches Steve. ⚠️ A shared store is infrastructure: proposing is in
      scope, adding it is not."
    closed:
      date: 2026-08-20
      what_shipped: "docs/rate-limit-stance-2026-08-20.md — the re-derivation, both tables of call
        sites, three costed options, and a recommendation. The header in lib/http/rate-limit.ts now
        QUOTES the dead justification rather than deleting it, and points at the doc."
      # 🔑 THE FINDING THAT DECIDED IT, and it was not about cost.
      the_pattern_already_exists: "This codebase has solved durable metering THREE times with
        storage it already owns, and none of them bought a shared store: invite-budget.ts counts
        audit_log rows per owner per day; signin-attempts.ts is an append-only table with a window
        predicate (036); recipient-code/verifier-code carry failed_attempts on the code's own row.
        So the choice was never 'memory or new infrastructure' — it is 'memory, or the pattern
        already here, applied to the endpoints that earn it'. And the case that was always
        strongest for a shared store — authentication — was answered without one on 2026-08-20."
      recommendation: "OPTION A: leave it, extend the existing durable pattern endpoint-by-endpoint
        on evidence. Option B (durable counters on caregivers/interest and auth/signup) when the
        first stranger arrives — with its own objection recorded, that a per-IP durable counter
        makes the database do work for whoever is hammering it, which invite-budget avoids by being
        per-OWNER. Option C (Upstash Redis) recorded as recommended AGAINST so it is not
        re-proposed as the obvious answer."
      # ⚠️ TWO PREMISES IN THE ITEM ITSELF WERE WRONG, corrected rather than dropped.
      corrections_to_this_entry: "(1) It named /api/ai/intake and /api/stripe/checkout as 'paid
        third-party calls behind PUBLIC endpoints'. Both are AUTHENTICATED and key per owner — a
        burst bound on somebody already signed in, not a boundary against the public. The genuinely
        public money-spending endpoints are the ones that send EMAIL. (2) 'real users, free standby
        accounts' as a reason the exposure grew: demand_signal is still none, so that is an argument
        for readiness rather than for spend."
      guard: "lib/ops/rate-limit-stance.test.ts derives the endpoint list from the code — every
        route calling rateLimit() must appear in the doc. ⚠️ IT FAILED ON ITS OWN DOCUMENT
        IMMEDIATELY: the first draft tabulated the nine PUBLIC endpoints and left six authenticated
        ones in prose, so a doc claiming to be exhaustive understated the surface by six. Second
        table added. Proven again by planting a new rate-limited route."
      also_recorded: "/api/auth/signup's 10/hour ceiling is ALSO the release gate's ceiling — one
        verify:live chain is exactly ten signups. A rate limit tuned for strangers is currently the
        constraint on our own release process; if it is ever raised, raise it for a reason about
        strangers."


  - id: unit-economics-are-unmodelled                         # "D7"
    owner: claude
    opened: 2026-08-20
    what: "Nothing anywhere derives the per-owner cost of DSQL, KMS requests, Vercel functions, OpenAI
      intake and Resend against the price in monetization_path."
    why_it_matters: "At today's scale it does not matter. It is the arithmetic that tells the demand
      lane whether it is selling something with a margin, and the demand lane is running now."
    ends_when: "one page exists with three scenarios — dormant owner, typical owner, owner in an active
      release, the third being the expensive one and the one the product is for — every assumption
      named, and the break-even count. ⚠️ No number from it may be copied anywhere else."
    closed:
      date: 2026-08-20
      what_shipped: "docs/unit-economics.md. Vendor prices FETCHED from each pricing page on the
        day rather than recalled; every driver that could not be measured without production
        credentials is listed as a numbered assumption with what happens if it is wrong."
      the_finding: "THIS IS A FIXED-COST BUSINESS, NOT A VARIABLE ONE. A typical owner costs about
        27 cents a year to serve and an owner in an ACTIVE RELEASE — the moment the product exists
        for — costs about 35 cents. Fixed costs are roughly $267/yr, so BREAK-EVEN IS ABOUT THREE
        PAYING OWNERS. Margin is not the question at this price, in either direction."
      # ⚠️ SUPERSEDED IN PART, 2026-08-28. A1 IS now verified: the Vercel account is on the `pro`
      # plan, read from the API on 2026-08-27. The paragraph below is left as written because it
      # is the closure's own reasoning and the record of what was unknown when the closure was
      # made — but the "one assumption NOT verified" clause is no longer true, and the free-plan
      # branch ("break-even is closer to ONE") is now a counterfactual, not a live risk.
      # Re-derive rather than trusting either number here.
      the_weakest_link_is_named: "The break-even is dominated by A1 — that Vercel is on a ~$20/month
        plan — which is the one assumption NOT verified, because a sprint worktree holds no
        credentials. On the free plan break-even is closer to ONE. Verifying that single figure is
        worth more than refining every variable driver on the page."
      two_things_it_changed: "(1) Enabling KMS key rotation is NOT free — the first and second
        rotation each add $1/month, capped after. ROTATION_INTENDED is false, and turning it on is
        ~$24/yr, about 10% of fixed costs. Small, and no longer invisible. (2) A multi-Region CMK
        costs $1/month PER REPLICA on top of the primary, which confirms
        docs/kms-region-proposal.md's Option B estimate rather than leaving it as a guess."
      what_is_not_on_the_page: "The costs that would actually matter are not infrastructure —
        support time, and the third-party security audit G5 requires. One audit is worth more than a
        decade of the figures derived here."


  - id: a-failed-renewal-tells-the-owner-nothing               # "E1"
    owner: claude
    opened: 2026-08-20
    what: "invoice.payment_failed is not a handled event; the webhook handles
      checkout.session.completed and customer.subscription.updated/deleted. When a subscription
      finally lapses the handler writes an audit entry and sends no mail."
    why_it_matters: "🔴 Stated precisely, because the first draft of this finding was WRONG in the
      half that matters and the correction is the useful part: ACTIVE_STATUSES already INCLUDES
      past_due, so a card that fails on renewal does NOT revoke access during Stripe's retry window.
      That is correct and deliberate. What is missing is everything around it. And it becomes
      release-blocking rather than merely rude the moment TIER_LIMITS.free.canRelease flips to false
      (ratified.beta-free-release, revisit 2026-10-01): an expired card would then stop the one thing
      the product exists to do, because of a billing event nobody was told about."
    ends_when: "the owner is told, once per invoice, idempotently against Stripe's redeliveries, with
      the one link that fixes it — BEFORE the 2026-10-01 paywall revisit, not after."
    closed:
      date: 2026-08-20
      what_shipped: "lib/billing/lapse-notice.ts — two notices (renewal failed, subscription ended),
        deduped on the Stripe object id, wired into the webhook. invoice.payment_failed is a handled
        event for the first time; the final lapse now tells the person it happened to as well as
        recording that it happened."
      nothing_changes_entitlement: "past_due is inside ACTIVE_STATUSES deliberately, so a failed
        renewal does not revoke access during the retry window. This is notification ONLY, and the
        route guard asserts the payment-failed branch never calls upsertSubscription — otherwise it
        would revoke access during exactly the window that exists to prevent that."
      dedupe_is_the_audit_log: "Same storage invite-budget.ts already meters against — no new table.
        Keyed on the Stripe id rather than a time window, because Stripe's retry schedule is its own
        business and a window would double-send on a slow retry and suppress a genuinely new failure
        on a fast one. `detail->>` is proven against DSQL by two existing live paths
        (lib/access/closure.ts, lib/notify/notifications.ts) rather than assumed."
      the_record_tells_the_truth: "Order is check -> send -> record, and the entry carries whether
        the send succeeded. Recording first would write `notified` for mail that never left;
        recording only on success would retry forever against a permanently bouncing address. A
        failed send also leaves a distinct `NOTICE NOT DELIVERED` line, the shape error-reporter.ts
        uses, because a notification nobody received is silence that reads as health."
      # ⚠️ A CONTRACT DETAIL THE BACKLOG GOT WRONG.
      there_was_no_webhook_test_harness: "The item said 'red-green proven against the existing
        webhook test harness'. There is none — src/app/api/stripe/webhook/ has no test file at all.
        Logic went into lib/ per the repo convention and is tested there, plus a route-level guard
        in the same file, because every module test would stay green if the webhook stopped calling
        either notifier."
      also_touched: "lib/notify/notifications.ts — `appUrl()` was module-private and the same
        three-line expression is duplicated in lib/people/invite.ts and inlined in two auth files.
        Exported the canonical one rather than adding a FIFTH copy. ⚠️ The other three copies are
        left alone and reported rather than refactored: see the sprint report."
      proof: "20 tests. Both plants red: removing the dedupe (double-sends on Stripe's retry), and
        recording before sending (the record then claims delivery it cannot know about)."
      ⚠️_still_owed_live: "THE REAL STRIPE WEBHOOK HAS NEVER FIRED THIS. The unit tests prove the
        module and the route guard proves the webhook calls it; only Stripe proves the payload shape.
        There is no Stripe key in .env.local or .env.admin, so this cannot be done from a laptop.
        STEVE: send a test-mode invoice.payment_failed to the production endpoint from the Stripe
        dashboard, confirm exactly ONE email arrives, then re-deliver the SAME event and confirm
        nothing is sent — that second half is the dedupe, and it is the half a single send does not
        prove. Ruled 2026-08-20; record the result here when done."


  - id: the-post-lapse-state-is-undefined                     # "E2"
    owner: steve
    opened: 2026-08-20
    what: "A lapsed owner drops to the free tier holding a vault that may exceed the free item cap.
      assertCanAddItems gates ADDING only, so existing items are untouched."
    why_it_matters: "That is the humane behaviour and it is an emergent property of where the check
      sits, not a decision anybody made or wrote down. A custodian must be able to answer 'what
      happens to my data if I stop paying' in one sentence, and /terms cannot answer it because
      nothing has decided it. Today a refactor of assertCanAddItems could silently start deleting
      people's history and no test would notice."
    ends_when: "the behaviour is established path by path by READING the code, pinned by tests so the
      humane behaviour stops being an accident, and stated in /terms. ⚠️ Changing what a lapse does to
      customer data is Steve's decision, which is why the owner is not claude; describing what it
      currently does is not."
    closed:
      date: 2026-08-20
      note: "Closed by DESCRIBING, which is the half that was claude's. Nothing about what a lapse
        does was changed, and `canRelease` was not touched."
      the_answer: "A LAPSE CHANGES EXACTLY ONE THING: WHAT YOU CAN ADD. Established by reading every
        path — existing items, recipients and verifiers are untouched; access rules and release
        states were never gated at all; EDITING an existing item is not gated (PUT carries no cap
        check); REVEAL and EXPORT are not gated by tier; and the only bulk deletion of a vault lives
        in deleteAccount(), which is a different act preceded by cancelling billing. Adding is
        refused above the free cap, and that is the whole of it."
      why_it_needed_pinning: "The humane answer was an EMERGENT PROPERTY of where the checks sit,
        not a decision. The risk was never a bug — it was a refactor: somebody tidying
        entitlements.ts could move a cap onto a read path, or add a downgrade handler that trims a
        vault to the free limit, and nothing would have noticed while /terms promised otherwise."
      guard: "lib/ops/post-lapse-state.test.ts, 13 assertions, one per path. Proven by planting BOTH
        regressions it exists for: a downgrade handler that DELETEs vault_items (1 red), and a cap
        check added to the item EDIT path (1 red). It also pins TIER_LIMITS.free.canRelease at its
        current value WITHOUT asserting that value is right — so flipping it goes red and makes
        somebody read the three artifacts that must move together, rather than being a quiet
        one-liner that converts an expired card into a blocked release."
      terms: "/terms now answers it in one paragraph: nothing is deleted, the vault stays, what
        changes is what you can add, and reading/editing/exporting are unaffected."
      # 🔴 A NAME THIS SPRINT'S OWN BACKLOG INVENTED.
      assertcanadditems_does_not_exist: "The backlog entry for this item, and the entry above it,
        both referred to `assertCanAddItems`. There is no such function — the real gates are
        assertWithinItemCap, assertBatchWithinItemCap, assertWithinRecipientCap and
        assertWithinVerifierCap. The wrong name had already been repeated into a comment in
        lapse-notice.ts before reading the file. Corrected in both places, and recorded: a
        plausible-looking function name in a comment is what a later reader greps for, fails to
        find, and then distrusts the surrounding comment over."


