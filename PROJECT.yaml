  - id: the-alarm-of-record-delivers-to-trash                 # ROADMAP B10
    owner: steve                          # the filter removal; claude re-proves delivery after
    opened: 2026-08-28
    found: 2026-08-27
    what: >-
      Every `[sgharlow/relay] Run failed` mail since 2026-08-08 lands in Gmail TRASH — roughly
      twenty threads, about half of them never read, INCLUDING both deliberate red-proofs. The
      alarms fire, the workflows exit 1 correctly, and no human is told.
    why_this_outranks_the_alarms_it_breaks: >-
      `kms-wall.yml` writes its own acceptance bar into its header: it is proven only when it
      "exits 1 AND the notification reaches a watched inbox". Half of that bar has never been met.
      Every other scheduled alarm in this repo inherits the same defect, so B4's "proven red" and
      the canary's "proven red" are, today, claims about an exit code and nothing else. A custodian
      whose alarms go to Trash has no alarms — and this project's whole premise is custody.
    why_it_is_steve_s: >-
      The Gmail connector is READ-ONLY at its OAuth scope and Gmail exposes no filter API at any
      scope, so no tool available here can delete the rule. Claude can NAME it (Settings → Filters
      / Blocked addresses, read-only via Claude-in-Chrome) and can re-prove delivery afterwards;
      removing it is a human click in Steve's signed-in session.
    the_evidence_expires: >-
      The 2026-08-25 evidence mail purges around 2026-09-24 under Gmail's 30-day Trash policy. This
      is not a deadline on the fix — it is a deadline on being able to SHOW the fault to anyone
      who doubts it. Capture the thread list before then if the rule is not removed first.
    ends_when: >-
      The filter or block rule is removed AND a fresh deliberate failure
      (`gh workflow run kms-wall.yml -f key_id=<bogus>` — read-only KMS calls) is observed
      arriving with an INBOX label, by a read-only Gmail search, not by assuming the removal
      worked. Both halves, or this is not closed.
    measured_2026_08_29: >-
      🔴 THE PREMISE OF THIS ENTRY IS FALSE AS WRITTEN, and the second half of `ends_when` is
      MET three times over. Measured by read-only Gmail search on 2026-08-29, after three
      deliberate red runs were dispatched for B13.
      DELIVERY WORKS TODAY. All three notifications reached the INBOX, labelled `relay-alarm`
      (`Label_779648277632189340`), starred and unread — Production canary run 33237399208
      (mail +37s), Scheduler heartbeat monitor 33237979699 (+23s), Delivery webhook monitor
      33237980971 (+23s). A red workflow reaches a watched inbox in well under a minute.
      THE ~20 HISTORICAL THREADS ARE NOT IN TRASH — THEY ARE ARCHIVED. `to:relay@noreply.github.com
      subject:"Run failed"` returns 23 threads outside Trash and 2 inside. The 20 older ones carry
      `relay-alarm` + `IMPORTANT` and NO `INBOX` label, which is archived-and-labelled, not
      trashed. `relay-alarm` holds exactly 23 messages, 14 unread — and "about half unread" is
      the detail this entry recorded, so the same threads were being looked at and their state
      was read as TRASH when the distinguishing label was the ABSENCE of INBOX.
      THE CITED EVIDENCE MAIL IS NOT IN TRASH EITHER. This entry names
      `Run failed: KMS wall watch - master (ce776ef)`, 2026-08-25, "labels TRASH+UNREAD". The live
      labels on that thread are `UNREAD, relay-alarm, IMPORTANT` — no TRASH. Either it was
      misread, or it was untrashed between 2026-08-27 and now; the two threads that ARE in Trash
      (2026-08-13, 2026-08-28) are both consistent with hand deletion, and the 2026-08-28 one is
      starred, which a filter would not do on its way to the bin.
      SO `the_evidence_expires` IS MOOT — nothing is counting down to a purge.
    what_is_still_unknown_and_why_it_matters: >-
      WHY it now works. The filter itself was NOT read: B10.d prescribed reading Settings →
      Filters / Blocked addresses via Claude-in-Chrome, and the browser extension is not connected
      ("Browser extension is not connected"), so the rule that applies `relay-alarm` — and whether
      it still carries "Skip the Inbox" — is unnamed. That is the difference between "delivery
      works" and "delivery works for a reason that will keep holding". Something changed between
      2026-08-25 (archived, unstarred) and 2026-08-29 (inbox, starred); nothing in this repo
      records what, and a fix nobody can name is a fix that can be undone by the same unrecorded
      hand.
    revised_ends_when: >-
      The `relay-alarm` filter is read and named — its conditions and whether "Skip the Inbox" is
      set — by Claude-in-Chrome once the extension is connected, or by Steve reading it out. The
      delivery half is already proven and does not need re-proving. Owner moves to CLAUDE for the
      read; it stops being Steve's the moment no rule needs deleting.

  - id: the-scheduled-monitors-are-collapsing                 # ROADMAP B11
    owner: claude                         # measurement; steve owns the money half
    opened: 2026-08-28
    what: >-
      Between 2026-08-18 and 2026-08-27 the production canary ran 45 times on the first day and 2
      on the last; the scheduler monitor went 30 → 3. Designed cadence is 96/day and 48/day. This
      is not queueing: `created_at == run_started_at` on the runs that did happen, so GitHub is
      not delaying the jobs, it is not CREATING them.
    two_coincident_causes_neither_confirmed: >-
      (1) the account's 2,000 Actions minutes read 100% used on 2026-08-28, resetting 2026-09-01 —
      private repos consume them and relay is public, so relay's own runs should be free, which is
      why this is a suspicion rather than a finding; (2) a GitHub Actions incident on 08-26/27.
      ⚠️ Do not settle on either without the re-measure. Two plausible causes are how a wrong one
      gets adopted.
    why_it_matters_beyond_cadence: >-
      Every "the monitors run every 15 minutes" sentence in this repo is currently false, and the
      absence-alarm design assumes a run rate it is not getting. An alarm that fires on absence,
      whose own schedule is absent, cannot distinguish a dead product from a dead scheduler.
      This is also the strongest argument on the record FOR B12 (an off-GitHub heartbeat).
    ends_when: >-
      A per-day run count is re-measured on or after 2026-09-02 (the billing-reset date named in
      GitHub's own mail) and either shows the designed cadence restored — in which case the cause
      is recorded, not shrugged at — or shows it still collapsed, in which case B12 stops being a
      proposal and becomes the fix.
    revisit: 2026-09-02
    re_measured_2026_08_29_and_BOTH_CAUSES_ARE_DISPROVEN: >-
      This entry warned "do not settle on either without the re-measure. Two plausible causes are
      how a wrong one gets adopted." Re-measured 2026-08-29, four days early, and the discriminator
      turned out not to be the calendar but the CADENCE TIER. Scheduled runs per day,
      2026-08-24..29:
      production-canary (nominal 96) 36, 38, 24, 2, 3, 4 ·
      scheduler-monitor (nominal 48) 25, 26, 17, 3, 2, 4 ·
      delivery-webhook-monitor (nominal 1) 1, 1, 1, 1, 1, 1 ·
      date-guards (nominal 1) 1, 1, 1, 1, 1, 1 ·
      kms-wall (nominal 1) 1, 1, 1, 1, 1.
      **Every DAILY workflow delivered 100% on precisely the days the high-frequency ones fell to
      about 3%.**
      CAUSE (1), Actions-minutes exhaustion, is DISPROVEN: it would starve the daily tier too, and
      the daily tier is untouched. It was always the weaker hypothesis - this entry says so itself,
      because relay is public and its runs should be free - and the frequency split settles it.
      CAUSE (2), the 08-26/27 GitHub incident, is DISPROVEN: an incident is transient and this
      persisted through 08-29, three days later, unchanged.
      What the data shows instead is FREQUENCY-SELECTIVE delivery: sub-hourly schedules are being
      dropped and daily ones are not.
    why_this_matters_more_than_the_cause: >-
      The planned response was the money half - a payment method or plan on the GitHub account.
      That would have bought nothing, because minutes are not what is being withheld. Adopting the
      wrong cause would have cost real money AND left the defect in place, which is exactly the
      outcome this entry's own warning was written to prevent.
    the_operational_state_while_this_is_open: >-
      Production has NO EFFECTIVE SYNTHETIC MONITORING. At 4-5 canary runs a day the detection
      window for a broken deploy is 5-6 hours, against the quarter of an hour the cron asks for and
      the repo's prose still claims in several places. Measured live 2026-08-29 by
      `npm run check:cadence`: canary 5 runs/24h, scheduler-monitor 4.
    what_shipped_2026_08_29_b12i: >-
      `.github/workflows/cadence-watch.yml` - a DAILY workflow counting each high-frequency
      monitor's scheduled runs over the trailing 24h and failing below a floor of 25% of nominal
      (24/day canary, 12/day scheduler-monitor). Verdict logic in `lib/ops/cadence-wall.ts`,
      proven against the three measured populations; live half in `scripts/check-cadence.ts`,
      run live 2026-08-29 and correctly reporting the collapse (exit 1).
      The daily tier watches the sub-hourly tier BECAUSE of the measurement above - it is not an
      assumption that GitHub schedules work, it is the narrow finding that daily ones currently do.
      ⚠️ It will be RED on its first scheduled run, because the monitors are collapsed as it ships.
      That is the alarm being correct. Its text says so and points here, so a reader does not
      investigate a known defect from scratch.
      ⚠️ It does NOT fire on the day a collapse BEGINS. 2026-08-26 measured exactly 24 and passes;
      a floor set to catch it would sit inside the healthy population and fire on ordinary days.
      That trade-off is pinned by a test rather than left to be rediscovered.
    what_is_still_open: >-
      The cause, and the fix. Neither is closed by watching. The 2026-09-02 re-measure still has a
      question to answer - whether the minutes reset changes anything - but it is now a narrow one,
      because the minutes hypothesis is already disproven by the frequency split. And B12 is
      strengthened rather than satisfied: this watcher shares fate with what it watches.

  - id: the-alarms-live-inside-the-thing-they-watch           # ROADMAP B12
    owner: steve                          # infra + cost, 5-gate; claude builds after the ruling
    opened: 2026-08-28
    what: >-
      Every alarm relay has is a GitHub Actions schedule. There is no heartbeat outside GitHub, so
      a GitHub outage, a billing lapse, a load-shed, or a park silences the entire alarm estate at
      once and nothing reports the silence. Proposed in three separate documents and taken in none.
    the_second_expiry_nobody_has_dated_in_a_guard: >-
      GitHub auto-disables schedules on public repos after 60 quiet days. From the 2026-08-25 push
      that is roughly 2026-10-24. Every `verify:live` stamp commit resets the clock, which is why
      it has never bitten — the protection is a side effect of an unrelated cadence, which is not
      a protection.
    the_shape: >-
      A Route 53 health check or CloudWatch Synthetics canary → SNS NotifyMe: the one path in this
      estate proven to reach a human. B12.i is the interim that needs no AWS change and no ruling —
      a Windows Task Scheduler job beside the existing devsync one, which is worth having on its
      own merits because it also survives a GitHub outage.
    why_it_is_steve_s: >-
      It is an infrastructure change with a recurring cost against a working system, so it takes
      the 5-gate path in full. The interim does not, and should not wait for it.
    ends_when: >-
      Either an off-GitHub heartbeat exists and has been proven to reach a human inbox once, or
      Steve records the decision to accept single-provider alarm risk with a stated residual risk
      and a revisit date. An undated "not yet" is the one illegitimate outcome.

  - id: the-journey-sweep-has-no-freshness-dead-man           # ROADMAP B14
    owner: claude
    opened: 2026-08-28
    what: >-
      `verify:journeys` walks J3, J6 and J9 and each walk prints its own count — but nothing
      schedules it and nothing ages it. D10 was closed by BUILDING the walks, and building a walk
      is not the same as keeping it true.
    why_this_is_the_repo_s_own_recurring_shape: >-
      A check that never runs is indistinguishable from a check that passes, and this file already
      carries several entries about exactly that. `verify:live` has a stamp line and a
      `STALE_AFTER_DAYS` assertion; the journey sweep has neither, so the 2026-08-21 walks are
      decorative from the day after they ran.
    ends_when: >-
      The sweep writes a stamp line and a freshness assertion fails when it goes stale, in the
      shape `verify:live` already uses — and the chain is kept SEPARATE from the live chain,
      because merging them would push the combined run through the signup rate ceiling (D14).
    closed:
      date: 2026-08-29
      what_shipped: >-
        All three, plus the half `ends_when` did not ask for. `verify:journeys` now ends in
        `verify:stamp:journeys` (`scripts/stamp-verify-journeys.ts`) writing
        `docs/verify-journeys-runs.jsonl`; `lib/ops/verify-journeys-freshness.ts` holds the
        threshold and this chain's own prose; `lib/ops/verify-journeys-freshness.test.ts` is the
        dead-man. The chains stay separate and the module says why in the threshold's own comment.
      the_parse_logic_is_not_copied: >-
        `verify-journeys-freshness.ts` imports `assess` from `verify-live-freshness.ts` rather
        than restating it. What a log MEANS — corrupt is not `never`, a future stamp is not fresh,
        the newest entry decides — is one contract, and a second copy is a second thing to get
        wrong. Four tests re-assert that contract THROUGH the journeys entry point, so an edit
        that quietly gives this chain its own copy fails rather than drifts.
      threshold_is_21_not_14_and_the_number_is_the_ceiling: >-
        `JOURNEYS_STALE_AFTER_DAYS = 21` against `verify:live`'s 14. The two chains cannot share
        an hour (D14: `verify:live` performs exactly 10 signups into a 10/hour limiter, this
        chain 5 more), so equal thresholds would demand a two-part sitting every fortnight — and
        a gate that is expensive to satisfy gets its threshold raised instead of being run. Kept
        under a month because two assertions here go RED when the approve-before-first-rule
        defect is fixed, and a chain that has not run since before a fix reports a stale finding
        as a live one. Both bounds are asserted by test, not left as prose.
      the_recurrence_is_closed_structurally: >-
        The finding was never "this chain lacks a dead-man" — it was that `verify:live` was given
        one on 2026-08-19 and the chain shipped 2026-08-21 did not inherit it. A third chain
        would do the same. `lib/ops/chain-dead-man.test.ts` fails when ANY multi-walk `verify:*`
        script in package.json is not declared with a stamp, a log and a dead-man, and when a
        declared chain's stamp is not its FINAL step (a stamp anywhere earlier would be written
        even when a later walk fails, which is the one thing it must never do). Proven by two
        planted violations; both caught, both restored green.
      ladder: >-
        `live-proven` for the guard, `built` for the chain's own freshness. The dead-man, the
        structural check and every state of `explainJourneys` are exercised; what has NOT
        happened is a script-written stamp. The log's only line is BACKFILLED and says so in the
        row (`backfilled: true` + a `source` quoting this entry's D10 sibling and commit
        `d710b06`), on the same narrow terms as the single hand line in
        `docs/verify-live-runs.jsonl`: a dated third-party record of the run already existed.
        The first real run supersedes it. Next fires ~2026-09-12.
      ladder_raised_same_day: >-
        ✅ **LIVE-PROVEN 2026-08-29, hours after it shipped.** `npm run verify:journeys` was run
        against production on Steve's say-so: delegate (J3), request (J6) and standdown (J9) all
        green — the standdown walk alone printing 23/23 — and `verify:stamp:journeys` wrote the
        FIRST script-written line to `docs/verify-journeys-runs.jsonl`
        (2026-08-29T07:53:10.158Z @ 79dc3d8). The log now holds 2 entries: the backfill and a real
        run. So the mechanism is no longer `built` — the stamp has been observed being written as
        a side effect of three walks exiting 0, which is the only thing that was ever in doubt.
        Dead-man now next fires ~2026-09-19 (21 days from this run).

  - id: web-analytics-collects-but-cannot-be-read             # ROADMAP A7.0
    owner: steve                          # a dashboard toggle; Claude cannot enable it
    opened: 2026-08-29
    what: >-
      Measured 2026-08-29. The Vercel query API refuses the relay project with
      `web_analytics_not_enabled` (400), while the edge serves
      `/_vercel/insights/script.js` (200, 2,495 bytes) and the collector answers **200 OK** to
      both `POST /_vercel/insights/view` and `POST /_vercel/insights/event`. So the site looks
      instrumented from outside, every beacon succeeds, and there is nothing readable.
    why_it_matters_on_exactly_one_day: >-
      Placement day. The number cannot be re-collected afterwards, and the failure presents as an
      empty dashboard beside a site that appears to be reporting correctly. This is the
      precondition ROADMAP A7.0 suspected and this measurement confirms - Sprint 5 cannot start
      until the toggle is thrown.
    it_disproves_the_check_the_roadmap_asked_for: >-
      A7.0 prescribed extending `verify:funnel` to assert the collector accepts the event - a 2xx
      on the `/_vercel/insights/event` POST - rather than only that `window.vaq` filled. BOTH
      halves are already true on a project that collects nothing readable, so that check would
      pass today. A stricter version of an instrument that measures the wrong thing measures the
      wrong thing more confidently. The discriminating read is the QUERY side (rows, or
      `web_analytics_not_enabled`), which needs a Vercel API token and therefore does not belong
      inside a browser walk as written. Recorded, not built: where it lives is a scope decision
      and the toggle has to be thrown first regardless.
    evidence: docs/g1-flight-log.md - section "A7.0 - WEB ANALYTICS IS NOT COLLECTING ANYTHING READABLE", with the four probes and their commands
    ends_when: >-
      Web Analytics is enabled for the `relay` project, the API probe returns a count instead of
      `web_analytics_not_enabled`, and a decision is recorded about where the queryability
      assertion lives.

  - id: the-billing-contract-had-no-guard                     # ROADMAP E1.6 + E1.7 + E1.1
    owner: claude
    opened: 2026-08-29
    closed:
      date: 2026-08-29
      what_shipped: >-
        `npm run verify:stripe` — `lib/ops/stripe-wall.ts` (pure verdicts, no credentials) +
        `scripts/verify-stripe.ts` (the live half), in the split `iam-wall`/`kms-wall` established.
        LIVE-PROVEN against the real account 2026-08-29, exit 0, and proven to fail in all three
        directions.
    e1_6_both_reads_answered_and_they_were_never_steve_s: >-
      Read #1 — `stripe webhook_endpoints retrieve we_1U2IIGGs40KMmT4XAIradLoE --live`:
      `status enabled`, `livemode true`, `enabled_events` = the four
      (`checkout.session.completed`, `customer.subscription.updated`,
      `customer.subscription.deleted`, `invoice.payment_failed`), matching the handler's four
      `case`s exactly. Read #2 — `stripe billing_portal configurations list --live`:
      `bpc_1Tu3WlGs40KMmT4X7RYjcEXF`, `is_default true`, `active true`,
      `subscription_cancel.enabled true`, **`mode at_period_end`** — so `/terms` is TRUE as
      written and NO copy change is owed.
      ⚠️ `docs/stripe-setup.md` had addressed read #1 to Steve as "one dashboard checkbox" since
      2026-08-21, saying "it cannot be read from this repo: there is no Stripe key in any local
      env, by design." True about the repo and false about the machine: a paired CLI answers it
      read-only in one command, and had been able to the whole time. An item sat in somebody
      else's court for eight days because the tool that answers it was not on the list of tools
      considered.
    e1_7_the_rule_that_is_not_ours_to_break: >-
      The portal configuration is ACCOUNT-LEVEL on an account shared with report-bridge,
      skillcrossroads and second-brain. Another product's operator flipping cancellation to
      `immediately` makes `/terms` a false statement to Relay's paying customers — no commit, no
      deploy, no test, no alarm — and a customer cancelling on day 31 loses the eleven months they
      paid for with the refund window already closed. That is why this is a standing check rather
      than the paragraph it used to be.
    proven_in_every_direction: >-
      17 unit tests, fixtures copied verbatim from the live objects. Planted violations caught: a
      handled event the endpoint will not send; a disabled endpoint; a test-mode endpoint audited
      as live; the shared-account flip to `immediately`; cancellation switched off; a non-default
      configuration audited by mistake; an inactive default. Asserted NOT to fire on an enabled
      event with no handler (that falls to `default: break` — noise, and a rule half made of noise
      gets muted), and asserted to report a disabled cancel control ONCE rather than twice.
      Live exit codes all three demonstrated - 0 holding, 1 with a planted `case 'invoice.paid'`
      in the real route, 2 with a bogus key (which also exercised the STRIPE_READONLY_KEY branch
      before that key exists).
    the_pin_cannot_outlive_its_sentence: >-
      `TERMS_IMPLY_CANCEL_MODE` is pinned to `at_period_end` BECAUSE `REFUND_POLICY` says "cancel
      at any time to stop the next one". If that copy is rewritten, a pinned constant would go on
      comparing the live portal against a promise nobody makes, and go on passing. So the clause
      itself is asserted — the clause, not the sentence, so ordinary copy edits do not break it.
    e1_1_the_build_marker_and_why_process_env_would_not_do: >-
      The webhook now answers `{received:true, build:{sha,loadedAt,instance}}`
      (`lib/ops/build-marker.ts`), behind signature verification, so it reaches Stripe and the
      holder of the endpoint secret and nobody else. `loadedAt` and `instance` are captured at
      MODULE LOAD, not per request: a marker read from `process.env` each time would print the
      same string from a stale module as from a fresh one and would prove nothing, and a stale
      module is the leading unproven explanation for the nine deliveries that reached `sendOnce`
      with n=0 and wrote nothing. `RELAY_BUILD_SHA` exists because route 3 runs against a LOCAL
      production build where Vercel's variable does not.
      ⚠️ A defect was found by its own test, not by inspection - `??` accepted an EMPTY string
      from a bare `RELAY_BUILD_SHA=` line, yielding `sha: ""`, a present-but-falsy field that
      reads as a broken marker rather than an unset one. Fixed to treat empty as absent.
    three_repo_guards_fired_while_this_was_built: >-
      Worth recording, because each one caught something a careful author had already missed:
      `env-example.test.ts` refused `STRIPE_READONLY_KEY` and then `RELAY_BUILD_SHA` until both
      were documented (and `VERCEL_GIT_COMMIT_SHA` classified as platform-set);
      `secrets-have-a-rotation-procedure.test.ts` refused `STRIPE_READONLY_KEY` until
      `docs/secret-rotation-runbook.md` gained a row and section §8. The structural checks in
      `lib/ops/` are doing the job their headers claim.
    what_is_NOT_closed: >-
      Scheduling. `STRIPE_READONLY_KEY` is unminted, so this runs only when somebody runs it —
      the exact weakness the dead-mans elsewhere exist for. The CLI fallback is Steve's browser
      pairing and expires 2026-10-07 (E1.8), which is a HARDER deadline than it looks: after that
      date, with no restricted key, this check has no read path at all.
    ends_when: >-
      Steve mints a restricted read-only key (Webhook Endpoints: read, Billing Portal: read — and
      NEVER the secret key, on a shared account), it is set where the check runs, and the check is
      scheduled. Until then this is `live-proven` as an instrument and `built` as a guard.

  - id: two-debts-carried-five-sprints                        # ROADMAP D27
    owner: claude
    opened: 2026-08-29
    closed:
      date: 2026-08-29
      what_shipped: >-
        Both filed, and both MEASURED rather than filed on the strength of the sentence that
        raised them. `docs/sprint-reports/2026-08-15-sprint-4-telemetry.md` listed them in an
        "accepted" table and nothing carried them forward, so they were accepted in a document
        nobody re-reads - which is how a debt stops being a debt without being paid.
    debt_1_email_send_attempts_retention: >-
      ACCEPTED, with the number. The worry was "one row per outbound message, forever". Measured
      read-only 2026-08-29 under `relay_ro`: **4 rows total**, oldest 2026-08-16, newest
      2026-08-19 - **nothing in the ten days since** - which is 0.30 rows/day and projects to
      ~108 rows/year. Retention is not a problem at this volume and would not be at a hundred
      times it. The revisit trigger is concrete rather than a feeling: if outbound volume ever
      reaches a point where this table is measured in six figures, it becomes a retention
      question. Nothing else changes it.
      ✅ AND THE CONSUMER IS CORRECTLY CLOCK-INDEPENDENT, which was worth checking while here.
      `/api/health/delivery-webhook` reads this table and returned `healthy: true` on ten days of
      silence - deliberately: `ripeSends: 4, ripeSendsHeard: 4`, and its own `meaning` says "a
      long age here is normal - this product sends rarely by design, and the judgement above is
      made against sends, not against the clock." A monitor over a rarely-written table that
      judged by age would page every quiet week and be muted within a month.
    debt_2_scrollable_regions_raw_css: >-
      FILED, and a LIVE INSTANCE was found in the filing - which is the argument for filing
      rather than accepting. `lib/ops/scrollable-regions.test.ts` reads utility classes in
      markup, and states its own blind spot: "scrolling introduced from CSS rather than a utility
      class, and vertical regions (`overflow-y-auto`)".
      The vertical half is EMPTY - `grep -rn "overflow-y-auto" src/ --include=*.tsx` returns 0, so
      that part of the debt is theoretical today.
      The raw-CSS half is NOT. `src/app/(owner)/_components/SidebarNav.tsx:124` sets
      `overflowX: 'var(--nav-overflow)'`, and `globals.css:161` resolves that variable to `auto`
      below 720px. So the owner navigation IS a horizontally-scrolling region on mobile, and the
      check cannot see it.
      ⚠️ IT IS NOT A DEFECT, AND THE REASON IS AN ARGUMENT RATHER THAN AN ACCIDENT. The element
      is a `<nav>` with `aria-label="Owner navigation"`, so it is named and is already a landmark
      (no `role="region"` needed). It carries no `tabIndex={0}` - and does not need one, because
      every child is a `<Link>`: tabbing through them scrolls each into view, so a keyboard user
      reaches every destination. That is exactly the exemption the test file names - "whose
      keyboard story is usually carried by the focusable content inside them" - and it is a
      judgement a markup-reading check cannot make.
      So the honest state is: the gap is real, one instance exists, that instance is fine, and
      the reason it is fine is not checkable by the cheap guard. `scripts/a11y-audit.mjs` on the
      rendered tree is the thing that would catch a future instance whose children are NOT
      focusable.
    why_this_entry_exists_at_all: >-
      Neither debt is serious, and that is the point worth keeping. They sat in a sprint report's
      "accepted" table for five sprints, where "accepted" meant "written down once". Filing them
      cost one read-only query and one grep, and the grep found something the sentence that
      raised the debt did not know about.
    ends_when: >-
      Closed. Debt 1 is accepted with a measured trigger; debt 2 is recorded with its live
      instance and the reason that instance passes. Neither owes further work unless outbound
      volume changes or a scrolling region appears whose children are not focusable.

  - id: repo-security-settings-were-all-off                   # ROADMAP B27
    owner: claude
    opened: 2026-08-29
    closed:
      date: 2026-08-29
      what_shipped: >-
        Enabled on Steve's nod, and VERIFIED by re-reading the API rather than by trusting the
        PATCH response: `secret_scanning: enabled`, `secret_scanning_push_protection: enabled`,
        and Dependabot **vulnerability alerts** (`PUT .../vulnerability-alerts` -> 204).
        Re-derive: `gh api repos/sgharlow/relay --jq .security_and_analysis` and
        `gh api repos/sgharlow/relay/vulnerability-alerts -i` (204 = on, 404 = off).
      the_state_it_was_in: >-
        A PUBLIC repository with every one of them disabled: secret scanning, push protection,
        validity checks, non-provider patterns, Dependabot security updates. On a public repo a
        leaked credential is public the instant it lands, so push protection is the one with real
        blast radius - it refuses the commit rather than reporting it afterwards.
      the_good_news_worth_recording: >-
        `gh api repos/sgharlow/relay/secret-scanning/alerts` returns **0** on first scan. The
        history has been public since June and carries no detected credential. That is a
        measurement, not a guarantee - scanning finds provider-recognised patterns, so a
        home-rolled token shape is still invisible to it.
      deliberately_NOT_enabled: >-
        `dependabot_security_updates` (the automatic version-update PRs) stays OFF, on Steve's
        instruction: ALERTS only. Major-version upgrades of infrastructure components are barred
        by the portfolio Infrastructure Change Policy, and a bot that opens them trains everyone
        to close its PRs unread - which would cost the alert feed its credibility too.
        `npm audit` in CI was offered and declined for now: it needs a severity threshold decided
        first, or one transitive advisory turns every PR red and the step is deleted within a
        fortnight.
      ends_when: >-
        Closed. The remaining choices - validity checks, non-provider patterns, npm audit in CI -
        are open decisions rather than gaps, and each needs a threshold or a tolerance set before
        it would be an improvement.

  - id: a-dead-instance-was-paging-nightly                    # ROADMAP B31
    owner: claude                         # executed on steve's nod; another product's footprint
    opened: 2026-08-29
    closed:
      date: 2026-08-29
