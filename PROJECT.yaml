        ROADMAP §2-H item E1.9. This entry's original `ends_when` asked for `live-proven`, and the
        three routes above establish that `live-proven` is reachable by exactly one route — a REAL
        renewal failure — which is not schedulable and may not occur before the paywall decision
        it was meant to inform. An `ends_when` that can only be satisfied by luck is not a test; it
        is a way for an entry to stay open forever while real progress goes unrecorded.
