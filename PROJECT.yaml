  - id: the-readiness-banner-goes-stale-for-the-whole-session
    owner: claude
    opened: 2026-08-29
    found_by: >-
      A0, being done for the first time by a real owner. Steve built his entire plan - item,
      recipient, access rule, check-in - and the banner told him at EVERY step that his vault was
      empty and nobody was named. Screenshots at 20:28 and 20:31 show the vault listing "1 item ·
      gmail" directly beneath a banner reading "Your vault is empty - there is nothing to give
      anyone access to", and the triggers page at 20:31 still saying "Nobody is named to receive
      access" with April already in the circle and an ARMED emergency trigger on screen.
    what: >-
      `ReadinessBanner` lives in `src/app/(owner)/layout.tsx` and fetches `/api/readiness` exactly
      ONCE, on mount. Its only other refresh is a subscription to `onFactorsDeclared`. Adding a
      vault item, a recipient, a verifier or an access rule refreshes NONE of them.
      Because it is in the LAYOUT, App Router does not remount it when navigating between owner
      pages - so the banner keeps whatever was true when the owner first entered the owner area,
      for the rest of the session, until a hard reload.
    the_logic_is_correct_and_that_is_the_point: >-
      `lib/vault/readiness.ts` queries live counts and its blocker rules are right. Nothing is
      wrong with the assessment; the component simply never asks again. So this is not a wrong
      answer, it is a right answer from the wrong moment - which is harder to notice, because
      every sentence in it is one the product genuinely said at some point.
    why_it_matters_more_than_a_cosmetic_bug: >-
      This is the surface that tells an owner whether their plan would actually work, on the
      dashboard they use to build it. An owner who trusted it during setup would conclude nothing
      had saved - and the two most likely reactions are to re-enter everything, or to give up. It
      also lands squarely in the custodial clause "what the product says about itself is true",
      about the one screen where that clause is most load-bearing.
      ⚠️ The component's own header anticipates exactly this failure for a NEIGHBOURING case: it
      documents adding the `onFactorsDeclared` subscription because otherwise "the surface this
      component's own comments call authoritative would be the stale one". The fix was made for
      one mutation and not generalised to the other four.
    measured_2026_08_29: >-
      Live counts at the time of the stale banner: items=1, recipients=1, rules=1, verifiers=0.
      Applying `assessReadiness`'s own rules to those counts yields ONE blocker, about verifiers -
      not the three the screen was showing. `npm run verify:dogfood` agreed independently: "NOT
      READY - 1 piece(s) missing: at least one verifier."
    candidate_fixes_not_yet_chosen: >-
      (1) Re-fetch on pathname change - cheapest, and it would have covered this case since Steve
      navigated between /vault, /circle and /triggers. Does not cover a mutation made without
      navigating.
      (2) Generalise the existing event-bus pattern: emit on item / recipient / verifier / rule
      writes the way `onFactorsDeclared` already does. Most correct, most edits.
      (3) `router.refresh()` after mutations, if the banner is moved to a server component.
      Not chosen here because A0 was the task and a UI change mid-A0 would have muddied what was
      being verified.
    ends_when: >-
      Adding an item, a recipient, a verifier or a rule updates the banner without a hard reload,
      with a test that would fail if the subscription were removed - the same bar the
      `onFactorsDeclared` fix met.
    closed:
      date: 2026-08-29
      what_shipped: >-
        Two changes, covering the two ways it went stale.
        (1) NAVIGATION - `ReadinessBanner` now re-reads on `pathname` change, not only on mount.
        `pathname` was already in the component for the sign-in href; adding it to the effect's
        dependency list is the entire fix for the case Steve actually hit, since he moved between
        /vault, /circle and /triggers throughout.
        (2) SAME-PAGE WRITES - `apiSend` announces every SUCCESSFUL owner-side write on a small
        event bus and the banner subscribes. Emitted at the helper rather than at each call site,
        because a convention every future caller must remember is precisely what this repo keeps
        deciding not to rely on.
      ordering_is_load_bearing: >-
        The announcement fires AFTER both throws, never before. Announcing a write that failed
        would refresh the banner into showing the same unchanged state, which reads exactly like
        success - the same trap `setFactorsRequired` already documents for the same reason. Pinned
        by two tests: a 400 and a 401 must each announce NOTHING.
      ⚠️_the_choke_point_is_not_complete_and_that_is_recorded_in_the_code: >-
        Vault ITEM creation goes through `CryptoService`, not `apiSend`, so a same-page item write
        still does not announce. It is covered in practice because creating an item navigates back
        to /vault, which fires (1). Closing it properly means emitting from `crypto-service.ts`
        too - deliberately not done, because that file is on the crypto path and was not worth
        touching for a status banner. Said in the `api.ts` header rather than left to be
        discovered.
      proven: >-
        Four tests, and mutation-tested: deleting the `announceOwnerWrite()` call makes "announces
        after a successful write" fail, and restoring it passes. 14 tests in api.test.ts.

  - id: the-reminder-ladder-has-never-fired                   # ROADMAP B15.1, the ladder half
    owner: claude                         # the walk; steve decides whether to check in
    opened: 2026-08-29
    what: >-
      The J5-R4 check-in reminder ladder has NEVER FIRED, for anyone. `owner_checkin_reminder_first`
      and `owner_checkin_reminder_final` have **zero rows in `audit_log`, ever** (read under
      `relay_ro`, 2026-08-29). It is wired - `sweepCheckinReminders()` is called by
      `/api/cron/heartbeat` on every hourly tick - and has simply never had an owner reach a rung.
    🔴_corrected_same_day_it_does_NOT_fire_on_2026_09_01: >-
      Measured after this entry was first written, and it overturns the entry's own headline.
      `CANDIDATE_SQL` does not read every owner in the timing window - its last clause requires an
      **armed `release_state` of a user-selectable type**, and the live owner holds none. The real
      query run read-only against production returns **0 candidates**; the same query with that one
      clause removed returns **1** (the live owner). So the owner is in the 50-100% window exactly
      as computed and is NOT a candidate. No reminder fires on 09-01, on 09-06, or at all.
      ⚠️ Second overstatement in this area in one session, same shape both times: arithmetic done
      correctly on a gate never checked. The first claimed the sweep would arm their triggers on
      09-09 (it iterates an empty set). ROADMAP §0.0's own lesson - a finding is proven when the
      thing it describes has been LOOKED AT - was written and then broken twice within the hour.
    what_the_correction_leaves_is_stronger: >-
      The live paying owner receives NOTHING from any part of the custodial machinery: no reminder
      (not a candidate), no sweep transition (no armed rows), no release, no verifier notice. The
      product is completely inert for its only user, and all of it traces to A0.
      ✅ And it makes A0 SELF-PROVING: the owner is already at ~79% of a 30-day interval, past the
      75% rung, so the moment A0 configures a trigger they become a candidate while already past
      it - and the first check-in reminder this product has ever sent fires on the next hourly
      cron, to a real address. A0 is the cheapest live proof of this ladder available.
    superseded_timing_note: >-
      The live paying owner was last active 2026-08-10 on a 30-day interval, so the rungs land at
      **2026-09-01 16:32Z (75%)** and 2026-09-06 04:32Z (90%), with overdue on 2026-09-09 04:32Z.
      The first reminder this product has ever sent will therefore be sent to a real customer, and
      the first time the mechanism runs in anger will be unobserved unless it is walked first.
    the_failure_mode_is_silent_by_design: >-
      `sweepCheckinReminders()` NEVER THROWS - the cron route says so in place, "belt and braces",
      and that is the right call for a sweep that must not let one owner block the rest. The
      consequence is that a failure presents as a 200 from the cron, a healthy `scheduler_runs`
      ledger, and a customer who is never reminded. This is the exact shape B15 names and the exact
      shape the 2026-08-29 sweep proof was built to eliminate for the OTHER half of the ladder.
    how_to_prove_it_and_the_pattern_exists: >-
      Identical to the sweep walk proven on 2026-08-29 (`scripts/e2e-sweep.ts`): a disposable owner,
      `last_active_at` backdated to ~80% of a short interval, then WAIT for production's own hourly
      cron - nothing local may call the sweep, because `CRON_SECRET` is Vercel-only. Assert the
      `owner_checkin_reminder_first` audit row and the send attempt. The walk's safety refusal (no
      other owner already overdue) applies unchanged.
    🔴_it_CANNOT_be_walked_the_way_the_sweep_was_and_this_was_learned_by_trying: >-
      Attempted 2026-08-29 with `verify:reminder` - a disposable owner backdated to 80% of a
      one-day interval, waiting for a real cron tick. The tick came and the walk reported the
      ladder had NOT fired. It had not, and the product was blameless.
      `sweepCheckinReminders` writes its audit row ONLY on successful delivery -
      `if (!delivered) continue;` then `writeAuditEntry(...)` - and that ordering is deliberate,
      with its reason in place: the row is a DO-NOT-REPEAT marker, so "nothing was delivered" must
      leave nothing to repeat and let the next sweep try again. Meanwhile `lib/notify/email.ts`
      refuses reserved TLDs unconditionally ("`.test` is reserved and can never receive mail").
      Two correct designs meet, and a disposable owner can satisfy neither side: no delivery, so
      no row, so nothing to assert.
      ⚠️ The walk's own header had CLAIMED it "asserts the AUDIT ROW, not delivery ... what is
      being proven is that the ladder RUNS and RECORDS". That caveat was written and then the
      assertion it invalidates was built on top of it, and the walk was run before anyone checked.
      Fourth error of this family in one session: reasoning about a gate without reading it.
    what_the_walk_now_does: >-
      Proves the PRECONDITIONS and stops, loudly: that such an owner is a reminder candidate, is
      in the 50-100% window (past the 75% rung and short of overdue - an owner already overdue is
      not a candidate at all), and is NOT escalated by the tick that passes over them. It then
      prints what it can and cannot show, rather than leaving a red check against a blameless
      product.
    ends_when: >-
      ⚠️ REVISED. The ladder can only be seen working by a DELIVERABLE address, which means a real
      owner. That is now dated: the live owner's 75% rung, **2026-09-21T15:49Z**, the first
      check-in reminder this product will ever have sent.
      So this closes when that firing is OBSERVED - an `owner_checkin_reminder_first` row for the
      live owner, and the mail in the inbox - and the thing worth building BEFORE then is
      something that notices whether it fired, because the failure is silent by design and nobody
      will be watching at 15:49 on a Monday.

  - id: the-iam-wall-is-the-only-wall-nothing-schedules     # ROADMAP B16, residue
    owner: steve                          # a new IAM role is infrastructure; claude builds after
    opened: 2026-08-29
    what: >-
      `verify:kms` runs DAILY in CI (`.github/workflows/kms-wall.yml`, GitHub OIDC into
      `relay-kms-wall-ci`, no stored secret, proven green and red). `verify:iam` runs when somebody
      remembers. One `aws iam create-policy-version` putting `dsql:DbConnectAdmin` back is exactly
      what that check exists to catch, and it would be invisible until a human ran the command.
    the_obstacle_was_removed_and_nobody_noticed: >-
      Both script headers gave the same reason for being out of CI - "CI has no AWS credentials".
      `kms-wall.yml` disproved that on 2026-08-24 by reaching AWS from a runner with NO STORED
      SECRET. So the reason `verify:iam` is unscheduled stopped being true five days ago, and the
      wall this repo describes as the one that "leaves no trace in this repo" is the one still
      watched by nothing on a schedule.
    what_it_needs: >-
      An OIDC role scoped to the IAM READS in `lib/ops/iam-wall.ts -> CONTRACTS` -
      ListAttachedUserPolicies, ListUserPolicies, GetUserPolicy, GetPolicyVersion,
      ListGroupsForUser, ListAttachedGroupPolicies, ListGroupPolicies, GetRole and the role
      equivalents. Read-only, no write action anywhere. `kms-wall.yml` is the working template,
      including the trust-policy pin: `StringEquals` on
      `repo:sgharlow/relay:ref:refs/heads/master`, never `StringLike`.
    ends_when: >-
      `verify:iam` runs on a schedule against the real account with no stored secret, and has been
      seen both green and red - the same bar `kms-wall` met.

  - id: date-guards-has-never-been-red                        # ROADMAP B13, residue
    owner: steve                          # the blocker is a hook in ~/.claude, not a file in this repo
    opened: 2026-08-29
    what: >-
      `date-guards.yml` has run 8 times and failed 0. Its three sibling alarms were forced red on
      2026-08-29 (canary 33237399208, scheduler-monitor 33237979699, delivery-webhook-monitor
      33237980971); this one could not be, and the reason is structural rather than incidental.
    why_the_prescribed_proof_cannot_run: >-
      B13's method was: branch, plant a past-due gate, push, dispatch, watch it fail, delete the
      branch. `~/.claude/hooks/pre-push-check.sh` runs the full suite on every `git push` for
      relay and refuses a red one — and the planted violation makes the suite red BY
      CONSTRUCTION, because the guard this workflow runs IS a test in that suite. The local gate
      that stops broken code reaching GitHub also stops the deliberate breakage that would prove
      the date alarm fires. Attempted and confirmed, not assumed: the plant was made,
      `gates.test.ts` reported `d3-restore-drill — due 2026-01-15`, the push was refused with
      "Tests failed in relay.", and the plant was reverted.
    no_timezone_workaround: >-
      Checked, because CLAUDE.md documents a local-green/CI-red class for dates. `gates.test.ts`
      computes today from `new Date().toISOString()`, which is UTC on both sides, so no window
      exists in which the local suite is green and CI is red. That option does not exist.
    options: >-
      (1) Create the throwaway ref server-side with `gh api` on refs + contents, which never
      invokes `git push` and so never invokes the hook — fastest, and it routes around Steve's
      guard, so it is his call not Claude's. (2) Teach the hook to skip `throwaway/*` — a change
      to Steve's tooling rather than to this repo. (3) Wait: `verify-live-freshness` next fires
      ~2026-09-08 and the journeys dead-man ~2026-09-12, so if neither chain is run this workflow
      goes red on its own and the proof arrives free — slowest, and it proves the alarm by
      letting the thing it watches actually lapse.
    ends_when: >-
      A `date-guards` run has concluded `failure` with its `Explain a failure` step executed, by
      any of the three routes, and the run id is recorded in the workflow header beside the other
      three proofs.
    ruling_2026_08_29: >-
      Steve chose option (3), WAIT — neither route that goes around the pre-push hook is taken.
      ⚠️ And the same sitting chose to run both walk chains, which pushes the wait out: both
      freshness clocks were reset that evening, so `verify-live-freshness` next fires ~2026-09-12
      and the journeys dead-man ~2026-09-19. The natural red is therefore no earlier than
      2026-09-12, and only if nobody runs `verify:live` before then — which the D1 cadence exists
      to make sure somebody does. Said plainly because the two decisions were made in one sitting
      and they pull against each other: choosing to wait for an alarm to fire, and then feeding
      the thing that stops it firing. The honest reading is that this proof is now DEFERRED rather
      than scheduled, and if it still matters in mid-September it needs option (1) or (2).

  - id: shipped-but-unproven-release-guards                   # ROADMAP B15
    owner: claude                         # B15.4 is steve's: it is a ratification, not a build
    opened: 2026-08-28
    what: >-
      Three guards are shipped, believed correct, and have never been exercised against a real
      transition. B15.1 the J5-R4 owner-reminder ladder (cron-only), whose failure mode is a 200
      response, a healthy scheduler ledger, and no reminder — the exact silent shape this repo
      keeps catching elsewhere. B15.2 verifier deny / abstain / halt, never exercised. B15.4 the
      numbers under all of it.
    the_transition_nobody_has_watched: >-
      The sweep's ARMED → PENDING transition has never been OBSERVED for a real owner, disposable
      or otherwise. Proving it needs a disposable short-interval owner and the patience to let the
      interval actually elapse across hourly ticks — not a unit test that calls the function.
    b15_4_is_a_ratification_not_a_build: >-
      Three numbers were CHOSEN and documented, never measured: the reminder rungs at 75% and 90%
      of the interval, and the 12-hour cooling-off. A fourth question is open and unbuilt — an
      owner can name THEMSELVES as their own recipient or verifier. `isEligibleVerifier` already
      refuses to count an owner toward quorum, so the runtime hole is closed; what is open is that
      the row can still be created and the roster reads as fuller than it is.
    ends_when: >-
      Each of the three guards has been walked once against production with a disposable owner and
      the result recorded, AND Steve has ratified the three numbers (or replaced them) and ruled
      on owner self-naming. Until then `README.md`'s "verifier deny/abstain" rung overstates what
      is proven.
    b15_1_the_transition_has_now_been_WATCHED:
      date: 2026-08-29
      by: claude
      state: "LIVE-PROVEN. `npm run verify:sweep` (`scripts/e2e-sweep.ts`), 11/11 checks."
      what_was_observed: >-
        A disposable owner was created through the ordinary signup API, given a CONFIRMED verifier
        and an ARMED `emergency` release_state (v1), then backdated to overdue. Nothing local
        called the sweep - `CRON_SECRET` lives only in Vercel, so there is no way to. The walk then
        waited, polling once a minute, and at **2026-08-29T21:00:08Z the production Vercel cron
        ticked on its own** and the row moved `armed v1` -> `grace v3`.
        The hash-chained audit log records both halves, written by `system`:
        `release_transition_pending` then `release_transition_grace`. The OCC version advanced by
        exactly two, one bump per transition. This is the transition this entry says "has never
        been OBSERVED for a real owner, disposable or otherwise". It has now.
      the_resting_state_is_grace_and_that_is_correct: >-
        ⚠️ The walk FAILED on its first run asserting `state === 'pending'`, against a system doing
        exactly the right thing - kept here because it is an easy mistake to make twice.
        `GRACE_WINDOW_MS` is 0, so `armOne` transitions armed -> pending AND stamps a
        `grace_ends_at` that is already elapsed; `resolveElapsedGrace`, called by the SAME cron
        request immediately after the sweep, then advances pending -> grace. One tick, two
        transitions. PENDING is real but MOMENTARY: it exists in the audit chain and never in a
        poll, so asserting on the resting state was asserting on a race with the poll interval.
        The walk now reads the audit log, which is the honest witness.
      the_safety_check_that_had_to_come_first: >-
        `runHeartbeatSweep` is NOT scoped to one owner - it reads every active non-demo owner. So
        the walk refuses to run if anybody else is already overdue, because the tick it waits for
        would fire their release too. Verified read-only before anything was created: exactly one
        real owner exists (`sgharlow+relaycardtest@gmail.com`, 30-day interval, idle 19.6 days),
        and 0 owners were sweepable. A walk that fires a live customer's release is not a walk.
      🔴_a_dated_consequence_found_while_checking_that: >-
        The one real owner reaches 30 days idle on approximately **2026-09-09**, at which point
        this same sweep will find them overdue and arm their triggers - unattended, at night, for
        real. `npm run beta:status` reports their circle as EMPTY (nobody named), so what happens
        at quorum 0 with no verifiers to ask has never been established. This was not on any list.
        It is 11 days out and it is the live paying subscriber.
      what_this_does_NOT_close: >-
        B15.2 (verifier deny / abstain / halt) and B15.3 (the J6 4c escalation walk) are still
        unexercised, B15.5 (`verifier-context.ts` action fix) is unbuilt, and B15.4 remains
        Steve's ratification rather than a build. This entry stays OPEN. What changed is that the
        single most load-bearing claim under it - that the dead-man's switch actually fires - is
        no longer an inference from unit tests.
      cleanup: >-
        Four walk attempts in total (three failed on setup, one green). `npm run verify:orphans`
        after: 0 reserved-domain accounts remain, and the dangling-row total is 28 - unchanged
        from before the walks, so the cascade held across every attempt.

  - id: dr-copy-jobs-have-no-absence-alarm                    # ROADMAP B17
    owner: steve                          # ~$0.10/mo, 5-gate; claude builds after the ruling
    opened: 2026-08-28
    what: >-
      `relay-backup-absent` watches PRIMARY backup completions only. A cross-Region COPY action
      that silently stops raises no `COPY_JOB_FAILED` and no absence alarm — so the estate would
      keep reporting healthy backups while the DR half quietly stopped existing.
    the_gap_between_the_runbook_and_the_estate: >-
      The runbook claims cross-Region coverage. The alarms cover one Region. Nobody has re-read
      the LIVE `relay-backup-absent` alarm definition since it was created, so its actual scope is
      inferred rather than known — which is the same class of error the alarm exists to prevent.
    the_fix_is_small_and_that_is_the_point: >-
      An `AWS/Backup NumberOfCopyJobsCompleted` alarm on NotifyMe with `TreatMissingData: breaching`,
      forced to ALARM once to prove it fires. Roughly ten cents a month. It is Steve's only because
      it is an infrastructure change, and it belongs bundled into the D3 admin session rather than
      opening its own.
    ends_when: >-
      The copy-job alarm exists, has been forced to ALARM once and observed reaching a human, and
      the live `relay-backup-absent` definition has been READ and its scope recorded — or Steve
      records that single-Region backup alarming is accepted and the runbook is corrected to match.

  - id: no-secret-rotation-cadence-and-nothing-rotated        # ROADMAP B18
    owner: steve                          # B18.0 ratification; B18.1-3 co-pilot; B18.4-5 claude
    opened: 2026-08-28
    what: >-
      All 26 production keys have `createdAt == updatedAt`: nothing in this estate has ever been
      rotated. Six app secrets and the `relay-runtime` key date to 2026-06-24. The `autospecai`
      admin key dates to 2025-06-29 — 424 days old at the time of the sweep, and the most powerful
      credential in the estate.
    the_runbook_exists_which_is_the_uncomfortable_part: >-
      `docs/secret-rotation-runbook.md` was written and closed as a deferred item, and every row in
      it now carries a real date. A runbook nobody has executed is a plan, not a control — and the
      entry that closed it (`no-secret-rotation-runbook`) closed on the runbook existing, which was
      the honest scope at the time and is not the same as rotation happening.
    why_a_cadence_before_a_rotation: >-
      B18.0 is "ratify a cadence OR record 'none until first customer'". Either is legitimate and
      the second may well be right for a pre-revenue product. What is not legitimate is the
      current state, which is neither — no cadence and no decision not to have one, so the age
      just accumulates and nobody is accountable for it.
    ends_when: >-
      A cadence is ratified or "none until first customer" is recorded WITH a revisit, AND the
      `autospecai` admin key has been rotated on a two-keys-valid overlap. ⚠️ No secret in chat,
      ever — Claude executes on request against an env var or a gitignored path.
    note: >-
      ⚠️ Do NOT invent a deadline for this. The ROADMAP row says so explicitly. An invented date
      on a credential item produces either a rushed rotation or a missed date that teaches everyone
      to ignore the next one.

  - id: the-iam-template-can-re-open-the-wall                 # ROADMAP B20
    owner: steve                          # the ruling; claude edits
    opened: 2026-08-28
    what: >-
      `infra/iam-policy.json` still grants `dsql:DbConnectAdmin` and `kms:DescribeKey`. Re-applying
      the template — the ordinary thing to do on a re-provision — would silently undo the
      2026-08-16 least-privilege cutover.
    why_the_audit_would_not_catch_it: >-
      The offending statement's Sid does not begin with `Dsql`, and the cutover document's audit
      is Sid-filtered on that prefix. So the audit prints `[]` and reads as clean over a template
      that re-opens the wall. A guard whose filter cannot see the thing it guards against is worse
      than no guard, because it is trusted.
    ends_when: >-
      The template matches the live v2 shape, the README says what it grants and why, and Steve
      has ruled on the one genuinely open sub-question — whether the runtime identity keeps
      `kms:DescribeKey` at all. The Sid-filtered audit is either widened or replaced in the same
      change, because leaving it is leaving the blind spot.

  - id: the-domain-can-lapse-without-anyone-noticing          # ROADMAP B35
    owner: steve
    opened: 2026-08-28
    what: >-
      `relaystandby.com` is registered at Cloudflare. Nobody has confirmed auto-renew is ON with a
      current card. If it lapses, every custodial promise this product makes fails at once and in
      the worst possible way: silently, to the people who were told to rely on it.
    why_this_is_in_the_register_at_all: >-
      It is a two-minute check, which is exactly why it never gets done and never gets written
      down. Relay's failure mode is not a bug — it is an owner's family reaching a domain that has
      expired. A dead-man's switch on the alarms (B12) does not cover the registrar.
    ends_when: >-
      Auto-renew is confirmed ON with a card that has not expired, the expiry date is recorded
      here, and — if a mechanism exists that does not depend on a human remembering — the renewal
      failure raises an alarm on the same path as everything else.

  - id: no-budget-alarm-on-the-aws-estate                     # ROADMAP B36
    owner: steve                          # 5-gate; default yes
    opened: 2026-08-28
    what: >-
      There is no AWS Budget on relay's estate. A runaway cost — a misconfigured Synthetics canary,
      a KMS request loop, a restore drill left running — is discovered by reading a bill.
    the_shape: >-
      A Budget at roughly 2× the fixed monthly cost, alerting to SNS NotifyMe: the same path B12
      and B17 use, so a human actually receives it. Default yes; it belongs to a sitting with the
      other console items rather than opening one of its own.
    ends_when: >-
      A budget alarm exists and has been proven to reach a human once, OR Steve records that the
      estate is small enough not to warrant one — with the figure that makes that true, so the
      next reader can check whether it still is.

  - id: the-privacy-page-may-be-missing-two-subprocessors     # ROADMAP B38
    owner: steve                          # a ruling about a published legal page
    opened: 2026-08-28
    what: >-
      `/privacy` does not name Cloudflare (mail forwarding) or Google (Gmail). Both handle mail
      that carries product content. The question is whether they belong on the subprocessor list.
      Default answer: yes.
    why_it_is_not_merely_paperwork: >-
      This is the same class as `stripe-is-missing-from-the-subprocessor-list`, which was opened
      and closed for the same reason: a published privacy page is a promise about who touches the
      data, and a promise that omits a party who touches it is not an oversight, it is wrong. The
      product's entire proposition is custodial trust.
    ends_when: >-
      Either both are named on `/privacy`, or Steve records why a forwarder and a mailbox provider
      are out of scope for this list — a defensible position, but one that has to be written down
      rather than assumed.

  - id: releases-may-or-may-not-be-billing-gated              # ROADMAP E4.1
    owner: steve                          # a ruling, and it has a hard date
    opened: 2026-08-28
    what: >-
      `assertCanRelease` guards ONE of the four ARMED → PENDING paths — the manual Initiate. It
      does not guard the missed-check-in sweep, owner consent to an access request, or silence on
      a challenge. So "releases are billing-gated" is true of a quarter of the ways a release can
      happen, and nobody has decided whether that is the design.
    why_it_has_to_be_ruled_before_the_paywall_flips: >-
      E4.2 flips `TIER_LIMITS.free.canRelease` at the first revisit from 2026-10-01. Flipping it
      without this ruling ships whichever behaviour the code happens to have, and the answer
      differs by a factor of four in how often a free owner meets a paywall — at the worst possible
      moment, since three of the four paths are the ones that fire when an owner is unreachable.
    the_documents_are_silent_and_one_must_change: >-
      `/terms` and guide §2.7 say nothing about paths 2–4. Whichever way this is ruled, one of them
      is edited in the same commit as the flip. Today the whole question exists only in a `docs/`
      file, which is why it is here.
    ends_when: >-
      Steve records "only the manual path" or "all four", and the corresponding sentence lands in
      `/terms` or the guide in the same commit as the `canRelease` flip.
    revisit: 2026-10-01

  - id: sales-tax-has-never-been-considered                   # ROADMAP E7
    owner: steve
    opened: 2026-08-28
    what: >-
      Relay charges $119/yr in live-mode Stripe and nobody has looked at sales tax: not whether to
      register, not where the thresholds are, not whether Stripe Tax should be switched on.
    why_it_is_here_rather_than_ignored: >-
      "Accepted until first revenue" is a perfectly reasonable answer for a product with one
      subscriber who is the owner. It stops being reasonable the moment G1 passes, and that is the
      moment nobody will be thinking about tax. Recording the acceptance now, with a revisit tied
      to first arms-length revenue, is the cheap version of this.
    ends_when: >-
      Steve records one of: registered; Stripe Tax enabled; or "accepted until first revenue" WITH
      a revisit. Undated acceptance is the illegitimate outcome, as everywhere else in this file.

  - id: fr9-demo-simulate-is-reachable-by-nobody              # ROADMAP D25
    owner: steve                          # the ruling; claude executes either branch
    opened: 2026-08-28
    what: >-
      `/api/demo/simulate` is exercisable by no account — zero demo-flagged users exist, and the
      cluster holds exactly one `totp_secret` — yet it is code-reachable: `TriggersPageClient.tsx`
      posts to it from a `SimulatePanel` rendered when `isDemo`, and there is a real CAS write path
      behind it.
    why_a_route_nobody_can_reach_is_still_a_finding: >-
      It makes the FR9 build state dishonest in both directions. Claiming FR9 is built overstates
      it, because nothing can run it; deleting it quietly understates what was built. And a
      privileged write path that no test exercises and no user can reach is the kind of thing that
      becomes reachable by accident three refactors later.
    the_two_branches_are_both_legitimate: >-
      Retire it — route, `route.test.ts`, the `SimulatePanel` / `isDemo` plumbing,
      `scripts/demo-run.ts` and the CLAUDE.md reset-demo instruction, all in one change. Or keep
      it and make it reachable by a demo account that actually exists. What is not legitimate is
      the present state, where the docs and the build disagree.
    ends_when: >-
      Steve picks a branch and it is executed in full, including the CLAUDE.md instruction, which
      is the piece most likely to be left behind.

  - id: nothing-turns-red-when-a-revisit-lapses               # ROADMAP A0.dm + E4.4
    owner: steve                          # the ruling; claude builds, effort S
    opened: 2026-08-28
    what: >-
      No guard reads a `revisit:` field. On 2026-09-12 the owner's-vault revisit lapses and nothing
      goes red; on 2026-10-01 the beta-free-release revisit lapses and nothing goes red. Two dates,
      one missing mechanism — which is why they are one entry.
    why_this_is_the_load_bearing_one: >-
      This file's entire discipline rests on dated revisits, and a date that nothing enforces is a
      note. `gates.test.ts` already reads `gates[].due` for free, which is why every dated thing in
      this repo that actually fires is a gate. Everything recorded as a `revisit:` — and there are
      many — is currently on the honour system.
    the_two_options_and_their_costs: >-
      (a) promote A0 to a dated `gates:` entry, which `date-guards` reads for free — but that
      promotes the owner's vault PAST report-bridge in the ranking, which contradicts the 2026-08-24
      precedence ruling. (b) teach a guard to read `revisit:` on `deferred` and `ratified` entries,
      which costs more and is the general fix. This plan leans (b) precisely because there are two
      dates and there will be more.
    ends_when: >-
      A guard fails when a `revisit:` date passes with no recorded disposition, proven by planting
      a past-due revisit on a throwaway branch and watching the guard go red — the same standard
      B13 demands of every other alarm. Wired is not proven.
    revisit: 2026-09-12

  - id: no-entity-and-no-insurance                            # ROADMAP G6
    owner: steve
    opened: 2026-08-28
    what: >-
      Relay operates as an individual. `ratified.relay-operator-is-an-individual` records that as a
      deliberate choice, and it carries NO revisit — so the choice, once made, has no trigger that
      re-opens it.
    why_a_deliberate_choice_still_needs_a_trigger: >-
      The choice is right today and becomes wrong on a specific event: arms-length money moving, or
      a distribution partner running diligence. Both are things this project is actively trying to
      cause — A8 and A6 respectively. A decision that is correct until the moment the project
      succeeds needs the success to be its trigger, or it will be revisited by a counterparty
      rather than by Steve.
    what_would_actually_be_needed: >-
      Not researched here, deliberately: an entity form and E&O / cyber cover appropriate to a
      custodial service holding other people's credentials. Researching it before there is a
      counterparty asking is the horizontal-build shape the demand gate exists to stop.
    ends_when: >-
      A trigger is attached to `ratified.relay-operator-is-an-individual` — "on the first
      arms-length payment, or the first partner diligence request, re-decide" — so that the next
      person to read it knows what re-opens it. Forming an entity is NOT required to close this.

  - id: the-lapse-notice-is-wired-not-live-proven              # "E1-prime"
    owner: steve
    opened: 2026-08-20
    what: >-
      lib/billing/lapse-notice.ts shipped 2026-08-19 closing a-failed-renewal-tells-the-owner-
      nothing: `notifyRenewalFailed` and `notifySubscriptionLapsed`, deduped on the Stripe INVOICE
      id via audit_log (`detail->>'stripe_id'`), ordered check-then-send-then-record.
      ⚠️ THIS ENTRY SAID "EVENT id" UNTIL 2026-08-21, AND THE DIFFERENCE IS THE WHOLE TEST.
      Stripe's automatic retries carry a NEW event id for the SAME invoice, so event-id dedupe
      would let a retry through and send a second email — the invoice key is the stronger design
      and it is what the code does. Anyone proving this entry from the register alone would have
      invented a second event with a fresh id, watched nothing send, and recorded a pass for a
      mechanism they never exercised. docs/e1-stripe-lapse-proof.md had it right throughout. Every rule is unit-proven. The wiring
      has never been exercised against Stripe.
    why_it_matters: >-
      On this repo's own claim ladder that is `wired`, not `live-proven`, and the distinction is
      the whole reason the ladder has both words: a response shape that has never met the real API
      is a guess. It matters on a date — ratified.beta-free-release is revisited 2026-10-01, and
      the moment `TIER_LIMITS.free.canRelease` flips to false, an expired card becomes a BLOCKED
      RELEASE. An untested notification is the only thing standing between a failed renewal and a
      family finding out at the worst possible moment.
    ends_when: >-
      A test-mode `invoice.payment_failed` is fired at the production webhook and exactly one
      email is confirmed received; THEN the same event is re-delivered and nothing is sent.
    the_half_that_gets_skipped: >-
      ⚠️ The re-delivery. The first half proves mail goes out, which is the satisfying half and the
      one that feels like the test. The dedupe is the half that is only ever exercised by doing it
      twice, and Stripe retries failed webhooks by design — so the untested path is also the one
      production will take on an ordinary day.
    attempted:
      date: 2026-08-21
      by: claude
      outcome: "HALF PROVEN, AND STILL OPEN. Do not read this as closed."
      what_IS_now_live_proven: "The notice itself, against the PRODUCTION cluster and the real
        mailer, by calling notifyRenewalFailed directly:
          call 1 -> `undelivered`, and exactly ONE audit_log row written
                    (stripe_id = in_E1PRIME_DIRECT_20260821, delivered=false);
          call 2, SAME invoice id -> `duplicate`, and NO second row.
        That is both halves of this entry's own ends_when for the dedupe — including the half it
        names as the one that gets skipped — measured rather than asserted.
        ⚠️ `undelivered` rather than `sent` because a dev-mail guard REFUSED the send: 'this is not
        a production environment and the address is not in DEV_MAIL_ALLOWLIST'. That guard working
        is a good result, and it means no real mail was sent from a laptop; it also means DELIVERY
        to an inbox is NOT proven here. The owner address on file is a +subaddressed test inbox."
      what_is_NOT_proven: "The WEBHOOK WIRING — which is the half that matters in production.
        Driven through the real route with a correctly Stripe-signed `invoice.payment_failed`, the
        endpoint answered 200 {received:true} and wrote NOTHING, on nine separate attempts.
        Instrumentation showed the route resolving the invoice id and the subscription id
        correctly, `ownerIdForSubscriptionId` returning rowCount=1 with the right owner, `sendOnce`
        being ENTERED with the right arguments, and `noticeAlreadySent` returning n=0 — and then no
        audit row and no mail-refusal log. That is precisely the shape this file warns about
        elsewhere: a clean 200 for an event that told nobody anything."
      why_it_was_not_settled: "THE LOCAL DEV SERVER CANNOT BE TRUSTED FOR THIS TEST ON THIS
        MACHINE, and that was proven rather than assumed: the running server printed a debug line
        that had already been DELETED from the file, and later ignored a newly added one while
        honouring an older one. `next dev` (Turbopack) is serving a stale module graph here, and
        `rm -rf .next` plus a full restart did not reliably clear it. Every conclusion drawn from
        the HTTP leg is therefore untrustworthy IN BOTH DIRECTIONS — it is not evidence of a
        product defect, and it is not evidence of health."
      next_step: "Prove it against the DEPLOYED build, not a laptop. Two options, both Steve's:
        (a) confirm in the Stripe dashboard that endpoint we_1U2IIGGs40KMmT4XAIradLoE is subscribed
            to `invoice.payment_failed` at all — if it is not, no amount of correct code fires, and
            this is the cheapest question in the lane;
        (b) then a real (or dashboard-redelivered) event against production, checking for exactly
            one mail and exactly one audit row, then a redelivery checking for silence.
        ⚠️ Until (a) is answered, the wiring cannot be proven by any local means."
      also_found: "`ratified.beta-free-release`'s 2026-10-01 paywall flip has this as a stated
        precondition. It is not met."
    attempted_2:
      date: 2026-08-21
      by: claude
      outcome: "STILL OPEN — but the blocker named in attempted.next_step (a) is CLOSED, and the
        documented test method was found to be incapable of proving anything."
      question_a_ANSWERED: "NO. Endpoint we_1U2IIGGs40KMmT4XAIradLoE enabled exactly three events —
        checkout.session.completed, customer.subscription.updated, customer.subscription.deleted.
        `invoice.payment_failed` was ABSENT, so Stripe never POSTed it and the handler at
        src/app/api/stripe/webhook/route.ts:423 was unreachable code in production. The same
        account's report-bridge endpoint (we_1TQJx6...) DID subscribe to it, so this was an
        omission on relay's endpoint alone, not an account-level constraint.
        ✅ FIXED 2026-08-21 and verified by independent re-read, not by the update's own echo.
        ⚠️ TRAP: `--enabled-events` REPLACES the list. The update passed all four events; passing
        only the new one would have silently dropped checkout and both subscription events."
      the_documented_method_cannot_work: "docs/e1-stripe-lapse-proof.md's Steps 1-3 and its
        four-box table cannot be ticked from a `stripe trigger` run, and this is now measured
        rather than reasoned. `stripe trigger invoice.payment_failed` runs an invoiceitem+invoice
        fixture — a ONE-OFF invoice, not a subscription renewal. On the real generated event
        evt_1U74tnGs40KMmT4X2HnKgbPE: top-level `subscription` ABSENT, `parent` ABSENT. So
        `subscriptionIdOnInvoice` returns undefined, the handler breaks on its FIRST line, and the
        route answers 200 having written nothing — which is correct behaviour and is
        indistinguishable from broken wiring. Second, independent reason: production holds exactly
        ONE subscriptions row and it is a LIVE-mode id (sub_1U2MHx..., active, the owner's own
        card); a test-mode trigger mints a test-namespace id that can never match it."
      verified_in_passing: "Two things worth keeping, both read rather than assumed.
        (1) THE EXTRACTOR IS VERSION-ROBUST, AND IT NEARLY MATTERED. The endpoint's `api_version`
            is null, so Stripe delivers the ACCOUNT DEFAULT — measured as 2026-01-28.clover on the
            captured event — while lib/billing/stripe.ts pins 2026-07-29.dahlia for OUTBOUND calls.
            Different shapes. `subscriptionIdOnInvoice` reads BOTH candidates
            (parent.subscription_details.subscription, then top-level subscription), so either
            resolves. Had it read only the dahlia path, a real renewal failure would be dropped in
            production AND the documented test would still have 'passed' by writing nothing.
        (2) THE DEDUPE IS PROVABLE WITHOUT A MAILBOX. `sendOnce` writes the audit row REGARDLESS of
            delivery (detail.delivered:false) and returns 'undelivered'. The mail leg and the
            dedupe leg are separately testable; the four-box table conflates them."
      what_is_still_unexplained: "attempted's nine-attempt symptom stands and is NOT explained by
        the above — that run used a SPLICED, correctly-signed event carrying a RESOLVABLE
        subscription id and reached `sendOnce` with n=0 from the dedupe check, then wrote no row
        and logged no refusal. Every branch out of sendOnce writes something, so that is not a
        state the source can produce. The stale-module explanation remains the most likely and is
        still unproven. NEXT ATTEMPT MUST FIRST ESTABLISH WHICH BUILD IS ANSWERING — a structural
        marker in the RESPONSE BODY, not a log line, since logs were the thing that disagreed."
      next_step: "See docs/e1-stripe-lapse-proof.md section 5. Three honest routes, none a CLI
        trigger: (1) a real live renewal failure — proves everything, not schedulable;
        (2) a test-mode subscription created through relay's OWN checkout so
            checkout.session.completed writes a real subscriptions row, then fail that invoice —
