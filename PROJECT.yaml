# Known defects accepted for now, with the trigger that ends the acceptance.
#
# Distinct from `ratified` above, which records DECISIONS. This records DEBT: things
# measured, understood, and deliberately not fixed yet. An item leaves this list by
# being fixed or by being re-argued — not by being forgotten, which is what an
# unwritten "we should probably..." always becomes.
#
# BOTH ENTRIES CLOSED 2026-08-13, the day after they were opened, when Steve called
# for them to be fixed rather than carried into beta:
#
#   unbounded-request-body — `readJson` now caps at 128 KB and answers 413, checking
#     BOTH the declared Content-Length and the stream as it arrives, because the
#     first is a claim by the sender and a chunked request declares nothing.
#     /api/import carries an 8 MB override for a password-manager export. Proven
#     against a running server on the sharp case: a 500 KB `reason` on
#     /api/access-requests is refused. lib/http/read-json-limit.test.ts.
#
#     🔴 THAT ENTRY WAS WRONG THE DAY IT WAS WRITTEN, corrected 2026-08-13. The
#     cap was closed for the twenty-six handlers that CALL `readJson` and open
#     for sixteen that called `req.json()` directly — including
#     POST /api/vault/items and PUT /api/vault/items/[id], the two largest
#     payloads in the product, and POST /api/kms/unwrap, which parses a body
#     before it authenticates because the recipient token may arrive inside it.
#     read-json-limit.test.ts proved the helper refuses an oversized body;
#     nothing asserted that a route USED the helper.
#
#     This is the failure this file's own claim-discipline rule exists to catch,
#     in the file the rule names as the source of truth, and it is recorded
#     rather than quietly overwritten for the same reason monetization_path was.
#     A cap that lives in a helper is a cap on the helper.
#
#     NOW ACTUALLY CLOSED: all sixteen converted (vault routes take a measured
#     1 MB override; six tolerant handlers use `readJsonOptional`, which keeps a
#     missing or malformed body meaning `{}` and adds only the 413). The
#     deliverable is lib/ops/body-limit.ts — no route may read a body without a
#     bound, ALLOWED_RAW entries must argue for themselves, and a planted
#     violation proves the check can fail. Verified on production 2026-08-13:
#     200 KB refused 413, an ordinary body still 400s from the app, a bodyless
#     POST still 401s rather than 400, and /api/incident answers 204 to
#     everything including the refusal.
#
#   muted-text-contrast — `--ink-faint` darkened to #71675a, a new `--paper-faint`
#     added for the ink sidebar (no single value can clear 4.5:1 against both
#     grounds — the arithmetic is in the test), and `--ochre-deep` added for the
#     active nav fill. axe now reports ZERO serious/critical violations across all
#     ten audited pages, where every signed-in screen failed before.
#     lib/ops/contrast.test.ts pins the ratios in CI; scripts/a11y-audit.mjs checks
#     what is actually rendered.
#
# The section stays because the next honest entry belongs here and not in a new
# file. REOPENED 2026-08-14 by the production-bar pass (the six-lens audit +
# fixes, iterations 1-9): four items measured, understood, and deliberately not
# fixed in that pass. Everything else the audit confirmed WAS fixed — these are
# the survivors, each with the trigger that ends its acceptance.
# EMPTY as of 2026-08-15, and the empty list is written out rather than left
# implied: `deferred:` with only comments under it parses as null, and a reader
# — human or script — cannot tell null from "nobody has looked". [] says the
# list was looked at and is genuinely clear.
#
# Seven items were carried here at the start of the day; all seven are closed
# below, four from the 2026-08-14 audit and three opened and shut on 08-15. The
# next honest entry belongs here and not in a new file.
#
# REOPENED 2026-08-17 with one item; that item CLOSED 2026-08-18 and is kept as a
# comment below the live list, in this file's usual shape. THREE items are open in
# its place, and none of them is the thing it was blocked on. The migration landed;
# what is left is that the feature it bought is opt-in-by-discovery (D3), was cut
# to one question on purpose (D2), and the gate that proved it still cannot run in
# CI (D4). Written out as entries rather than left in a sprint report, because a
# sprint report is the record of a day and this file is what the next session reads.
deferred:
  - id: secret-kinds-declaration-is-opt-in-by-discovery      # "D3"
    owner: claude
    opened: 2026-08-18
    closed:
      date: 2026-08-18
      what_shipped: "The readiness banner ASKS. Under the preparedness sentence it names up to two
        items that matter, have an access rule and have never been asked about, each with both
        answers as one tap — `Needs a code` and `Password is enough`, offered with equal weight
        because a prompt that only ever offers the alarming answer teaches an owner it is an
        accusation. Answering re-reads readiness, so the sentence moves in the same breath."
      the_second_state: "`unchecked` was one number over two situations with two different
        remedies, and splitting it was part of the work rather than a refinement of it. `unasked`
        is a question one tap answers. `undeclared` is an item the owner HAS answered where no
        client ever declared what the entry holds — every item created before 2026-08-18 — and NO
        tap can resolve it: the server cannot read ciphertext and an update replaces the payload,
        so re-saving the item is the only act that records what it holds. It gets a sentence
        saying exactly that, and no button, because a button there could not work.
        A third bucket, `unresolved`, is counted so the three sum to the old total — an item that
        falls out of both the sentence and the prompt is the silent falsehood this rule exists to
        remove."
      # 🔴 THE DEFECT THE PROMPT FOUND, WHICH WAS NOT THE PROMPT.
      found_while_verifying: "assessReadiness selected `id, title, criticality,
        is_root_credential` from vault_items and dropped the three usability columns AGAIN in its
        own projection — two independent omissions, so fixing either alone would have changed
        nothing. They were optional on `PreparednessInput`, so it compiled. Every item reached the
        rule as `unknown`, `checkingStarted` was permanently false, and THE ENTIRE MIGRATION-035
        CORRECTION WAS INERT ON THE BANNER from the day it shipped — the one surface that renders
        the sentence. Nothing was red: the unit tests supply the columns themselves, and so does
        `verify:factors`, so both proved the rule through a path the product does not use. It took
        rendering the prompt and watching it ask about an item that had just been answered.
        Fixed, and made structural: the columns are REQUIRED on that input now, so a caller that
        forgets them fails the build. The tolerance belongs to the value, which may be null, not
        to the key, which a caller has to think about."
      also_found: "`scripts/disposable-owner.ts` — the fixture the accessibility audit runs
        against — fired POSTs and read none of the responses. The vault create contract gained a
        required `secret_kinds` (D1) and two closed enums had drifted, so every item creation had
        been refused 400 in silence: THE AUDIT WAS SWEEPING 36 EMPTY PAGES AND REPORTING THEM
        CLEAN. It now checks every setup call and creates the access rules that make a banner
        render at all, since an owner with items and no rules is a state no real owner stays in."
      proof: "`verify:live` five-walk chain exit 0 (measured directly, not through a pipe);
        `verify:factors` 15/15 twice; `npm run gate` exit 0; axe 0 serious/critical across 36
        pages WITH the prompt on screen — re-run after proving the earlier sweep had seen nothing;
        and the behaviour watched in a browser against the production cluster: two items prompted,
        one answered, the sentence moving from `could reach both of the things that matter —
        though nobody has checked whether 2 of them need a code as well` to `could reach 1 of the
        2 things that matter — though nobody has checked whether one of them needs a code as
        well`, with `Missing: a code for Checking account` appearing and the answered item leaving
        the prompt. Disposable account closed, HTTP 200."
      guards: "lib/ops/the-question-is-asked.test.ts — the banner names the unasked items, offers
        BOTH answers, says what to do about the undeclared ones, every write path goes through one
        `setFactorsRequired`, and the readiness query selects the columns the rule reads. Plus a
        type-level `@ts-expect-error` test that fails the build if omitting those columns ever
        compiles again. All red-green verified by breaking what they guard."
      what_it_does_not_do: "SUPERSEDED — CLOSED 2026-08-18 (later the same day). Kept verbatim
        because the fix found the note itself was wrong, and about the half that mattered.
        It read: \"The vault row's own control does not re-render when the banner is answered on
        the same screen — the list is a separate component with its own fetch, so the row still
        reads `Needs a code?` until the page is reloaded. The sentence is authoritative and
        correct; the row is stale. Left rather than wired together, because a cross-component
        refresh is a new pattern in this codebase and this is a cosmetic disagreement, not a wrong
        number. Worth fixing if anyone reports it.\""
      residual_closed:
        date: 2026-08-18
        # 🔴 IT WAS RECORDED AS ONE DIRECTION AND IS ACTUALLY TWO, which is what
        # turned it from cosmetic into a wrong number on the authoritative surface.
        the_note_was_wrong: "`ReadinessBanner` lives in `(owner)/layout.tsx` and `VaultDashboardClient`
          is the page; each refreshes only itself. The boundary breaks SYMMETRICALLY. Answering on
          the ROW left the BANNER — the surface this file called authoritative and correct — showing
          a preparedness sentence the owner had already superseded. `could reach 2 of the 3 things
          that matter` stayed on screen after the answer that made it 1 of 3. Only the banner→row
          direction was recorded, so the worse half was the undocumented half."
        fix: "One announcement from the seam both write paths already share (`setFactorsRequired` in
          lib/vault/declare-factors.ts), fired only AFTER the save succeeds; both surfaces subscribe.
          Put there rather than in each caller so a THIRD place to answer inherits it without its
          author knowing the other surfaces exist — the same reasoning that created that module.
          An EventTarget owned by the module, NOT `window`: vitest runs this repo with
          `environment: 'node'` and there is no jsdom dependency, so a window-based bus could only
          be written behind a `typeof window === 'undefined'` guard — under which every test of it
          passes by taking the branch that does nothing. That is the guard-on-the-wrong-gate shape
          this repo keeps finding, so the bus under test is the bus that ships."
        proof: "Live browser walk against the running app on a seeded disposable owner, BOTH
          directions: banner answer → unanswered rows 3 → 2 with no reload; row answer → the
          sentence moved `2 of the 3` → `1 of the 3` and the banner prompts 2 → 1, with no reload.
          ⚠️ NEGATIVE CONTROL RUN: with the announcement removed the same walk fails both
          assertions (3 → 3, prompts 2 → 2), so the walk sees the defect rather than passing on
          a fixture. Nine unit tests in declare-factors.test.ts, each red-green verified by
          breaking what it guards — announce-before-the-ok-check, a no-op unsubscribe, an event
          rename, and removing the announcement entirely."
        disposable_accounts: "Two owners created on `.test` (RFC 6761 reserved, refused at the send
          seam) and both closed, HTTP 200."
    superseded_note: "The entry below is what was open. Kept whole rather than deleted."

    what: "The owner's 'does this account need a code as well?' control is LIVE on the
      vault row, and nothing anywhere ASKS the question. It is reachable only by an
      owner already looking at the item they would have had to doubt first."
    why_it_matters: "assessPreparedness can now say the true thing - that a password
      stored behind a coded door means Sarah receives a password and a locked door -
      but only for an item somebody declared. Every item created before 2026-08-18
      reads `unknown`, which SUPPRESSES the clause entirely. So for every plan that
      already exists the on-screen sentence is exactly as wrong as it was before the
      migration, and the owners whose plans are wrong are the least likely to go
      looking. The measurement the migration was for does not exist until this does."
    structural_note: "It cannot be backfilled, ever. The server cannot read ciphertext,
      so nothing but a re-save through the browser can declare what an item holds.
      This is not a migration somebody can run later; it is a question that has to be
      asked. Stated in the use-case doc's limits as well."
    then: "prompt on the items that matter rather than waiting to be found. Scored 4.5
      and named the #1 recommendation of the 2026-08-18 sprint that shipped the wiring."
    ends_when: "owners are ASKED rather than found, or Steve rules that preparedness
      keeps its current definition and the on-screen claim is reworded to match -
      either closes it, forgetting does not."

  - id: requirable-factors-beyond-the-authenticator-code     # "D2"
    owner: claude
    opened: 2026-08-18
    what: "`factors_required` accepts the authenticator-code question ALONE. sms, email,
      passkey, hardware_key and security_questions are defined and not collectable."
    why_the_cut_was_deliberate: "S2 was larger than L taken whole, so the thinnest
