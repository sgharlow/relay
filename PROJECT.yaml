  #     entry planned, because two of its own premises turned out to be wrong.
  #
  #     🔴 IT SAID "~9 arbitrary font sizes". The real count was 211 across 30
  #     files. The old measurement had only ever looked at `text-[17px]`-style
  #     classes and non-token `fontSize:` values and had missed the inline
  #     literals, which were the larger half. A debt item whose size is wrong by
  #     an order of magnitude is not a debt item, it is a wrong belief with a
  #     ticket number — and the ceiling it proposed would have been set from
  #     that number.
  #
  #     🔴 IT SAID "every value in use was audited readable". True at the
  #     DEFAULT font size and beside the point at any other. Measured in a real
  #     browser on /security with the root raised to 20px — a reader who has
  #     enlarged their text — every rem token scaled (16→20, 14→17.5, 48→60) and
  #     every px literal did not (17px stayed 17px, 15px stayed 15px). Twenty-one
  #     elements on that page were frozen against the reader's own accessibility
  #     setting. That makes this a CC8 defect, not tidiness, which is what
  #     changed the answer from "ratchet it" to "fix it".
  #
  #     211 → 11, and the 11 are the two error boundaries that must NOT resolve
  #     tokens (global-error.tsx replaces the root layout, so `var(--tN)` there
  #     resolves to nothing). A codemod did rewrite both and it was reverted the
  #     same hour on the strength of the headers those files already carried;
  #     lib/ops/type-scale.test.ts now records them as the only exemptions, with
  #     the reason, so the next codemod is stopped by a test instead.
  #
  #     Ties went to each mode's own ratified floor — access up to t4 (18), owner
  #     down to t3 (16) — rather than uniformly up, because globals.css specifies
  #     both and rounding everything up would have quietly re-specified owner
  #     mode as dense-but-18px on the way past. Every change is ≤2px.
  #
  #     VERIFIED, signed-out half only: axe clean across 18 pages, /security
  #     renders with no horizontal overflow at 320×568, computed sizes checked
  #     against the tokens in a live browser. ⚠️ OWNER MODE WAS NOT AUDITED —
  #     scripts/a11y-audit.mjs could not mint a session (no demo@relay.test on
  #     the cluster) and says so itself. Eight owner screens are unmeasured.
  #
  # ── OPENED 2026-08-15 by the same pass. What it built and did not prove, and
  # what it found it could not measure. Recorded here rather than left implicit,
  # because the four items above show what an unwritten "we should probably..."
  # becomes.
  #
  # ── ALL THREE CLOSED 2026-08-15, same day they were opened ────────────────
  #
  # They were written as things a dogfood would have to prove later. On reading
  # them back, two of the three were provable immediately — the blocker in each
  # case was an assumption, not a missing person:
  #
  #   step-up-not-dogfooded — "needs a real authenticator" was true and did not
  #     mean "needs a human". The signup API returns the TOTP secret inside the
  #     otpauth URL it issues, so a harness can hold a real second factor for an
  #     account it just created. DOGFOODED: scripts/scratch-stepup-e2e.ts walks
  #     a disposable owner through every branch over HTTP — 17/17.
  #     Export and recovery-codes REFUSED on an ordinary session with 403
  #     StepUpRequired (never 401) · factors reported {totp:true,passkey:false} ·
  #     a wrong code refused 400 · a correct one elevates and sets the cookie ·
  #     BOTH actions then pass on the SAME elevation, so the window is a window ·
  #     DELETE revokes and export is refused again, which proves the ROW and not
  #     the cookie decides · a mistyped confirmation does NOT burn the elevation ·
  #     closure spends it · the deleted account's session answers 401.
  #
  #   multi-owner-access-not-live-proven — "no real multi-owner contact exists"
  #     was true of the beta and irrelevant: the product can build one. Two
  #     disposable owners, one contact who claims BOTH standby roles (the second
  #     linking to the same account rather than forking one), both owners firing
  #     an emergency. LIVE-PROVEN: scripts/scratch-multiowner-e2e.ts — 14/14.
  #     The contact is offered both by NAME, the order is stable between
  #     requests, and each choice reaches that owner's own release.
  #
  #     🔴 AND IT FOUND A DEFECT NO TEST COULD SEE. `?owner=` naming somebody the
  #     contact does not stand by for fell through to the closure branch and
  #     answered "That access has closed because they checked back in" — to a
  #     contact with TWO releases open at that moment. The bug was in which
  #     BRANCH execution reached, and every test on that path mocks the resolver,
  #     so the fall-through was invisible. A selector that matches nothing is a
  #     bad selector, not an ending; it now re-asks the question, and the closure
  #     branch is not consulted while anything is open.
  #
  #   owner-mode-a11y-unaudited — the cause was not a missing credential. The
  #     audit had `demo@relay.test` HARDCODED, so when that account went it fell
  #     into the skip branch on every run and reported 18 pages where CC8 records
  #     21. Now `A11Y_OWNER_EMAIL`, pointed at a disposable owner.
  #     MEASURED: 0 serious/critical across 26 pages — 18 signed-out AND all 8
  #     owner-mode screens, including the ones the type-scale migration touched.
  #     That is more coverage than the 21 CC8 records, so CC8's number is now the
  #     stale one; re-run before quoting either.
  #
  # ⚠️ The harnesses create and delete DISPOSABLE accounts on the production
  # cluster — the practice the 2026-08-08 and 2026-08-13 sweeps already used.
  # Every address is on an RFC 6761 reserved domain, refused at the send seam by
  # lib/notify/email.ts, and the scripts now assert that themselves so a later
  # edit cannot point one at a real domain. Confirmed against the dev log: ZERO
  # send attempts across all three walks. No sending reputation was spent.
