<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48"
     role="img" aria-labelledby="rm-t rm-d">
  <title id="rm-t">Relay</title>
  <desc id="rm-d">A filled point, a short arc leaving it, and an open ring waiting. The arc stops
    before it arrives.</desc>

  <!--
    ═══════════════════════════════════════════════════════════════════════════
    THE MARK IS THE HANDOFF, and the GAP is the idea.

      filled disc   the person who holds everything today
      arc           the direction access travels — it has left, and it is short
      open ring     the person standing by, holding nothing. Open, because at
                    rest they have nothing. That is the promise, in one shape.

    🔴 VERSION ONE FAILED AT 16px, which is the size a favicon is actually seen
    at. The arc was dashed at 42% opacity, so below about 32px it disappeared
    entirely and the mark became two unrelated dots — and on a dark ground the
    ink-filled disc vanished too, leaving one ring. A mark that only works at
    the size you designed it is a drawing, not a mark.

    So: the arc is SOLID and heavy, the two nodes are large relative to the
    frame, and there is a separate 16px cut (relay-icon-16.svg) that drops the
    arc rather than rendering it as mud. Dark grounds get relay-mark-inverse.svg.
    ═══════════════════════════════════════════════════════════════════════════
  -->

  <circle cx="13" cy="35" r="9.5" fill="var(--ink, #1f1b16)"/>

  <!-- Leaving, and stopping short. Round-capped so the truncation reads as a
       held breath rather than a broken line. -->
  <path d="M 17.5 26.6 C 21 20.5, 22.5 19, 26.4 16.8" fill="none"
        stroke="var(--ink, #1f1b16)" stroke-width="4.5" stroke-linecap="round"/>

  <circle cx="36" cy="12" r="8" fill="none"
          stroke="var(--ochre, #b4703a)" stroke-width="4.5"/>
</svg>
