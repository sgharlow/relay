<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="standby-t">
  <title id="standby-t">Standing by</title>
  <!--
    24px grid, 1.75 stroke, round caps — one set, so a screen never mixes
    weights. Ink only: an icon that carries state colour competes with the state
    marks, which are the only things in this product allowed to mean a state.

    A person on settled ground. The ellipse is the same device the
    illustrations use for "this person is confirmed", so the icon and the
    picture teach the same thing.
  -->
  <circle cx="12" cy="8.2" r="3.2" fill="none" stroke="var(--ink, #1f1b16)" stroke-width="1.75"/>
  <path d="M 7.4 16.2 A 4.6 4.6 0 0 1 16.6 16.2" fill="none" stroke="var(--ink, #1f1b16)" stroke-width="1.75" stroke-linecap="round"/>
  <ellipse cx="12" cy="19.4" rx="7" ry="1.9" fill="none" stroke="var(--ink, #1f1b16)" stroke-width="1.75"/>
</svg>
