<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="sealed-record-t">
  <title id="sealed-record-t">The record, sealed</title>
  <!--
    24px grid, 1.75 stroke, round caps — one set, so a screen never mixes
    weights. Ink only: an icon that carries state colour competes with the state
    marks, which are the only things in this product allowed to mean a state.

    Interlocking links, because the audit log is hash-chained: each entry
    holds the one before it, and a link cannot be removed without the break
    showing.
  -->
  <rect x="3" y="9" width="7" height="6" rx="3" fill="none" stroke="var(--ink, #1f1b16)" stroke-width="1.75"/>
  <rect x="9.5" y="9" width="7" height="6" rx="3" fill="none" stroke="var(--ink, #1f1b16)" stroke-width="1.75"/>
  <rect x="16" y="9" width="5" height="6" rx="3" fill="none" stroke="var(--ink, #1f1b16)" stroke-width="1.75"/>
</svg>
