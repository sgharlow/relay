<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="check-in-t">
  <title id="check-in-t">Checking in</title>
  <!--
    24px grid, 1.75 stroke, round caps — one set, so a screen never mixes
    weights. Ink only: an icon that carries state colour competes with the state
    marks, which are the only things in this product allowed to mean a state.

    A pulse. The scheduler watches for its ABSENCE, so the icon is drawn as
    a living line rather than a calendar tick.
  -->
  <path d="M 2.5 12 L 7 12 L 9.5 6.5 L 13 17.5 L 15.5 12 L 21.5 12" fill="none" stroke="var(--ink, #1f1b16)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
