<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 160" width="260" height="160"
     role="img" aria-labelledby="nl-t nl-d">
  <title id="nl-t">A Relay email carries a short code you type yourself</title>
  <desc id="nl-d">An envelope holding a short typed code. No key and no link travel with it.</desc>

  <!--
    THE ANTI-PHISHING PROMISE, DRAWN AS WHAT IS *NOT* IN THE ENVELOPE.

    A message from Relay carries a short code the person types in themselves,
    on a page they navigated to. (One recorded last-resort message may carry a
    personal link; even it asks for nothing after the click.) That is what makes "if it asks you
    to click, it is not us" a rule a family can actually follow.

    So the envelope is open and its contents are visible and dull — four
    characters. There is no key inside, and the emptiness where one would be is
    the assurance, the same device the hero and key-stays-with-you both use.

    NO RED SLASH, no crossed-out padlock, no warning triangle. A prohibition
    sign would make the reader feel warned; this should make them feel
    unbothered.
  -->

  <!-- The envelope, open. -->
  <rect x="30" y="44" width="200" height="86" rx="8"
        fill="var(--paper-raised, #fffdf9)"
        stroke="var(--ink, #1f1b16)" stroke-width="2.5"/>
  <path d="M 30 52 L 130 100 L 230 52" fill="none"
        stroke="var(--rule-strong, #cfc7b8)" stroke-width="2.25" stroke-linejoin="round"/>

  <!-- What it carries: four characters, typed by hand at the other end. -->
  <!-- CHARACTER CELLS, not bars. Four solid strokes read as a redaction — the
       opposite meaning: something hidden, rather than something short and dull
       that the reader will type in themselves. -->
  <g fill="none" stroke="var(--ink, #1f1b16)" stroke-width="2.25">
    <rect x="92" y="106" width="18" height="24" rx="3"/>
    <rect x="114" y="106" width="18" height="24" rx="3"/>
    <rect x="136" y="106" width="18" height="24" rx="3"/>
    <rect x="158" y="106" width="18" height="24" rx="3"/>
  </g>
  <g stroke="var(--ink-faint, #71675a)" stroke-width="3" stroke-linecap="round">
    <path d="M 97 124 L 105 124"/>
    <path d="M 119 124 L 127 124"/>
    <path d="M 141 124 L 149 124"/>
    <path d="M 163 124 L 171 124"/>
  </g>
</svg>
