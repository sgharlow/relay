<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="state-released-t">
  <title id="state-released-t">Released — open to the people you named, and still reversible</title>
  <!--
    ONE FAMILY, FIVE STATES, drawn so the progression is legible without the
    labels: the same circle, filling as a release advances.

    NEVER RED. globals.css reserves clay for what is PERMANENT, and every state
    a user can reach is reversible — an owner checking in reverses PENDING,
    GRACE and RELEASED alike. Painting any of these in alarm colours would make
    the product feel like it does something it cannot take back.
  -->
  <circle cx="12" cy="12" r="7" fill="var(--ochre, #b4703a)"/>
  <path d="M 9.5 12 L 14.5 12 M 12.5 9.5 L 15 12 L 12.5 14.5" fill="none" stroke="var(--ochre-soft, #f6ead9)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
