<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="state-stood-down-t">
  <title id="state-stood-down-t">Stood down — you came back, and it closed again</title>
  <!--
    ONE FAMILY, FIVE STATES, drawn so the progression is legible without the
    labels: the same circle, filling as a release advances.

    NEVER RED. globals.css reserves clay for what is PERMANENT, and every state
    a user can reach is reversible — an owner checking in reverses PENDING,
    GRACE and RELEASED alike. Painting any of these in alarm colours would make
    the product feel like it does something it cannot take back.
  -->
  <circle cx="12" cy="12" r="7" fill="var(--sage, #4f7a6b)"/>
  <path d="M 14.5 10 A 3.2 3.2 0 1 0 15 13.6" fill="none" stroke="var(--sage-soft, #e6ede9)" stroke-width="1.75" stroke-linecap="round"/>
  <path d="M 14.9 7.6 L 15 10.2 L 12.5 10" fill="none" stroke="var(--sage-soft, #e6ede9)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
