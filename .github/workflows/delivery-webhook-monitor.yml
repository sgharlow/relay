# Dead-man's switch for the mail-delivery telemetry.
#
# WHAT IT PROTECTS. /circle can only tell an owner what became of a message
# because Resend pushes events to /api/resend/webhook. That endpoint can be
# deleted in a dashboard, or its signing secret rotated, and nothing in the
# application would notice: events stop, every address falls back to `unknown`,
# and the circle screen goes back to saying nothing at all — which reads to an
# owner as "no news" rather than "we cannot see". Silent blindness is the worst
# way a monitoring surface can fail, and this product has been caught by that
# shape more than once.
#
# WHY GITHUB ACTIONS. Same reasoning as scheduler-monitor.yml: a watchdog must be
# able to outlive the thing it watches. Hosting it on the same platform as the
# app would let one outage take out both, and silence would look like health.
#
# 🔴 FOR ITS FIRST WEEK THIS COULD NOT DETECT ANY OF THAT. The endpoint decided
# health from "has any event EVER arrived" — count(*) > 0 over an append-only
# table. Once the first event landed that was true forever, and 113 rows had
# landed. Every word above described a failure this job would have passed
# straight through: the secret could rotate, the endpoint could be deleted, and
# the probe would keep reporting "Delivery telemetry alive."
#
# Fixed 2026-08-15 by giving the check a condition that can still become false:
# messages Resend accepted more than six hours ago that NOTHING has been
# reported back about. That state is now reachable, and was demonstrated against
# production before this line was written. See lib/notify/webhook-health.ts and
# db/migrations/031_email_send_attempts.sql.
#
# WHY DAILY, NOT EVERY 30 MINUTES. The fact is still slow-moving on purpose:
# Relay sends rarely by design, so the check judges against SENDS rather than
# against the clock, and a six-hour settle window sits under it. A quiet week
# reports nothing either way — there is nothing to conclude — so sampling
# quickly buys nothing and spends attention. What daily costs is up to a day's
# delay noticing a dead stream, which is the right trade for a product whose
# mail is bursty; what it buys is an alarm nobody learns to ignore.
#
# 🔴 THE TRAP EVERY SCHEDULED ALARM HERE SHARES. sgharlow/relay is a PUBLIC
# repository, and GitHub automatically disables scheduled workflows in a public
# repository after 60 days with no repository activity. So this watchdog — like
# the other three — shares one failure mode with the thing it watches: a quiet
# owner. GitHub emails before disabling, so it is not silent; that email is the
# only warning, and a disabled workflow cannot report that it was disabled.
# The full account, and the off-GitHub heartbeat that would close it, are in
# .github/workflows/date-guards.yml.
#
# Feature: relay-standby

name: Delivery webhook monitor

on:
  schedule:
    - cron: '17 8 * * *' # daily, off the hour so it does not collide with everything else
  workflow_dispatch: {} # so the alarm can be proven to work on demand

concurrency:
  group: delivery-webhook-monitor
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe /api/health/delivery-webhook
        env:
          HEALTH_URL: https://relaystandby.com/api/health/delivery-webhook
        run: |
          set -uo pipefail

          # Two attempts, 30s apart — a single failure is as likely to be a
          # transient blip as a dead webhook, and a monitor that cries wolf gets
          # muted, which is the failure this exists to prevent.
          for attempt in 1 2; do
            body=$(curl -sS --max-time 20 -w '\n%{http_code}' "$HEALTH_URL" || echo -e '\n000')
            code=$(printf '%s' "$body" | tail -n1)
            payload=$(printf '%s' "$body" | sed '$d')

            # 🔴 THIS WAS `head -c 400` AND IT CUT OFF THE ONE THING WORTH
            # READING. `meaning` is the LAST key of the health payload, and the
            # ten keys in front of it run past 250 bytes on a healthy cluster and
            # further on an unhealthy one — so the explanation was truncated
            # mid-sentence precisely when there was an explanation. The
            # truncation rationale was sound for the wrong body: a non-200 from
            # Vercel IS a full HTML error page and dumping it buries everything.
            # So: extract `meaning` when the body is the JSON this endpoint
            # returns, and keep truncating when it is not.
            echo "attempt $attempt -> HTTP $code"
            meaning=$(printf '%s' "$payload" | jq -r '.meaning // empty' 2>/dev/null || true)
            if [ -n "$meaning" ]; then
              printf '%s\n' "$meaning"
            else
              printf '%s\n' "$payload" | head -c 400
            fi
            echo

            if [ "$code" = "200" ]; then
              echo "::notice::Delivery telemetry alive."
              exit 0
            fi

            if [ "$attempt" = "1" ]; then
              echo "Retrying in 30s before alarming..."
              sleep 30
            fi
          done

          # 🔴 THIS LINE READ "No delivery event has EVER arrived" FOR EVERY
          # FAILURE, AND HAD BEEN WRONG SINCE 2026-08-15. That was the only
          # unhealthy state when the text was written. `webhook-health.ts` has
          # since grown three more — `refusing`, `deaf` and `mute` — and the
          # commonest of them, a revoked RESEND_API_KEY, would have been reported
          # as its opposite: an operator told "no event has ever arrived" goes to
          # the webhook configuration page while every message the product sends
          # is being refused at the door. The checklist below had the same shape:
          # it was written for the original condition and never revisited.
          #
          # `lib/ops/monitor-diagnostics.test.ts` now derives the condition names
          # from the `const healthy = ...` expression in webhook-health.ts and
          # fails if this text does not mention one of them, so the next
          # condition added cannot arrive without its diagnosis.
          echo "::error::Delivery telemetry is UNHEALTHY or the endpoint is unreachable (HTTP $code). The printed 'meaning' above says which."
          echo "The four states this alarms on, and what each one means:"
          echo "  everHeard=false  No delivery event has EVER arrived — the webhook is unconfigured"
          echo "                   or has never worked. Expected on a fresh deployment only."
          echo "  refusing         The provider is REFUSING our sends and nothing has been accepted"
          echo "                   since. Relay is sending no mail at all: invitations, verifier"
          echo "                   notices and access codes are all failing. THIS IS THE OUTAGE."
          echo "  deaf             Messages were accepted more than the settle window ago and"
          echo "                   nothing was reported back about any of them — the event stream"
          echo "                   has stopped, so /circle cannot say what became of any message."
          echo "  mute             Events are arriving for messages with no send record, so"
          echo "                   recordSendAttempt has stopped writing and this check would"
          echo "                   otherwise revert to reporting healthy no matter what."
          echo ""
          echo "Check, in the order the state implies:"
          # 🔴 BOTH POINTERS BELOW WERE WRONG WHEN THIS TEXT WAS WRITTEN, and a
          # pointer an operator cannot follow at 3am costs more than no pointer.
          # (1) The runbook has no §RESEND_API_KEY heading — that key is covered
          # in "§6 — the rest", and somebody searching for the § they were given
          # finds nothing. (2) The lockout precedent is not in migration 030:
          # 030's grant resolved once against the tables that existed then, 031
          # created email_send_attempts, and the first read as relay_dev failed
          # with `permission denied`. The account is in 032's header. Both errors
          # were inherited verbatim from lib/notify/webhook-health.ts, which
          # still carries them, and copying a line is not checking it.
          echo "  refusing -> RESEND_API_KEY first (revoked or wrongly rotated is the commonest"
          echo "              cause), then whether the Resend account is suspended and the sending"
          echo "              domain still verified. docs/secret-rotation-runbook.md '§6 — the rest'."
          echo "  deaf     -> Resend dashboard -> Webhooks: does the endpoint exist and point at"
          echo "              https://relaystandby.com/api/resend/webhook ? Does RESEND_WEBHOOK_SECRET"
          echo "              in Vercel still match its signing secret? A rotation silently drops every event."
          echo "  mute     -> a privilege or schema change on email_send_attempts. The"
          echo "              031/032 default-privileges gap locked the application out of that"
          echo "              exact table once: see db/migrations/032_relay_dev_default_privileges.sql."
          echo "  any      -> npx tsx --env-file=.env.local scripts/verify-delivery-webhook.ts <your-address>"
          exit 1
