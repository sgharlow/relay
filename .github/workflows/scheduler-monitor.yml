# Dead-man's switch for the release scheduler.
#
# WHY THIS LIVES IN GITHUB ACTIONS, NOT IN VERCEL. The thing being watched IS a
# Vercel Cron. A monitor hosted on Vercel would share fate with it: if Vercel
# Cron stops firing, the heartbeat stops AND the monitor stops, and silence
# looks exactly like health. A watchdog must be able to outlive the thing it
# watches, so it runs somewhere else entirely.
#
# WHAT IT PROTECTS. Relay's entire promise is that a vault opens when a trigger
# fires. That sweep runs unattended and its success signal is a side effect — a
# row in scheduler_runs. Nobody notices a side effect that stops happening.
# /api/health/scheduler turns that silence into a 503; this turns the 503 into
# an email. Without both halves the endpoint is decoration.
#
# A failing run emails the repository owner through GitHub's default
# notification settings — no third-party uptime account, no secret to rotate,
# no monthly cost.
#
# 🔴 THE TRAP EVERY SCHEDULED ALARM HERE SHARES. sgharlow/relay is a PUBLIC
# repository, and GitHub automatically disables scheduled workflows in a public
# repository after 60 days with no repository activity. So this watchdog — like
# the other three — shares one failure mode with the thing it watches: a quiet
# owner. GitHub emails before disabling, so it is not silent; that email is the
# only warning, and a disabled workflow cannot report that it was disabled.
# The full account, and the off-GitHub heartbeat that would close it, are in
# .github/workflows/date-guards.yml.
#
# Feature: relay-h0-mvp (CC9)

name: Scheduler heartbeat monitor

on:
  schedule:
    # Every 30 minutes. The endpoint's own staleness threshold is 9000s (2.5h),
    # so this samples well inside the window and an outage is caught long before
    # a real trigger could be missed.
    - cron: '*/30 * * * *'
  # 🔴 THIS SAID `workflow_dispatch: {} # so the alarm can be proven to work on
  # demand` UNTIL 2026-08-28 AND THE COMMENT WAS FALSE, in exactly the way the
  # canary's was. The probe step hard-codes HEALTH_URL, so a manual run could
  # only ever hit production and could only ever pass. In 485 runs this workflow
  # has been red once (2026-08-18, a real staleness) — which is one more than
  # the canary, and still not a red anybody asked for.
  #
  # `health_url` exists so the alarm can be pointed somewhere dead. A host under
  # `.invalid` (RFC 2606) never resolves, so the probe fails without sending a
  # single packet to anybody else's server.
  #
  # ✅ PROVEN RED ON DEMAND 2026-08-29, run 33237979699. Both attempts returned
  # HTTP 000, the 30s retry happened rather than being skipped, `::error::` was
  # emitted with the checklist, exit 1.
  #
  # What it does NOT cover: HTTP 000 is a request that never completed, so the
  # `payload`/`head -c 400` branch never ran. A monitor that reaches the endpoint
  # and reads an UNHEALTHY body is a different path, and the only way to exercise
  # it for real is an actually-stale scheduler. Named because the canary's header
  # makes the same distinction, for the same reason.
  workflow_dispatch:
    inputs:
      health_url:
        description: 'Health endpoint to probe. Point it somewhere dead to prove the alarm fires.'
        required: false
        default: 'https://relaystandby.com/api/health/scheduler'

concurrency:
  group: scheduler-monitor
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe /api/health/scheduler
        env:
          # `inputs.health_url` is empty on a scheduled run, so the fallback is
          # what the schedule uses and the dispatch default is only there to make
          # the manual form self-explanatory. Scheduled behaviour is unchanged.
          HEALTH_URL: ${{ inputs.health_url || 'https://relaystandby.com/api/health/scheduler' }}
        run: |
          set -uo pipefail

          # Two attempts, 30s apart. A single failed probe is as likely to be a
          # transient network blip as a dead scheduler, and a monitor that cries
          # wolf gets muted — which is the failure mode this exists to prevent.
          for attempt in 1 2; do
            body=$(curl -sS --max-time 20 -w '\n%{http_code}' "$HEALTH_URL" || echo -e '\n000')
            code=$(printf '%s' "$body" | tail -n1)
            payload=$(printf '%s' "$body" | sed '$d')

            # Truncated: a non-200 from Vercel is a full HTML error page, and
            # dumping it buries the one line that matters under a screen of
            # markup. Proven the hard way on the alarm's first real firing.
            echo "attempt $attempt -> HTTP $code"
            printf '%s\n' "$payload" | head -c 400
            echo

            if [ "$code" = "200" ]; then
              echo "::notice::Scheduler healthy."
              exit 0
            fi

            if [ "$attempt" = "1" ]; then
              echo "Retrying in 30s before alarming..."
              sleep 30
            fi
          done

          echo "::error::Scheduler heartbeat is STALE or unreachable (HTTP $code)."
          echo "The Vercel Cron that advances release states has not recorded a run"
          echo "inside its staleness threshold. Triggers may not be firing."
          echo ""
          echo "Check, in order:"
          echo "  1. Vercel dashboard -> the project -> Cron Jobs: is the job enabled and succeeding?"
          echo "  2. GET $HEALTH_URL for lastRunAt and ageSeconds."
          echo "  3. Vercel runtime logs for /api/cron/heartbeat."
          exit 1
