# Are the scheduled monitors actually running?
#
# 🔴 WHY THIS FILE EXISTS. On 2026-08-29 the production canary ran FOUR times
# against a designed 96, and the scheduler monitor four against 48. Production
# had no effective synthetic monitoring for three days and nothing said so — it
# was found by a person running a query, twice (2026-08-27, then again on
# 2026-08-29). The canary exists so a breakage is found by a machine at 3am
# instead of by a person poking at it; when the canary itself stops, the same
# argument applies one level up.
#
# ⚠️ THE MEASUREMENT THAT DECIDED THIS WORKFLOW'S CADENCE. Scheduled runs per
# day, 2026-08-24..29:
#
#   production-canary         nominal 96/day  ->  36, 38, 24,  2,  3,  4
#   scheduler-monitor         nominal 48/day  ->  25, 26, 17,  3,  2,  4
#   delivery-webhook-monitor  nominal  1/day  ->   1,  1,  1,  1,  1,  1
#   date-guards               nominal  1/day  ->   1,  1,  1,  1,  1,  1
#   kms-wall                  nominal  1/day  ->   1,  1,  1,  1,  1
#
# EVERY DAILY WORKFLOW DELIVERED 100% ON PRECISELY THE DAYS THE HIGH-FREQUENCY
# ONES COLLAPSED. That is why this watcher is daily: the reliable tier watches
# the unreliable one. It is a narrow, measured claim about this repo right now,
# not a general statement that GitHub schedules are dependable.
#
# 🔴 AND IT DISPROVES BOTH CAUSES THE REGISTER RECORDED. `deferred.the-scheduled-
# monitors-are-collapsing` names (1) the account's Actions minutes reading 100%
# used and (2) a GitHub incident on 08-26/27, and warns "do not settle on either
# without the re-measure." Minutes exhaustion would starve the daily workflows
# too — it did not. An incident on 08-26/27 would be transient — the collapse
# persisted through 08-29. What the data actually shows is frequency-selective:
# the daily tier is untouched and the sub-hourly tier is not.
#
# 🔴 THIS DOES NOT CLOSE B12, AND MUST NOT BE READ AS DOING SO. This watcher
# lives inside the thing it watches: if GitHub Actions stops entirely it stops
# too, and reports nothing. What it catches is the failure that ACTUALLY
# happened — a selective collapse — and it would have caught that on day one.
# The off-GitHub heartbeat remains the real answer
# (`deferred.the-alarms-live-inside-the-thing-they-watch`).
#
# ⚠️ IT IS RED TODAY, ON PURPOSE. The monitors are collapsed as this ships, so
# this workflow goes red on its first scheduled run. That is the alarm being
# correct, not broken. Its failure text says so and points at the register, so a
# reader does not investigate a known defect from scratch. If it is still red
# when the cause is fixed, THAT is the new finding.
#
# Feature: relay-h0-mvp
# Requirements: B11 (measurement), B12.i (the interim alarm)

name: Cadence watch

on:
  schedule:
    # Daily at 09:43 UTC — off the hour, and clear of the other three daily jobs
    # (06:17 date-guards, 06:43 kms-wall, 08:17 delivery-webhook-monitor) so a
    # bad minute at GitHub cannot take the whole daily tier at once.
    - cron: '43 9 * * *'
  workflow_dispatch: {} # proven red on demand 2026-08-29, before it was ever scheduled
  push:
    branches: [master]
    paths:
      - 'lib/ops/cadence-wall.ts'
      - 'scripts/check-cadence.ts'
      - '.github/workflows/cadence-watch.yml'

concurrency:
  group: cadence-watch
  cancel-in-progress: false

permissions:
  # Reading Actions run metadata. Nothing else, and nothing is written.
  actions: read
  contents: read

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # No `npm ci`, for the same reason production-canary.yml gives: this
      # imports one dependency-free module and Node strips the types natively,
      # so a broken lockfile can never stop the alarm from firing.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Count scheduled runs in the last 24h
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-cadence.ts

      - name: Explain a failure
        if: failure()
        run: |
          echo "::error::The scheduled monitors are not running often enough to be monitors."
          echo "Read the step above for the counts and the floors. Then, in order:"
          echo "  1. Is this ALREADY KNOWN? deferred.the-scheduled-monitors-are-collapsing (B11)"
          echo "     was open as of 2026-08-29. If the counts look like the ones recorded there,"
          echo "     this is that defect still open, not a new one."
          echo "  2. Is a count ZERO? That is different. GitHub disables scheduled workflows on"
          echo "     public repos after 60 days without repository activity, and emails first."
          echo "     Check that mail before assuming an outage."
          echo "  3. Did a DAILY workflow appear in the findings? That would be new, and would"
          echo "     break the assumption this watcher is built on — that the daily tier is"
          echo "     reliable. Re-measure all five before trusting anything scheduled."
          echo ""
          echo "What it means while red: a broken deploy is caught by the next scheduled canary"
          echo "run, which may be hours away rather than the quarter of an hour the cron asks for."
