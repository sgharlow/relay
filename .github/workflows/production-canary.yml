# Synthetic canary against production.
#
# WHAT THIS IS FOR, AND WHY IT IS NOT AN ERROR REPORTER. On 2026-08-08 a validly
# signed verifier link returned an unhandled 500 in production, behind a green
# suite of a thousand tests, and it was found by a person poking at it by hand.
# This exercises the real paths from outside, on a schedule, so the next one is
# found by a machine at 3am instead.
#
# ⚠️ THIS SAID "Next 14 gives no global hook for route errors" UNTIL 2026-08-21,
# which stopped being true at the Next 16 upgrade — `onRequestError` exists and
# lib/ops/error-reporter.ts is wired to it. The two are complements: the hook
# reports what the application THREW; this asserts that the refusals still
# refuse, and a boundary that quietly starts answering 200 throws nothing for
# any hook to catch.
#
# WHY THE CHECKS ARE BEHAVIOURAL. Every page in this app returned 200 for the
# entire time that verifier link was broken. So these assert that forged tokens
# are refused, that anonymous checkout is refused, and that an unsigned billing
# webhook is refused — the things whose failure actually costs something.
#
# NO CREDENTIALS, NO WRITES. It runs on a public runner with no secrets, and
# nothing it does persists a row. That is a constraint on the checks, enforced
# by a test: any POST check must expect a refusal.
#
# Hosted here rather than on Vercel for the same reason as the scheduler
# monitor: a watchdog must be able to outlive the thing it watches.
#
# 🔴 THE TRAP EVERY SCHEDULED ALARM HERE SHARES. sgharlow/relay is a PUBLIC
# repository, and GitHub automatically disables scheduled workflows in a public
# repository after 60 days with no repository activity. So this watchdog — like
# the other three — shares one failure mode with the thing it watches: a quiet
# owner. GitHub emails before disabling, so it is not silent; that email is the
# only warning, and a disabled workflow cannot report that it was disabled.
# The full account, and the off-GitHub heartbeat that would close it, are in
# .github/workflows/date-guards.yml.
#
# Feature: relay-h0-mvp (CC9)

name: Production canary

on:
  schedule:
    # Every 15 minutes REQUESTED. ("Fast enough that a broken deploy is caught
    # before much paid traffic lands on it" until 2026-08-21 — paid advertising
    # was retired on 2026-08-16. Then "a broken deploy is caught within a
    # quarter of an hour of landing" until 2026-08-28, when it was measured.)
    #
    # 🔴 THE REQUESTED CADENCE IS NOT THE DELIVERED CADENCE, AND THE GAP IS NOT
    # SMALL. Measured 2026-08-29 over the workflow's whole life (2026-08-09 →
    # 2026-08-29, 19.94 days): 684 scheduled runs against a nominal 1,914 —
    # a 35.7% delivery rate. Gap between consecutive scheduled runs:
    # median 31 min, p90 65 min, p99 211 min, MAX 697 min (11.6 h). Only 30 of
    # 683 gaps were the ≤16 min the cron asks for.
    #
    # So the honest claim is: a broken deploy is *typically* caught within about
    # half an hour, and the tail is hours. Anything that needs a bounded
    # detection latency cannot be built on a GitHub schedule — that is B12's
    # case, not a tuning problem, and lowering the cron interval does not fix it
    # (GitHub drops runs, it does not queue them: `created_at == run_started_at`).
    #
    # Re-derive rather than trust; this comment is a measurement, not a fact:
    #   gh api "repos/sgharlow/relay/actions/workflows/production-canary.yml/runs?per_page=100" \
    #     --paginate --jq '.workflow_runs[] | select(.event=="schedule") | .created_at'
    # then diff consecutive timestamps. Per-day counts (the B11 collapse view):
    #   ... | cut -dT -f1 | sort | uniq -c
    #
    # 🔴 AND IT IS WORSE RIGHT NOW THAN THAT AVERAGE. Per-day scheduled runs
    # were 40–55 through 2026-08-25, then 24 on 08-26, and 2 on 08-27, 3 on
    # 08-28, 4 on 08-29. This canary is running about four times a day, not 96.
    #
    # ⚠️ THIS COMMENT BLAMED THE ACCOUNT'S ACTIONS MINUTES UNTIL 2026-08-29 AND
    # THAT WAS WRONG. Re-measured that day across all five scheduled workflows:
    # every DAILY one (delivery-webhook-monitor, date-guards, kms-wall) delivered
    # 1/1 on exactly the days these high-frequency ones collapsed. Minutes
    # exhaustion would have starved those too. So would nothing about a transient
    # 08-26/27 incident explain a collapse still present on 08-29. The real
    # pattern is FREQUENCY-SELECTIVE: sub-hourly schedules are dropped, daily
    # ones are not.
    #
    # That mattered practically: the planned response was to put a payment method
    # on the GitHub account, which would have bought nothing.
    #
    # Watched since 2026-08-29 by `.github/workflows/cadence-watch.yml` (daily —
    # the reliable tier watching the unreliable one) and re-derivable any time
    # with `npm run check:cadence`. B11.1 still re-measures on 2026-09-02.
    - cron: '*/15 * * * *'
  # 🔴 THIS SAID `workflow_dispatch: {} # so the alarm can be proven to work on
  # demand` FOR ITS WHOLE LIFE AND THE COMMENT WAS FALSE. The probe step ran the
  # canary with no argument, so a manual run could only ever hit production and
  # could only ever pass; making it go red needed a commit, which is exactly what
  # nobody does to test an alarm. In 684 scheduled runs between 2026-08-09 and
  # 2026-08-29 (not the "~1,200" this line claimed until 2026-08-29 — that
  # number was the nominal schedule, never counted) this workflow was never red
  # once, and B4's own bar is that a checker which has only ever passed has not
  # been seen to work.
  #
  # `scripts/canary.ts` already accepted a base URL — `argv[2]`, then
  # CANARY_BASE_URL — and this file simply never passed one. Dispatch it against
  # an unreachable host to force every check to fail and confirm the resulting
  # GitHub notification actually reaches a watched inbox.
  #
  # ✅ PROVEN RED 2026-08-29, run 33237399208 (`workflow_dispatch`,
  # base_url `https://relay-proof-of-red.invalid` — RFC 2606 reserves
  # `.invalid`, so nothing resolves and no packet reaches anybody else's host).
  # All 6 checks failed, the `Explain a failure` step ran, `::error::` was
  # emitted, conclusion `failure`. That is the FIRST red in this workflow's
  # life; the "~1,200 runs, never red" line above was replaced the same day.
  #
  # What that proof does and does not cover, precisely. It exercised the
  # request-failed path (fetch throws → `failures` → exit 1). It did NOT
  # exercise `evaluateCheck` returning not-ok, because DNS failed before any
  # response existed to evaluate. That branch — the one that catches a boundary
  # quietly answering 200 — is covered by unit tests instead
  # (`lib/ops/canary.test.ts:40` status mismatch, `:47` body-missing-on-200),
  # and both branches join the same two lines that set the exit code. Said out
  # loud because "proven red" without saying WHICH red is how a half-proof gets
  # remembered as a whole one.
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to probe. Point it somewhere dead to prove the alarm fires.'
        required: false
        default: 'https://relaystandby.com'
  push:
    branches: [master]
    paths:
      - 'lib/ops/canary.ts'
      - 'scripts/canary.ts'
      - '.github/workflows/production-canary.yml'

concurrency:
  group: production-canary
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # No `npm ci`. The canary imports one dependency-free module and Node
      # strips the types natively, so this job needs nothing installed — which
      # keeps it fast and means a broken lockfile can never stop the alarm from
      # firing. A watchdog with a build step is a watchdog with a way to fail
      # silently.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probe production
        # `inputs.base_url` is empty on a scheduled or push run, so the fallback
        # is what the schedule uses and the dispatch default is only there to
        # make the manual form self-explanatory. The scheduled behaviour is
        # unchanged by this.
        env:
          CANARY_BASE_URL: ${{ inputs.base_url || 'https://relaystandby.com' }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/canary.ts

      - name: Explain a failure
        if: failure()
        run: |
          echo "::error::Production canary FAILED — see the probe step for which check and what it means."
          echo "Each failing check prints its consequence. Then, in order:"
          echo "  1. Is the site up at all?           https://relaystandby.com"
          echo "  2. Did a deploy just land?          vercel ls relay --prod"
          echo "  3. Vercel runtime logs for the failing route."
          echo "  4. If it is the scheduler, the dedicated monitor covers that separately."
