# Did a walk leave rows on the production cluster, and has anybody looked?
#
# 🔴 THE GAP, IN THE REGISTER'S OWN WORDS. `deferred.verify-live-cannot-enter-ci`
# (D4) is blocked on a separate test cluster — infrastructure with a cost
# attached, Steve's call. But that entry names a second finding and says which
# one matters more:
#
#   "🔑 THE REAL GAP IT EXPOSES: a separate test cluster would make the walks
#    safe, but it would NOT make an abandoned row visible. A count of disposable
#    accounts older than a day, checked somewhere, is a smaller and more useful
#    thing than the cluster — and nothing in this repo does it."
#
# `scripts/disposable-sweep.ts` has produced that count since 2026-08-19 and
# NOTHING RAN IT. On 2026-08-30 it was reporting a FAIL that no one had seen. A
# check somebody has to remember is a check that works on the days they remember,
# which is the identical weakness that keeps the walks themselves out of CI.
#
# ⚠️ WHY THIS PROBES AN ENDPOINT INSTEAD OF RUNNING THE SWEEP. Running the sweep
# here needs a database credential on a runner. `.env.ro` is a static access-key
# pair, so putting it in Actions is D21 — Steve's, a credential decision — and
# minting an OIDC role for `relay_ro` instead is an IAM change, also Steve's, and
# carries the recursion docs/iam-wall-oidc-role-proposal.md names. Either route
# waits on a person, and this has waited long enough. The application already
# holds the credential, so the question is answered where the answer is and this
# job reaches it holding NOTHING — which is also the property that stops the
# watcher sharing fate with the watched.
#
# ⚠️ DAILY, NOT HOURLY, AND THE TIER IS THE POINT. `cadence-watch` measured the
# daily tier delivering 100% on precisely the days the sub-hourly tier fell to
# ~3% (B11). A leaked row is not an emergency — it is a thing to find before the
# next walk, and a daily job that actually runs beats an hourly one that does not.
#
# WHAT GREEN MEANS: no reserved-domain account has been on the cluster for more
# than a day, and the dangling-row count has not grown past its recorded
# baseline. NOT that the cluster is empty — see lib/ops/orphan-health.ts for why
# today's 28 dangling rows are a baseline and not a tolerance.
#
# 🔴 THE TRAP THIS FILE INHERITS, like every scheduled alarm here.
# sgharlow/relay is a PUBLIC repository, and GitHub disables scheduled workflows
# in a public repo after 60 days with no repository activity. So this watchdog
# shares one failure mode with the thing it watches: a quiet period. The full
# account, and the off-GitHub heartbeat that would close it, are in
# .github/workflows/date-guards.yml and `deferred.the-alarms-live-inside-the-
# thing-they-watch` (B12).
#
# It is a sharper trap here than for the sibling probes, and worth naming as
# such: orphan rows accumulate precisely when NOBODY IS LOOKING, which is the
# same condition that disables the schedule. A quiet fortnight is exactly when
# this job both matters most and is most likely to have stopped.

name: Orphan monitor

on:
  schedule:
    # 10:41 UTC. Offset from the other daily monitors so four jobs are not
    # queued on the same minute; nothing here is time-sensitive.
    - cron: '41 10 * * *'
  workflow_dispatch:
    inputs:
      health_url:
        description: 'Health endpoint to probe. Point it somewhere dead to prove the alarm fires.'
        required: false
        default: 'https://relaystandby.com/api/health/orphans'

concurrency:
  group: orphan-monitor
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Probe /api/health/orphans
        env:
          HEALTH_URL: ${{ inputs.health_url || 'https://relaystandby.com/api/health/orphans' }}
        run: |
          set -uo pipefail
          for attempt in 1 2; do
            body=$(curl -sS --max-time 20 -w '\n%{http_code}' "$HEALTH_URL" || echo -e '\n000')
            code=$(printf '%s' "$body" | tail -n1)
            payload=$(printf '%s' "$body" | sed '$d')
            echo "attempt $attempt -> HTTP $code"
            printf '%s\n' "$payload" | head -c 600
            echo
            if [ "$code" = "200" ]; then
              echo "::notice::Nothing left behind. $(printf '%s' "$payload" | head -c 300)"
              exit 0
            fi
            if [ "$attempt" = "1" ]; then
              echo "Retrying in 30s before alarming..."
              sleep 30
            fi
          done
          echo "::error::Rows were left on the PRODUCTION cluster, or the probe could not look (HTTP $code)."
          echo ""
          echo "Read the payload above first — it says which of the two findings fired."
          echo ""
          echo "  staleDisposableAccounts > 0"
          echo "    A reserved-domain account has been on the cluster for more than a day. A walk"
          echo "    died part-way, or a fixture script had no close step. EVERY RUN THAT LEAVES"
          echo "    ONE OF THESE REPORTS SUCCESS, which is why this job exists."
          echo "    Run: npm run verify:orphans        (read-only; it never deletes)"
          echo "    Then close them with the product's own cascade — deleteAccount() — and NEVER"
          echo "    a hand-written DELETE. This schema has no foreign keys, and the 28 dangling"
          echo "    rows in the baseline are what a hand-written delete already produced once."
          echo "    An account reported HELD is not sweepable: it holds live billing, or stands"
          echo "    by in another owner's roster."
          echo ""
          echo "  danglingRows > danglingBaseline"
          echo "    Rows point at a users row that no longer exists, and there are MORE than the"
          echo "    known residue. Something deleted a users row without running the cascade."
          echo "    The baseline is recorded in lib/ops/orphan-health.ts with the date it was"
          echo "    measured; the standing rows are D20, an open ruling, deliberately not an alarm."
          echo ""
          echo "  HTTP 000, or a 5xx that is not 503"
          echo "    The probe could not READ the answer. That is not a finding about the cluster;"
          echo "    it is this monitor being unable to look, which is deliberately also not green."
          echo "    Check the site is up before investigating orphans at all."
          exit 1
