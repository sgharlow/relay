# Continuous integration.
#
# This repo had a thousand passing tests and nothing that ran them. Every green
# claim in every document rested on someone having run `npx vitest` locally and
# remembered the number correctly — which is exactly how a suite rots into
# decoration while the badge stays green.
#
# The steps are ordered cheapest-signal-first so a failure reports in seconds
# rather than minutes, but none of them are optional and none are `|| true`.
# In particular the test step runs the real suite: a pipeline that only checks
# syntax on a repo whose value is correctness is a pipeline that lies.
#
# Feature: relay-h0-mvp

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

concurrency:
  # Supersede an in-flight run for the same ref — but never for master, where
  # every commit's result is worth having on the record.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # No secrets are exposed to this job. The suite must pass without database,
    # KMS or Stripe credentials — pools and clients initialise lazily precisely
    # so that holds. If a test ever needs a real credential to pass, that is the
    # test to fix, not this file.
    steps:
      - uses: actions/checkout@v4
        with:
          # 🔴 THE TRAILER CHECK BELOW READS 50 COMMITS AND WAS BEING GIVEN ONE.
          # actions/checkout clones shallow by default (fetch-depth: 1), so
          # `git log -n 50` had exactly one commit to look at. The step passed on
          # every push and its green meant one-fiftieth of what it claimed — a
          # check scoped to a history the runner had not downloaded.
          #
          # 🔴 AND 50 WAS WRONG TOO — 2026-09-03. A shallow clone treats its
          # boundary commit as a ROOT, and a root commit "introduces" every
          # file in its tree. So for any file not touched inside the window,
          # `git log -1 -- <file>` names the BOUNDARY commit as the last change.
          # src/app/terms/legal-pages.test.ts compares each legal page's
          # declared UPDATED date with that answer, and it went red on PR #61 —
          # a two-document change — because a night of merges moved the window
          # past /privacy's real last change (08-21) and git attributed the file
          # to the boundary (08-24). Every later PR would have failed the same
          # way. Full history is the only depth at which "the last change to
          # this file" is a fact rather than an artefact of the fetch.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # 🔴 THIS RAN `npm test` AND THE DECLARED COVERAGE THRESHOLDS WERE EVALUATED
      # BY NOTHING. `vitest.config.ts` has declared lines 80 / functions 80 /
      # branches 70 / statements 80 since the config was written; `npm test` does
      # not read them, `gate` does not invoke `test:coverage`, and no workflow did
      # either. So the thresholds were counted as protection in exactly the review
      # that should have caught their absence — the decorative-guard shape this
      # repo keeps meeting, and the same one that produced every check in lib/ops/.
      #
      # `test:coverage` rather than an extra step: it runs the same suite once,
      # with instrumentation, and fails the job when a threshold is breached.
      # Adding a second step would run ~3000 tests twice to learn one more fact.
      #
      # The scope was measured before being widened, and the widened figure
      # clears — but read lib/ops/coverage-scope.ts before trusting that
      # sentence: the blended number is arithmetic over two subset runs, not a
      # single run of the shipped config, and statements has under two points of
      # margin. THIS STEP IS THE FIRST THING THAT EVALUATES THE THRESHOLDS AT
      # ALL — `npm run gate` runs `vitest --run`, which does not read them — so
      # a breach shows up here, on master, and nowhere earlier. Run
      # `npm run test:coverage` locally before pushing anything that moves
      # coverage. Proven to fail by planting a threshold above the real figure,
      # not by passing once.
      - name: Test (with coverage thresholds enforced)
        run: npm run test:coverage

      # THE SECOND NUMBER, AND WHY THE STEP ABOVE WAS NOT ENOUGH.
      #
      # The thresholds enforced above are BLENDED across `lib/**` and
      # `src/app/api/**`, and those two layers are not the same size: ~5,000
      # statements against ~1,600. On 2026-08-30 the blend read 87.61% — well
      # clear of an 80 floor — while the request layer alone sat at 66.15%
      # statements / 59.17% branches, with 26 of 76 route handlers executing no
      # test at all. Every gate in this file was green for the whole of that.
      #
      # Widening the coverage scope on 2026-08-21 made that layer VISIBLE. It
      # could not stop the shortfall being absorbed by a larger layer, because
      # that is what an average does. This step removes the weighting.
      #
      # IT MUST STAY IMMEDIATELY AFTER THE STEP ABOVE. It reads that run's
      # `coverage/coverage-final.json` and does not produce one; a report from
      # some earlier run would be a green about a run that never happened. It
      # exits 2 — "could not look", distinct from a pass — when the report is
      # missing or does not describe this layer, so a reordering fails loudly
      # rather than quietly measuring nothing.
      #
      # Proven in all three directions on 2026-08-30: red against a planted
      # floor, exit 2 with the report removed, exit 2 with a report describing
      # one file. Not proven by passing once.
      - name: Request-layer coverage floor
        run: npm run check:route-coverage

      - name: Build
        run: npm run build

      # Documented in the global rules and learned the hard way twice: an
      # AI-co-authorship trailer has triggered compliance flags on a public
      # repo, each time needing a force-pushed history rewrite. Cheaper to
      # catch on the way in.
      - name: No AI co-authorship trailers
        run: |
          set -uo pipefail

          # A CHECK THAT CANNOT SAY HOW MUCH IT LOOKED AT IS NOT A CHECK. This
          # step read fifty commits from a one-commit clone for its whole life
          # and reported "Clean." every time. Failing loudly on a shallow clone
          # costs nothing and makes the silent version impossible: if the
          # checkout config is ever reverted, this goes red instead of quietly
          # narrowing to HEAD.
          examined=$(git rev-list --count HEAD)
          if [ "$examined" -lt 2 ]; then
            echo "::error::Only $examined commit is available — the clone is shallow, so this check cannot see the history it claims to. Set fetch-depth on actions/checkout."
            exit 1
          fi

          count=$(git log --format=%B -n 50 | grep -ciE "co-authored-by: claude|noreply@anthropic" || true)
          if [ "$count" != "0" ]; then
            echo "::error::Found $count commit(s) carrying an AI co-authorship trailer."
            exit 1
          fi
          echo "Clean across $examined commit(s) of available history."
