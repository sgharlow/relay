<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400"
     role="img" aria-labelledby="av-t av-d">
  <title id="av-t">Relay</title>
  <desc id="av-d">A filled point, a short arc leaving it, and an open ring waiting. The arc stops
    before it arrives.</desc>

  <!--
    ═══════════════════════════════════════════════════════════════════════════
    THE AD-ACCOUNT AVATAR (400 × 400). Source for docs/ad-assets/avatar-400.png.

    Needed at ACCOUNT CREATION on both platforms, before any campaign exists —
    the first row of the asset matrix and the first thing the sitting asks for.

    NOT GENERATED. `PROMPTS.md` §Concept E says so itself: "Faster and exact:
    render src/app/icon.svg at 400 × 400 instead of generating it… The SVG is
    the authoritative mark." An image model asked to reproduce an existing logo
    returns something that resembles it, and a brand mark that resembles itself
    is a different mark.

    🔴 BUT NOT icon.svg EITHER, AND THE REASON IS WRITTEN IN icon.svg. That file
    is the 32px cut and it deliberately DROPS the connecting arc: "below about
    32px it renders as two grey pixels sitting in the gap that carries the whole
    idea, which is worse than leaving it out." At 400 × 400 that constraint is
    gone, and dropping the arc would ship an avatar missing the element the mark
    is *about* — the handoff. So the geometry here is the FULL mark
    (public/assets/brand/relay-mark.svg), scaled 48 → 400, on the paper tile
    icon.svg contributes.

    Literal hex, not tokens: this is rasterised standalone and no stylesheet is
    in scope. Values are --paper, --ink and --ochre from globals.css.

    Corner radius follows icon.svg's proportion (7/32 of the side).
  -->

  <rect width="400" height="400" rx="87.5" fill="#f7f4ee"/>

  <!-- 48-unit mark, inset 12% on every side.
       The mark's own viewBox margins are NOT enough padding here: rendered at
       8.3333 (a bare 48 → 400) the ochre ring and the ink disc both run almost
       to the corners, which reads as cramped and is the first thing platforms
       crop into a circle. Scaled to 76% and centred instead — the avatar prompt
       asks for "clean generous padding inside the tile", and a mark that
       survives a circular crop is the actual requirement. -->
  <g transform="translate(48,48) scale(6.3333)">
    <circle cx="13" cy="35" r="9.5" fill="#1f1b16"/>

    <!-- Leaving, and stopping short. Round-capped so the truncation reads as a
         held breath rather than a broken line. -->
    <path d="M 17.5 26.6 C 21 20.5, 22.5 19, 26.4 16.8" fill="none"
          stroke="#1f1b16" stroke-width="4.5" stroke-linecap="round"/>

    <circle cx="36" cy="12" r="8" fill="none"
            stroke="#b4703a" stroke-width="4.5"/>
  </g>
</svg>
